services:
  postgres:
    image: postgres:17-alpine
    container_name: clinicos-postgres
    environment:
      POSTGRES_DB: clinicos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicos"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: >
      postgres
      -c shared_preload_libraries=
      -c max_connections=100

  minio:
    image: minio/minio:latest
    container_name: clinicos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  migrate:
    image: flyway/flyway:13.5-alpine
    container_name: clinicos-flyway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/clinicos
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: local-dev-only
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./apps/api/src/main/resources/db/migration:/flyway/sql
    command: migrate
    profiles:
      - migrate

volumes:
  postgres_data:
  minio_data: