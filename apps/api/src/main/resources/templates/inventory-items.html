<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('جرد الأصناف')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" @keydown.escape.window="drawerOpen = false"
      th:attr="data-toast=${toastMessage},data-toast-type=${toastType}">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-7xl w-full mx-auto clinicos-section">
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-8">
        <div class="space-y-1.5">
          <h1 class="text-3xl font-extrabold text-teal-900 tracking-tight">جرد الأصناف</h1>
          <p class="text-sm text-on-surface-variant">الرصيد الحي من المخزن والتراي — أي تعديل أو حذف بيمر بموافقة المدير.</p>
        </div>
        <a th:href="${includeArchived} ? @{/inventory/items} : @{/inventory/items(includeArchived=true)}"
           class="clinicos-btn clinicos-btn--secondary">
          <span th:text="${includeArchived} ? 'إخفاء المؤرشفة' : 'عرض المؤرشفة'">عرض المؤرشفة</span>
        </a>
      </div>

      <div class="clinicos-card p-6 mb-8">
        <div class="flex items-center gap-2 mb-5">
          <span class="w-2.5 h-2.5 rounded-full bg-teal-600 inline-block"></span>
          <h2 class="text-xl font-bold text-teal-900">إضافة صنف جديد</h2>
        </div>
        <form method="post" th:action="@{/inventory/items}" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <label class="flex flex-col gap-1.5">
            <span class="clinicos-label">اسم الصنف</span>
            <input type="text" name="name" class="clinicos-input" required placeholder="كمبوزيت">
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="clinicos-label">الوحدة</span>
            <input type="text" name="uom" class="clinicos-input" required placeholder="عبوة">
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="clinicos-label">عدد الوحدات في العبوة</span>
            <input type="number" name="unitsPerPack" min="0" step="1" class="clinicos-input">
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="clinicos-label">سعر العبوة</span>
            <input type="number" name="unitCost" min="0" step="0.01" inputmode="decimal" class="clinicos-input">
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="clinicos-label">تنبيه المخزن</span>
            <input type="number" name="storeAlert" min="0" step="1" class="clinicos-input">
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="clinicos-label">تنبيه التراي</span>
            <input type="number" name="trayAlert" min="0" step="1" class="clinicos-input">
          </label>
          <div class="sm:col-span-2 lg:col-span-3">
            <button class="clinicos-btn" type="submit">+ إضافة الصنف</button>
          </div>
        </form>
      </div>

      <div th:if="${!#lists.isEmpty(items)}" class="clinicos-card overflow-hidden">
        <table class="clinicos-table clinicos-table--comfortable">
          <thead>
            <tr>
              <th class="text-start">الصنف</th>
              <th class="text-end">سعر العبوة</th>
              <th class="text-end">بالمخزن</th>
              <th class="text-end">بالتراي</th>
              <th class="text-start">الحالة</th>
              <th class="text-end">إجراءات</th>
            </tr>
          </thead>
          <tbody th:each="item : ${items}" x-data="{ edit: false }">
            <tr>
              <td class="text-start">
                <span class="block font-bold text-teal-900" th:text="${item.name()}">كمبوزيت</span>
                <span class="block text-xs text-on-surface-variant" th:text="${item.uom()}">عبوة</span>
              </td>
              <td class="text-end clinicos-table-numeric">
                <span th:text="${item.unitCost() != null ? #numbers.formatDecimal(item.unitCost(), 1, 2) : '—'}">—</span>
              </td>
              <td class="text-end clinicos-table-numeric" th:text="${item.onHandStore() != null ? #numbers.formatDecimal(item.onHandStore(), 1, 0) : '—'}">0</td>
              <td class="text-end clinicos-table-numeric" th:text="${item.onHandTray() != null ? #numbers.formatDecimal(item.onHandTray(), 1, 0) : '—'}">0</td>
              <td class="text-start">
                <div class="flex flex-wrap gap-2">
                  <span th:if="${item.belowStoreAlert()}" class="clinicos-chip clinicos-chip--warning">مخزن منخفض</span>
                  <span th:if="${item.belowTrayAlert()}" class="clinicos-chip clinicos-chip--warning">تراي منخفض</span>
                  <span th:if="${item.archivedAt() != null}" class="clinicos-chip clinicos-chip--info">مؤرشف</span>
                </div>
              </td>
              <td class="text-end">
                <div class="flex flex-wrap items-center justify-end gap-2">
                  <button type="button" @click="edit = true" class="clinicos-btn clinicos-btn--secondary px-3 py-2 text-xs">تعديل</button>
                  <form method="post" th:action="@{/inventory/items/{id}/change(id=${item.id()})}" class="inline" hx-boost="true" hx-confirm="إرسال طلب حذف هذا الصنف بانتظار موافقة المدير؟">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="kind" value="delete">
                    <button class="clinicos-btn clinicos-btn--danger px-3 py-2 text-xs" type="submit">حذف</button>
                  </form>
                </div>
              </td>
            </tr>
            <tr x-show="edit" x-cloak>
              <td colspan="6" class="bg-neutral-50">
                <form method="post" th:action="@{/inventory/items/{id}/change(id=${item.id()})}" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 p-3">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <input type="hidden" name="kind" value="edit">
                  <label class="flex flex-col gap-1.5">
                    <span class="clinicos-label">اسم الصنف</span>
                    <input type="text" name="name" class="clinicos-input" required th:value="${item.name()}">
                  </label>
                  <label class="flex flex-col gap-1.5">
                    <span class="clinicos-label">الوحدة</span>
                    <input type="text" name="uom" class="clinicos-input" required th:value="${item.uom()}">
                  </label>
                  <label class="flex flex-col gap-1.5">
                    <span class="clinicos-label">عدد الوحدات في العبوة</span>
                    <input type="number" name="unitsPerPack" min="0" step="1" class="clinicos-input" th:value="${item.unitsPerPack()}">
                  </label>
                  <label class="flex flex-col gap-1.5">
                    <span class="clinicos-label">سعر العبوة</span>
                    <input type="number" name="unitCost" min="0" step="0.01" inputmode="decimal" class="clinicos-input" th:value="${item.unitCost()}">
                  </label>
                  <label class="flex flex-col gap-1.5">
                    <span class="clinicos-label">تنبيه المخزن</span>
                    <input type="number" name="storeAlert" min="0" step="1" class="clinicos-input" th:value="${item.storeAlert()}">
                  </label>
                  <label class="flex flex-col gap-1.5">
                    <span class="clinicos-label">تنبيه التراي</span>
                    <input type="number" name="trayAlert" min="0" step="1" class="clinicos-input" th:value="${item.trayAlert()}">
                  </label>
                  <div class="sm:col-span-2 lg:col-span-3 flex flex-wrap items-center gap-2">
                    <button class="clinicos-btn px-3 py-2 text-xs" type="submit">إرسال طلب التعديل</button>
                    <button type="button" @click="edit = false" class="clinicos-btn clinicos-btn--ghost px-3 py-2 text-xs">إلغاء</button>
                  </div>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <th:block th:if="${#lists.isEmpty(items)}">
        <div th:replace="~{fragments/empty-state :: emptyState('📦', 'لا توجد أصناف', 'أضف أول صنف من النموذج أعلاه للبدء.', null, '')}"></div>
      </th:block>
    </section>
  </main>
  <div th:replace="~{fragments/drawer :: drawer}"></div>
  <div th:replace="~{fragments/toast :: toast}"></div>
  <div th:replace="~{fragments/confirm-dialog :: confirm-dialog}"></div>
</body>
</html>
