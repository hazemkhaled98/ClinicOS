<!DOCTYPE html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${title})}"></head><body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }"><main class="w-full min-h-screen flex flex-col bg-surface"><header th:replace="~{fragments/topbar :: topbar}"></header><section class="flex-1 p-8 sm:p-10 max-w-7xl w-full mx-auto clinicos-section"><h1 class="text-3xl font-extrabold text-teal-900 mb-8" th:text="${title}">تحليل الأطباء</h1><div class="clinicos-card overflow-x-auto"><table class="clinicos-table"><thead><tr><th>الطبيب</th><th>الحالات</th><th>الإيراد</th><th>المواد</th><th>الهامش</th></tr></thead><tbody><tr th:each="row : ${rows}" class="border-t border-outline"><td th:text="${row.doctorName()}">غير محدد</td><td th:text="${row.caseCount()}">0</td><td th:text="${row.revenue()}">0</td><td th:text="${row.materialCost()}">0</td><td th:text="${row.margin()}">0</td></tr></tbody></table></div></section></main><div th:replace="~{fragments/drawer :: drawer}"></div></body></html>
