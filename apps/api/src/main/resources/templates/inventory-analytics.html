<!DOCTYPE html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${title})}"></head><body class="min-h-screen bg-surface text-on-surface antialiased relative flex"><main class="w-full min-h-screen flex flex-col bg-surface"><header th:replace="~{fragments/topbar :: topbar}"></header><section class="flex-1 p-8 sm:p-10 max-w-7xl w-full mx-auto clinicos-section"><h1 class="text-3xl font-extrabold text-teal-900 mb-8" th:text="${title}">تحليل الاستهلاك</h1><div class="clinicos-card overflow-x-auto"><table class="clinicos-table"><thead><tr><th>الصنف</th><th>المستهلك</th><th>الرصيد</th><th>القيمة</th><th>الدوران</th></tr></thead><tbody><tr th:each="row : ${rows}" class="border-t border-outline"><td th:text="${row.itemName()}">صنف</td><td th:text="${row.consumed()}">0</td><td th:text="${row.onHand()}">0</td><td th:text="${row.valueOnHand()}">0</td><td th:text="${row.turnover()}">0</td></tr></tbody></table></div></section></main></body></html>
