<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>خطأ غير متوقع - عيادتي</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-screen w-full flex items-center justify-center relative bg-surface text-on-surface p-6 overflow-x-hidden">

  <main class="w-full max-w-[420px] relative z-10">
    <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-2xl border border-danger-50 clinicos-auth-card">

      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-20 h-20 mb-6 flex items-center justify-center rounded-full bg-danger-50 border border-danger-600/20 clinicos-error-icon">
          <svg class="w-10 h-10 text-danger-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-teal-900 clinicos-error-title">حدث خطأ ما</h1>
        <p class="mt-3 text-sm text-neutral-500 font-medium clinicos-error-body">عذراً، حدثت مشكلة غير متوقعة أثناء معالجة طلبك.</p>
        <p class="mt-1 text-sm text-neutral-500 clinicos-error-help">إذا استمرت المشكلة، يرجى التواصل معنا وسنحلها في أقرب وقت.</p>
      </div>

      <div class="flex flex-col items-center gap-5">
        <span th:if="${status}"
              class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-danger-50 border border-danger-600/20 text-xs font-bold text-danger-600 clinicos-error-status">
          رمز الخطأ: <span th:text="${status}">500</span>
        </span>
        <a th:href="@{/}"
           class="cursor-pointer w-full py-3.5 px-6 rounded-xl bg-teal-900 hover:bg-teal-850 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-teal-900/20 transition-all flex items-center justify-center gap-2 clinicos-error-home">
          <span>العودة إلى الرئيسية</span>
          <svg class="w-4 h-4 text-emerald-500 rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
          </svg>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
