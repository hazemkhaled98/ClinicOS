<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('الاستلام')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" @keydown.escape.window="drawerOpen = false"
      th:attr="data-toast=${toastMessage},data-toast-type=${toastType}">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-7xl w-full mx-auto clinicos-section">
      <div class="space-y-1.5 mb-8">
        <h1 class="text-3xl font-extrabold text-teal-900 tracking-tight">استلام الطلبيات</h1>
        <p class="text-sm text-on-surface-variant">سجّل الكميات الواردة مقابل الطلبية — صورة الفاتورة إلزامية.</p>
      </div>

      <div th:if="${#lists.isEmpty(orders)}" class="clinicos-empty-state p-16">
        <div class="text-5xl mb-4">📥</div>
        <p class="font-bold text-teal-900 text-xl">ما في طلبيات بانتظار الاستلام</p>
        <p class="mt-2 text-sm text-on-surface-variant">اسحب طلبية من شاشة النواقص والطلب الأول.</p>
      </div>

      <form th:each="o : ${orders}" method="post" th:action="@{/inventory/receive}" enctype="multipart/form-data"
            class="clinicos-card overflow-hidden mb-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="orderId" th:value="${o.id()}">
        <div class="p-6 pb-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
          <div>
            <h2 class="text-xl font-bold text-teal-900" th:text="${o.supplierName()}">مورّد</h2>
            <p class="text-sm text-on-surface-variant" th:text="${#temporals.format(o.placedAt(), 'dd/MM/yyyy HH:mm')}">—</p>
          </div>
          <span class="clinicos-chip clinicos-chip--info">إجمالي
            <span th:text="${#numbers.formatDecimal(o.total(), 1, 2)}">0.00</span>
          </span>
        </div>
        <div class="px-6 pb-6">
          <table class="clinicos-table clinicos-table--comfortable">
            <thead>
              <tr>
                <th class="text-start">الصنف</th>
                <th class="text-end">المطلوب</th>
                <th class="text-end">المستلم</th>
                <th class="text-start">رقم التشغيلة</th>
                <th class="text-end">مصروف النقل</th>
              </tr>
            </thead>
            <tbody th:each="line : ${o.lines()}">
              <tr>
                <input type="hidden" name="lineId" th:value="${line.id()}">
                <td class="text-start">
                  <span class="block font-bold text-teal-900" th:text="${line.itemName()}">كمبوزيت</span>
                  <span class="block text-xs text-on-surface-variant" th:text="${line.uom()}">عبوة</span>
                </td>
                <td class="text-end clinicos-table-numeric" th:text="${#numbers.formatDecimal(line.qtyOrdered(), 1, 0)}">0</td>
                <td class="text-end">
                  <input type="number" name="qtyReceived" min="0" step="1" class="clinicos-input w-24 text-center"
                         th:value="${line.qtyOrdered()}" required>
                </td>
                <td class="text-start">
                  <input type="text" name="lotNumber" class="clinicos-input w-40" placeholder="اختياري">
                </td>
                <td class="text-end">
                  <input type="number" name="deliveryCost" min="0" step="0.01" inputmode="decimal"
                         class="clinicos-input w-24 text-end" placeholder="0.00">
                </td>
              </tr>
            </tbody>
          </table>
          <div class="mt-5 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
            <label class="flex flex-col gap-1.5">
              <span class="clinicos-label">صورة الفاتورة</span>
              <input type="file" name="photo" accept="image/*" required class="text-sm">
            </label>
            <button class="clinicos-btn" type="submit">تأكيد الاستلام</button>
          </div>
        </div>
      </form>
    </section>
  </main>
  <div th:replace="~{fragments/drawer :: drawer}"></div>
  <div th:replace="~{fragments/toast :: toast}"></div>
  <div th:replace="~{fragments/confirm-dialog :: confirm-dialog}"></div>
</body>
</html>
