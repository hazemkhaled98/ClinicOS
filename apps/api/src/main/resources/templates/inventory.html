<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('المخزن')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" @keydown.escape.window="drawerOpen = false">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-7xl w-full mx-auto clinicos-section">
      <div class="space-y-1.5 mb-8">
        <h1 class="text-3xl font-extrabold text-teal-900 tracking-tight">المخزن</h1>
        <p class="text-sm text-on-surface-variant">اختر قسم المخزن اللي تقدر تشتغل عليه — الأصناف، التراي، صرف المخزون، السجل، والموافقات.</p>
      </div>
      <div th:if="${!#lists.isEmpty(areas)}" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <a th:each="area : ${areas}" th:href="@{/inventory/{route}(route=${area.route()})}"
           class="clinicos-card p-6 flex flex-col items-center justify-center gap-3 text-center hover:shadow-lg transition-shadow">
          <div class="w-14 h-14 shrink-0 rounded-xl bg-teal-100 text-teal-700 flex items-center justify-center text-3xl">
            <span th:text="${area.route() == 'items' ? '🗂️' : (area.route() == 'tray' ? '🧰' : (area.route() == 'issue' ? '📤' : (area.route() == 'ledger' ? '📜' : '✅')))}">🗂️</span>
          </div>
          <span class="text-lg font-bold text-teal-900" th:text="${area.title()}">الأصناف</span>
        </a>
      </div>
      <div th:if="${#lists.isEmpty(areas)}" class="clinicos-empty-state p-16">
        <div class="text-5xl mb-4">🔒</div>
        <p class="font-bold text-teal-900 text-xl">ما عندك صلاحية قسم من المخزن</p>
        <p class="mt-2 text-sm text-on-surface-variant">اطلب من المدير يفعّل لك صلاحية من أقسام المخزن الأول.</p>
      </div>
    </section>
  </main>
  <div th:replace="~{fragments/drawer :: drawer}"></div>
  <div th:replace="~{fragments/toast :: toast}"></div>
  <div th:replace="~{fragments/confirm-dialog :: confirm-dialog}"></div>
</body>
</html>
