<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('تحضير الجلسات')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" @keydown.escape.window="drawerOpen = false">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-6xl w-full mx-auto clinicos-section">
      <p class="text-xs font-bold text-emerald-600 mb-2 clinicos-section-kicker">عيادتي</p>
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div><h1 class="text-2xl sm:text-3xl font-extrabold text-teal-900 tracking-tight clinicos-section-title">تحضير الجلسات</h1><p class="mt-1 text-sm text-on-surface-variant">قوائم أدوات ومواد كل إجراء — حضّر بدقة من غير ما تنسى حاجة</p></div>
        <div class="flex flex-wrap gap-2"><a href="/prep/templates" class="clinicos-btn clinicos-btn--secondary">📚 قوالب جاهزة</a><a href="/prep/checklists/new" class="clinicos-btn">+ قائمة جديدة</a></div>
      </div>
      <div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <article th:each="checklist : ${checklists}" class="clinicos-card p-5 flex flex-col gap-4">
          <div class="flex items-start justify-between gap-3"><h2 class="font-extrabold text-teal-900" th:text="${checklist.name()}">كشف وتشخيص</h2><span class="clinicos-chip" th:classappend="${checklist.status() == 'approved'} ? ' clinicos-chip--success' : ' clinicos-chip--warning'" th:text="${checklist.status() == 'approved'} ? 'معتمدة' : 'بانتظار الاعتماد'">بانتظار الاعتماد</span></div>
          <p class="text-sm text-on-surface-variant"><span th:text="${#lists.size(checklist.sections())}">2</span> أقسام · عناصر التحضير</p>
          <div class="flex flex-wrap gap-2 mt-auto">
            <a th:if="${checklist.status() == 'approved'}" th:href="@{/prep/checklists/{id}/run(id=${checklist.id()})}" class="clinicos-btn px-3 py-2 text-xs">بدء التحضير</a>
            <a th:href="@{/prep/checklists/{id}/edit(id=${checklist.id()})}" class="clinicos-btn clinicos-btn--secondary px-3 py-2 text-xs">تعديل</a>
            <form th:if="${canApprove and checklist.status() != 'approved'}" method="post" th:action="@{/prep/checklists/{id}/approve(id=${checklist.id()})}" class="inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="clinicos-btn px-3 py-2 text-xs" type="submit">اعتماد</button></form>
            <form method="post" th:action="@{/prep/checklists/{id}/archive(id=${checklist.id()})}" class="inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="clinicos-btn clinicos-btn--secondary px-3 py-2 text-xs" type="submit">أرشفة</button></form>
          </div>
        </article>
        <div th:if="${#lists.isEmpty(checklists)}" class="clinicos-card p-10 sm:col-span-2 lg:col-span-3 clinicos-empty-state"><div class="text-4xl mb-2">📋</div><p class="font-bold text-teal-900">لا توجد قوائم تحضير بعد</p><p class="mt-1 text-sm text-on-surface-variant">أنشئ قائمة أو استورد قالباً جاهزاً.</p></div>
      </div>
    </section>
  </main>
  <div th:replace="~{fragments/drawer :: drawer}"></div><div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
