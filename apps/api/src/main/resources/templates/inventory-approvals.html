<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('طلبات الموافقة')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" th:attr="data-toast=${toastMessage},data-toast-type=${toastType}">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-7xl w-full mx-auto clinicos-section">
      <div class="space-y-1.5 mb-8"><h1 class="text-3xl font-extrabold text-teal-900 tracking-tight">طلبات الموافقة</h1><p class="text-sm text-on-surface-variant">التعديلات والمرتجعات بانتظار قرار المدير.</p></div>
      <div th:if="${!#lists.isEmpty(approvals)}" class="space-y-4">
        <article th:each="request : ${approvals}" class="clinicos-card p-5 flex flex-col gap-4">
          <div class="flex items-start justify-between gap-3"><div class="flex flex-wrap items-center gap-2.5"><span class="clinicos-chip" th:text="${request.kind() == 'edit' ? 'تعديل' : request.kind() == 'return' ? 'مرتجع' : 'طلب'}">طلب</span><h2 class="font-bold text-teal-900 text-lg" th:text="${request.title()}">طلب</h2></div><span class="text-xs text-on-surface-variant" th:text="${#temporals.format(request.requestedAt(), 'yyyy-MM-dd HH:mm')}">2026</span></div>
          <p class="text-sm text-on-surface-variant" th:text="${request.summary()}">ملخص الطلب</p>
          <div class="flex flex-wrap items-center gap-2 ms-auto"><form method="post" th:action="@{/inventory/approvals/{id}/decide(id=${request.id()})}" class="inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="source" th:value="${request.source()}"><input type="hidden" name="approve" value="true"><button class="clinicos-btn px-3 py-2 text-xs" type="submit">اعتماد</button></form><form method="post" th:action="@{/inventory/approvals/{id}/decide(id=${request.id()})}" class="inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="source" th:value="${request.source()}"><input type="hidden" name="approve" value="false"><button class="clinicos-btn clinicos-btn--danger px-3 py-2 text-xs" type="submit">رفض</button></form></div>
        </article>
      </div>
      <div th:if="${#lists.isEmpty(approvals)}" class="clinicos-empty-state p-16"><p class="font-bold text-teal-900 text-xl">لا توجد طلبات بانتظار اعتمادك</p><p class="mt-2 text-sm text-on-surface-variant">ستظهر طلبات التعديل والمرتجعات هنا.</p></div>
    </section>
  </main><div th:replace="~{fragments/drawer :: drawer}"></div><div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
