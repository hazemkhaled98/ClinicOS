<!DOCTYPE html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${title})}"></head><body class="min-h-screen bg-surface text-on-surface antialiased relative flex"><main class="w-full min-h-screen flex flex-col bg-surface"><header th:replace="~{fragments/topbar :: topbar}"></header><section class="flex-1 p-8 sm:p-10 max-w-7xl w-full mx-auto clinicos-section"><h1 class="text-3xl font-extrabold text-teal-900 mb-8" th:text="${title}">الربحية</h1><div class="clinicos-card overflow-x-auto"><table class="clinicos-table"><thead><tr><th>الإجراء</th><th>الإيراد</th><th>التكلفة</th><th>الهامش</th><th>عدد الحالات</th></tr></thead><tbody><tr th:each="row : ${rows}" class="border-t border-outline"><td th:text="${row.procedureName()}">إجراء</td><td th:text="${row.revenue()}">0</td><td th:text="${row.cost()}">0</td><td th:text="${row.margin()}">0</td><td th:text="${row.caseCount()}">0</td></tr></tbody></table></div></section></main></body></html>
