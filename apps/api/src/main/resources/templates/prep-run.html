<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('تشغيل قائمة التحضير')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }">
<main class="w-full min-h-screen flex flex-col bg-surface"><header th:replace="~{fragments/topbar :: topbar}"></header><section class="flex-1 p-8 sm:p-10 max-w-4xl w-full mx-auto clinicos-section"><a href="/prep" class="text-sm font-bold text-emerald-700">← قوائم التحضير</a><h1 class="mt-4 text-2xl sm:text-3xl font-extrabold text-teal-900">تحضير الجلسة</h1><div th:fragment="runContent" id="run-content" class="mt-8 flex flex-col gap-6"><div class="clinicos-card p-5"><div class="flex items-center justify-between gap-4"><p class="font-extrabold text-teal-900" th:text="${run.runDate()}">2026-09-17</p><span class="clinicos-chip clinicos-chip--info"><span th:text="${run.checkedCount()}">0</span>/<span th:text="${run.totalCount()}">4</span> مكتمل</span></div><div class="mt-3 h-2 rounded-full bg-neutral-100"><div class="h-2 rounded-full bg-emerald-600" th:style="|width: ${run.totalCount() == 0 ? 0 : (run.checkedCount() * 100 / run.totalCount())}%|"></div></div></div><div th:each="section : ${run.sections()}" class="clinicos-card p-5"><h2 class="font-extrabold text-teal-900" th:text="${section.title()}">الأدوات</h2><div class="mt-4 flex flex-col divide-y divide-neutral-100"><label th:each="item : ${section.items()}" class="flex items-center gap-3 py-3 text-sm font-bold"><input type="checkbox" th:checked="${item.checked()}" class="h-5 w-5 accent-emerald-600" th:attr="hx-post=|/prep/checklists/${checklistId}/run/items/${item.id()}|,hx-vals=|{'checked': '${!item.checked()}'}|" hx-target="#run-content" hx-swap="outerHTML"><span th:text="${item.name()}">قفازات</span></label></div></div><form method="post" th:attr="hx-post=|/prep/checklists/${checklistId}/run/reset|" hx-target="#run-content" hx-swap="outerHTML"><button class="clinicos-btn clinicos-btn--secondary" type="submit">إعادة ضبط اليوم</button></form></div></section></main><div th:replace="~{fragments/drawer :: drawer}"></div><div th:replace="~{fragments/toast :: toast}"></div>
</body></html>
