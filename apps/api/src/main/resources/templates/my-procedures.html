<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('سجل إجراءاتي')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" th:attr="data-toast=${toastMessage},data-toast-type=${toastType}">
  <main class="w-full min-h-screen flex flex-col bg-surface"><header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-7xl w-full mx-auto clinicos-section">
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-8"><div><h1 class="text-3xl font-extrabold text-teal-900 tracking-tight">سجل إجراءاتي</h1><p class="text-sm text-on-surface-variant">التكلفة محفوظة وقت تسجيل الإجراء.</p></div></div>
      <div class="clinicos-card p-6 mb-8"><h2 class="text-xl font-bold text-teal-900 mb-5">تسجيل إجراء علاجي جديد</h2><form method="post" th:action="@{/inventory/myprocs}" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="flex flex-col gap-1.5"><span class="clinicos-label">الإجراء</span><select class="clinicos-input" name="procedureId" required><option value="">اختر الإجراء</option><option th:each="procedure : ${procedures}" th:value="${procedure.id()}" th:text="${procedure.name()}">إجراء</option></select></label><label class="flex flex-col gap-1.5"><span class="clinicos-label">اسم الطبيب</span><input class="clinicos-input" name="doctorName"></label><label class="flex flex-col gap-1.5"><span class="clinicos-label">مرجع الحالة</span><input class="clinicos-input" name="patientRef"></label><div class="sm:col-span-2 lg:col-span-4"><button class="clinicos-btn" type="submit">تسجيل حسب الوصفة</button></div></form></div>
      <div th:if="${!#lists.isEmpty(cases)}" class="clinicos-card overflow-x-auto"><table class="clinicos-table"><thead><tr><th>الإجراء</th><th>الطبيب</th><th>المرجع</th><th>التاريخ</th><th>المواد</th><th>الإجمالي</th><th>الهامش</th></tr></thead><tbody><tr th:each="item : ${cases}" class="border-t border-outline"><td class="font-bold text-teal-900" th:text="${item.procedureName()}">إجراء</td><td th:text="${item.doctorName() ?: '—'}">—</td><td th:text="${item.patientRef() ?: '—'}">—</td><td th:text="${#temporals.format(item.performedAt(), 'yyyy-MM-dd HH:mm')}">2026</td><td th:text="${#numbers.formatDecimal(item.materialCost(), 1, 2)}">0</td><td th:text="${#numbers.formatDecimal(item.totalCost(), 1, 2)}">0</td><td th:text="${#numbers.formatDecimal(item.margin(), 1, 2)}">0</td></tr></tbody></table></div>
      <div th:if="${#lists.isEmpty(cases)}" class="clinicos-empty-state p-16"><p class="font-bold text-teal-900 text-xl">مفيش إجراءات مسجلة لسه.</p></div>
    </section>
  </main><div th:replace="~{fragments/drawer :: drawer}"></div><div th:replace="~{fragments/toast :: toast}"></div>
</body></html>
