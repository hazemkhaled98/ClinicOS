<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('سجل الحركة')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" @keydown.escape.window="drawerOpen = false">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-7xl w-full mx-auto clinicos-section">
      <div class="space-y-1.5 mb-8">
        <h1 class="text-3xl font-extrabold text-teal-900 tracking-tight">سجل الحركة</h1>
        <p class="text-sm text-on-surface-variant">كل حركة مخزون مسجلة — سجل إضافي لا يمكن التعديل عليه.</p>
      </div>
      <div th:if="${!#lists.isEmpty(entries)}" class="clinicos-card overflow-hidden">
        <table class="clinicos-table clinicos-table--dense">
          <thead>
            <tr>
              <th class="text-start">الصنف</th>
              <th class="text-start">الموقع</th>
              <th class="text-end">التغير</th>
              <th class="text-start">السبب</th>
              <th class="text-start">بواسطة</th>
              <th class="text-end">التوقيت</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="entry : ${entries}">
              <td class="text-start">
                <span class="font-bold text-teal-900" th:text="${entry.itemName()}">كمبوزيت</span>
                <span class="text-xs text-on-surface-variant" th:text="('(' + ${entry.uom()} + ')')">(عبوة)</span>
              </td>
              <td class="text-start text-on-surface-variant"
                  th:text="${#strings.equals(entry.location().name(), 'store')} ? 'المخزن' : 'التراي'">المخزن</td>
              <td class="text-end clinicos-table-numeric font-bold"
                  th:classappend="${entry.qtyDelta() != null and entry.qtyDelta().signum() < 0} ? ' text-danger-600' : ' text-success-600'"
                  th:text="${entry.qtyDelta() != null ? (entry.qtyDelta().signum() < 0 ? #numbers.formatDecimal(entry.qtyDelta(), 1, 0) : '+' + #numbers.formatDecimal(entry.qtyDelta(), 1, 0)) : '—'}">+5</td>
              <td class="text-start text-on-surface-variant" th:text="${entry.reason()}">صرف</td>
              <td class="text-start text-on-surface-variant" th:text="${entry.actorName()}">أحمد علي</td>
              <td class="text-end clinicos-table-numeric text-on-surface-variant"
                  th:text="${#temporals.format(entry.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-09-19 10:30</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div th:if="${#lists.isEmpty(entries)}" class="clinicos-empty-state p-16">
        <div class="text-5xl mb-4">📜</div>
        <p class="font-bold text-teal-900 text-xl">لا توجد حركات مخزون بعد</p>
        <p class="mt-2 text-sm text-on-surface-variant">اول ما يتسجل صرف أو نقل لرصيد، بيظهر هنا بكل تفاصيله.</p>
      </div>
    </section>
  </main>
  <div th:replace="~{fragments/drawer :: drawer}"></div>
  <div th:replace="~{fragments/toast :: toast}"></div>
  <div th:replace="~{fragments/confirm-dialog :: confirm-dialog}"></div>
</body>
</html>
