<th:block th:fragment="drawer" xmlns:th="http://www.thymeleaf.org">
  <div x-show="drawerOpen" x-transition.opacity
       class="fixed inset-0 z-40 bg-neutral-900/40"
       @click="drawerOpen = false"
       aria-hidden="true"></div>
  <aside id="slide-over-navigation"
         role="dialog"
         aria-modal="true"
         aria-label="القائمة الرئيسية للنظام"
         class="fixed inset-y-0 z-50 w-72 sm:w-80 bg-teal-900 text-white flex flex-col shadow-drawer border-e border-teal-800/40 transition-[inset-inline-start] duration-300 ease-out -start-72 sm:-start-80"
         :class="drawerOpen ? '!start-0' : ''">
    <div class="flex flex-col flex-1 overflow-hidden">
      <div class="px-6 pt-7 pb-6 flex items-center justify-between border-b border-teal-850/70">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-white shadow-md flex items-center justify-center flex-shrink-0 border border-teal-800/40 overflow-hidden p-0.5">
            <img th:src="@{/branding/logo.png}" alt="شعار عيادتي" class="w-full h-full block object-contain select-none pointer-events-none">
          </div>
          <div class="flex flex-col">
            <span class="text-lg font-bold tracking-tight text-white flex items-center gap-1.5 clinicos-brand">
              عيادتي
              <span class="text-[10px] font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-1.5 py-0.5 rounded">PRO</span>
            </span>
            <span class="text-[11px] text-teal-300/60 font-medium">نظام الإدارة المتكامل</span>
          </div>
        </div>
        <button type="button" @click="drawerOpen = false" id="close-drawer-btn" aria-label="إغلاق القائمة"
                class="w-9 h-9 rounded-lg bg-teal-800/50 text-teal-300 hover:text-white hover:bg-teal-800 flex items-center justify-center transition-colors cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          </svg>
        </button>
      </div>
      <nav class="flex-1 overflow-y-auto px-4 py-6 space-y-1.5 custom-scrollbar clinicos-nav">
        <a th:each="section : ${layout.nav}"
           th:href="@{'/' + ${section.route}}"
           th:attr="aria-current=${layout.activeRoute != null and layout.activeRoute == section.route} ? 'page' : null"
           th:classappend="${layout.activeRoute != null and layout.activeRoute == section.route} ? 'clinicos-nav-item--active bg-teal-700/60' : ''"
           class="clinicos-nav-item group">
          <div class="flex items-center gap-3.5 flex-1 clinicos-nav-tile">
            <div class="w-8 h-8 rounded-lg bg-teal-800/40 flex items-center justify-center text-teal-300 group-hover:text-emerald-300 group-hover:bg-teal-800/70 transition-colors flex-shrink-0 clinicos-nav-icon">
              <th:block th:switch="${section.icon.key}">
                <svg th:case="user" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                <svg th:case="edit" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                <svg th:case="bolt" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                <svg th:case="tasks" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                <svg th:case="clipboard-check" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                <svg th:case="star" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                <svg th:case="archive" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                <svg th:case="chart" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
              </th:block>
            </div>
            <span class="text-sm font-medium clinicos-nav-item-label" th:text="${section.label}">عنصر</span>
          </div>
        </a>
      </nav>
    </div>
    <div class="p-4 border-t border-teal-850/80 bg-teal-950/40 clinicos-who">
      <div class="flex items-center justify-between p-2 rounded-xl bg-teal-900/50 border border-teal-800/60 hover:border-teal-700 transition-colors">
        <div class="flex items-center gap-3">
          <div class="relative">
            <div class="w-9 h-9 rounded-full bg-teal-700/60 border border-emerald-400/40 flex items-center justify-center text-teal-100 font-bold text-xs flex-shrink-0 clinicos-who-av">
              <span th:text="${#strings.isEmpty(layout.username) ? '؟' : #strings.substring(layout.username, 0, 1)}">؟</span>
            </div>
            <span class="absolute bottom-0 start-0 w-2.5 h-2.5 rounded-full bg-emerald-400 border-2 border-teal-900"></span>
          </div>
          <div class="flex flex-col">
            <span class="text-xs font-bold text-white leading-tight clinicos-who-name" th:text="${layout.username}">مستخدم</span>
            <span class="text-[11px] text-teal-300/70 font-normal clinicos-who-role" th:text="${layout.role}">مستخدم</span>
          </div>
        </div>
        <form method="post" th:action="@{/logout}">
          <button type="submit" title="تسجيل الخروج"
                  class="w-9 h-9 rounded-lg bg-teal-800/50 text-teal-300 hover:text-danger-50 hover:bg-danger-600/15 flex items-center justify-center transition-colors cursor-pointer clinicos-logout">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M11 16l-4-4m0 0l4-4m-4 4h14m-9 6v1a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h4a2 2 0 012 2v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </aside>
</th:block>
