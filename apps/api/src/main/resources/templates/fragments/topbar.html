<header th:fragment="topbar" xmlns:th="http://www.thymeleaf.org"
        class="h-16 bg-white border-b border-neutral-200 px-6 flex items-center justify-between shadow-sm clinicos-topbar">
  <div class="flex items-center gap-4">
    <button type="button" @click="drawerOpen = true" aria-controls="slide-over-navigation" aria-label="فتح القائمة"
            class="w-9 h-9 rounded-lg text-on-surface-variant hover:text-teal-900 hover:bg-neutral-100 flex items-center justify-center transition-colors cursor-pointer clinicos-topbar-menu">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <span class="text-sm font-semibold text-teal-900 clinicos-topbar-t2">عيادتي · إدارة الأداء</span>
  </div>
  <span class="text-xs text-on-surface-variant clinicos-topbar-date" th:text="${layout.date}">التاريخ</span>
</header>
