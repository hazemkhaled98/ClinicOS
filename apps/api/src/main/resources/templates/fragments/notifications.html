<span th:fragment="emptyBadge" id="notification-count"></span>

<span th:fragment="count(unread)" id="notification-count"
      hx-get="/notifications/badge" hx-target="this"
      hx-trigger="load, every 30s, notificationsChanged from:body"
      hx-swap="outerHTML" class="absolute -top-0.5 -start-0.5 min-w-4 h-4 px-1 rounded-full bg-danger-600 text-white text-micro font-bold leading-4 text-center tabular-nums"
      th:classappend="${unread > 0} ? '' : 'hidden'"
      th:text="${unread > 99 ? '99+' : unread}">0</span>

<div th:fragment="list(notifications, unread)" class="w-80 max-w-[calc(100vw-2rem)]">
  <div class="flex items-center justify-between gap-3 px-4 py-3 border-b border-neutral-200">
    <span class="text-sm font-semibold text-teal-900">الإشعارات</span>
    <button th:if="${unread > 0}" type="button" hx-post="/notifications/read-all"
            hx-target="#notification-list" hx-swap="innerHTML"
            class="text-xs font-semibold text-teal-700 hover:text-teal-900 hover:underline cursor-pointer">
      تعليم الكل كمقروء
    </button>
  </div>
  <div th:if="${#lists.isEmpty(notifications)}" class="px-4 py-8 text-center text-sm text-on-surface-variant">
    لا توجد إشعارات
  </div>
  <ul th:unless="${#lists.isEmpty(notifications)}" class="max-h-96 overflow-y-auto divide-y divide-neutral-100">
    <li th:each="n : ${notifications}">
      <button type="button" th:attr="hx-post='/notifications/' + ${n.id()} + '/read'" hx-swap="none"
              class="w-full text-start px-4 py-3 hover:bg-neutral-100 transition cursor-pointer"
              th:classappend="${n.read()} ? '' : 'bg-teal-100/40'">
        <span class="flex items-start gap-2">
          <span th:unless="${n.read()}" class="mt-1.5 w-2 h-2 rounded-full bg-teal-700 shrink-0" aria-hidden="true"></span>
          <span class="min-w-0">
            <span class="block text-sm text-on-surface" th:text="${n.title()}">إشعار</span>
            <span th:if="${n.detail() != ''}" class="block text-xs text-on-surface-variant mt-0.5"
                  th:text="${n.detail()}">سبب</span>
            <time class="block text-xs text-on-surface-variant mt-1 tabular-nums"
                  th:text="${#temporals.format(n.createdAt(), 'dd/MM HH:mm')}">01/01 00:00</time>
          </span>
        </span>
        <span th:if="${!n.read()}" class="sr-only">غير مقروء</span>
      </button>
    </li>
  </ul>
</div>
