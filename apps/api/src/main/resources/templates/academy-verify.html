<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('التحقق')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" @keydown.escape.window="drawerOpen = false">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-4xl w-full mx-auto clinicos-section">
      <div class="flex items-center justify-between mb-8">
        <div class="space-y-1.5">
          <h1 class="text-3xl font-bold text-teal-900 tracking-tight">التحقق الأكاديمي</h1>
          <p class="text-sm text-on-surface-variant">تقديمات صور الإنجاز بانتظار المراجعة</p>
        </div>
        <a href="/academy" class="clinicos-btn clinicos-btn--secondary">↩ رجوع</a>
      </div>

      <div th:if="${!#lists.isEmpty(pending)}" class="space-y-4">
        <article th:each="s : ${pending}" class="clinicos-card p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1">
              <h2 class="font-bold text-teal-900 text-lg" th:text="${s.employeeName()}">موظف</h2>
              <p class="text-sm text-on-surface-variant mt-1" th:text="${s.icon() ?: '📘'} + ' ' + ${s.unitTitle()}">وحدة</p>
            </div>
            <span class="clinicos-chip clinicos-chip--warning">بانتظار</span>
          </div>
          <img th:if="${s.photoId() != null}" th:src="@{/attachments/{id}(id=${s.photoId()})}" alt="صورة الإنجاز" class="mt-4 rounded-lg border border-surface-border w-40 h-40 object-cover">
          <div class="flex flex-wrap gap-2 mt-4">
            <form method="post" th:action="@{/academy/submissions/{id}/verify(id=${s.id()})}" class="inline">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="clinicos-btn px-3 py-2 text-xs" type="submit">✔ تأكيد الإنجاز</button>
            </form>
            <form method="post" th:action="@{/academy/submissions/{id}/reject(id=${s.id()})}" class="inline">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <label class="sr-only" th:for="${'reject-reason_' + s.id()}">سبب الرفض</label>
              <input type="text" th:id="${'reject-reason_' + s.id()}" name="reason" required placeholder="سبب الرفض" class="clinicos-input w-40">
              <button class="clinicos-btn clinicos-btn--warning px-3 py-2 text-xs" type="submit">رفض</button>
            </form>
          </div>
        </article>
      </div>

      <div th:if="${#lists.isEmpty(pending)}" class="clinicos-empty-state p-16">
        <div class="text-5xl mb-4">✅</div>
        <p class="font-bold text-teal-900 text-xl">لا توجد تقديمات بانتظار المراجعة</p>
      </div>
    </section>
  </main>
  <div th:replace="~{fragments/drawer :: drawer}"></div>
  <div th:replace="~{fragments/toast :: toast}"></div>
  <div th:replace="~{fragments/confirm-dialog :: confirm-dialog}"></div>
</body>
</html>
