<!DOCTYPE html><html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('لوحة المخزون')}"></head><body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }"><main class="w-full min-h-screen flex flex-col bg-surface"><header th:replace="~{fragments/topbar :: topbar}"></header><section class="flex-1 p-8 sm:p-10 max-w-7xl w-full mx-auto clinicos-section"><h1 class="text-3xl font-extrabold text-teal-900 tracking-tight mb-8">لوحة المخزون</h1><div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-5"><div class="clinicos-card p-5"><b th:text="${dashboard.itemsBelowAlert()}">0</b><span class="block text-sm text-on-surface-variant">أصناف تحت التنبيه</span></div><div class="clinicos-card p-5"><b th:text="${dashboard.pendingApprovals()}">0</b><span class="block text-sm text-on-surface-variant">طلبات اعتماد</span></div><div class="clinicos-card p-5"><b th:text="${dashboard.openOrders()}">0</b><span class="block text-sm text-on-surface-variant">طلبات مفتوحة</span></div><div class="clinicos-card p-5"><b th:text="${#numbers.formatDecimal(dashboard.storeValue(), 1, 2)}">0</b><span class="block text-sm text-on-surface-variant">قيمة المخزن</span></div><div class="clinicos-card p-5"><b th:text="${#numbers.formatDecimal(dashboard.trayValue(), 1, 2)}">0</b><span class="block text-sm text-on-surface-variant">قيمة التراي</span></div></div></section></main><div th:replace="~{fragments/drawer :: drawer}"></div></body></html>
