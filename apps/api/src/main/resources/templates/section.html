<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${section.title})}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex"
      th:attr="hx-headers='{\&quot;X-CSRF-TOKEN\&quot;:\&quot;' + ${_csrf.token} + '\&quot;}'">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shadow-sm clinicos-topbar">
      <span class="text-sm font-semibold text-teal-900 clinicos-topbar-t2">عيادتي · إدارة الأداء</span>
      <span class="text-xs text-on-surface-variant clinicos-topbar-date" th:text="${layout.date}">التاريخ</span>
    </header>
    <section class="flex-1 p-8 sm:p-10 max-w-5xl w-full clinicos-section">
      <p class="text-xs font-bold text-emerald-600 mb-2 clinicos-section-kicker">عيادتي</p>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-teal-900 tracking-tight clinicos-section-title" th:text="${section.title}">القسم</h1>
      <p class="mt-1 text-sm text-on-surface-variant clinicos-section-sub" th:text="${section.subtitle}">وصف القسم</p>
      <div class="mt-10 bg-white rounded-2xl border border-slate-200 p-10 flex flex-col items-center justify-center text-center clinicos-empty-state">
        <svg class="w-10 h-10 text-teal-300 mb-3 clinicos-empty-state-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
        <p class="text-sm text-on-surface-variant clinicos-empty-state-message" th:text="${message}">سيتم تفعيل هذا القسم قريباً.</p>
      </div>
    </section>
  </main>
  <div th:replace="~{fragments/drawer :: drawer}"></div>
</body>
</html>
