<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
<title>الموظفون</title>
</head>
<body>
<div th:fragment="employeesCard(employees, employeeErrors, employeeErrorScope, employeeErrorRow, addForm)"
     id="employees-card" class="mt-10 bg-white rounded-2xl border border-neutral-200 p-6 sm:p-8 clinicos-card">
  <div class="flex flex-col gap-2 mb-6">
    <h2 class="flex items-center gap-2 text-xl font-extrabold text-teal-900">👥 الموظفون</h2>
    <p class="text-sm text-on-surface-variant">بيانات شغل الموظفين (التوصيف/المرتب/الحافز/الشفت). الحسابات وكلمات المرور في تبويب «المستخدمون».</p>
  </div>

  <div th:if="${employeeErrorScope == 'add'}" class="mb-6 rounded-xl bg-danger-50 border border-danger-600 p-3 text-sm text-danger-600" role="alert">
    <span th:each="err : ${employeeErrors.values()}" th:text="${err} + ' '" th:remove="tag"></span>
  </div>

  <div class="flex flex-col gap-3">
    <th:block th:if="${#lists.isEmpty(employees)}">
      <p class="py-6 text-center text-sm text-on-surface-variant">لا يوجد موظفون بعد. أضف أول موظف من النموذج أدناه.</p>
    </th:block>

    <div th:each="employee : ${employees}"
         class="rounded-xl border border-neutral-200 p-4 flex flex-wrap items-center gap-4 clinicos-employee-row">
      <div th:if="${employeeErrorScope == 'edit' and employeeErrorRow != null and employeeErrorRow.equals(employee.id())}"
           class="w-full rounded-lg bg-danger-50 border border-danger-600 p-2 text-sm text-danger-600" role="alert">
        <span th:each="err : ${employeeErrors.values()}" th:text="${err} + ' '" th:remove="tag"></span>
      </div>

      <span class="w-10 h-10 shrink-0 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center font-bold text-base"
            th:text="${#strings.substring(employee.name(), 0, 1)}">أ</span>
      <span class="font-bold text-teal-900 min-w-32" th:text="${employee.name()}">محمود سمير</span>

      <form class="flex flex-wrap items-center gap-3 grow" th:attr="hx-post='/admin-dashboard/settings/employees/' + ${employee.id()}"
            hx-target="#employees-card" hx-swap="outerHTML">
        <input type="hidden" name="name" th:value="${employee.name()}">
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          المسمى الوظيفي
          <select name="staffRoleCode" class="clinicos-input w-36">
            <option value="assistant" th:selected="${employee.staffRole().code() == 'assistant'}">مساعد</option>
            <option value="receptionist" th:selected="${employee.staffRole().code() == 'receptionist'}">موظف استقبال</option>
          </select>
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          المرتب الأساسي
          <input type="text" inputmode="decimal" name="basePay" placeholder="المرتب"
                 class="clinicos-input w-32" th:value="${employee.basePay() != null ? employee.basePay() : ''}">
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          الحافز الكامل
          <input type="text" inputmode="decimal" name="maxIncentive" placeholder="الحافز"
                 class="clinicos-input w-32" th:value="${employee.maxIncentive() != null ? employee.maxIncentive() : ''}">
        </label>

        <div class="flex items-center gap-2 text-xs text-on-surface-variant" x-data="{ shift: ${employee.customShift()} }">
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="checkbox" name="customShift" class="accent-teal-600" x-model="shift">
            شفت مخصص
          </label>
          <div class="flex items-center gap-2" x-show="shift">
            <input type="time" name="shiftStart" aria-label="بداية الشفت" class="clinicos-input w-32"
                   th:value="${employee.shiftStart() != null ? employee.shiftStart() : ''}">
            <span>إلى</span>
            <input type="time" name="shiftEnd" aria-label="نهاية الشفت" class="clinicos-input w-32"
                   th:value="${employee.shiftStart() != null ? employee.shiftEnd() : ''}">
          </div>
        </div>

        <button type="submit" class="clinicos-btn me-auto">حفظ</button>
      </form>

      <button type="button" class="clinicos-btn clinicos-btn--danger"
              th:attr="hx-delete='/admin-dashboard/settings/employees/' + ${employee.id()}"
              hx-target="#employees-card" hx-swap="outerHTML"
              hx-confirm="سيتم أرشفة الموظف. هل أنت متأكد؟"
              aria-label="حذف الموظف">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </button>
    </div>

    <hr class="my-4 border-dashed border-neutral-300"/>

    <div class="rounded-xl bg-teal-50 border border-teal-200 p-4 flex flex-wrap items-center gap-3" x-data="{ shift: ${addForm.customShift} }">
      <form class="flex flex-wrap items-center gap-3 grow" hx-post="/admin-dashboard/settings/employees"
            hx-target="#employees-card" hx-swap="outerHTML">
        <input type="hidden" name="existingAdd" value="false">
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          اسم الموظف
          <input type="text" name="name" class="clinicos-input w-40" th:value="${addForm.name}"
                 placeholder="اسم الموظف" required>
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          المسمى الوظيفي
          <select name="staffRoleCode" class="clinicos-input w-36">
            <option value="assistant" th:selected="${addForm.staffRoleCode == 'assistant'}">مساعد</option>
            <option value="receptionist" th:selected="${addForm.staffRoleCode == 'receptionist'}">موظف استقبال</option>
          </select>
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          المرتب الأساسي
          <input type="text" inputmode="decimal" name="basePay" placeholder="المرتب"
                 class="clinicos-input w-32" th:value="${addForm.basePay}">
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          الحافز الكامل
          <input type="text" inputmode="decimal" name="maxIncentive" placeholder="الحافز"
                 class="clinicos-input w-32" th:value="${addForm.maxIncentive}">
        </label>
        <div class="flex items-center gap-2 text-xs text-on-surface-variant">
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="checkbox" name="customShift" class="accent-teal-600" x-model="shift">
            شفت مخصص
          </label>
          <div class="flex items-center gap-2" x-show="shift">
            <input type="time" name="shiftStart" aria-label="بداية الشفت" class="clinicos-input w-32" th:value="${addForm.shiftStart}">
            <span>إلى</span>
            <input type="time" name="shiftEnd" aria-label="نهاية الشفت" class="clinicos-input w-32" th:value="${addForm.shiftEnd}">
          </div>
        </div>
        <button type="submit" class="clinicos-btn">+ إضافة موظف</button>
      </form>
    </div>
    <p class="mt-3 text-xs text-on-surface-variant">بعد إضافة الموظف، اعمله حساب دخول من تبويب «المستخدمون» واربطه بيه.</p>
  </div>
</div>
</body>
</html>
