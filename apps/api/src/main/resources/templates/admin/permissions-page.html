<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('الصلاحيات')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" @keydown.escape.window="drawerOpen = false">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-5xl w-full mx-auto clinicos-section">
      <p class="text-xs font-bold text-emerald-600 mb-2 clinicos-section-kicker">عيادتي</p>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-teal-900 tracking-tight clinicos-section-title">الصلاحيات</h1>
      <p class="mt-1 text-sm text-on-surface-variant clinicos-section-sub">تحديد صلاحيات كل دور في العيادة</p>
      <nav th:replace="~{fragments/admin-tabs :: adminTabs('permissions')}"></nav>
      <div class="mt-10 p-6 sm:p-8 clinicos-card">
        <div class="flex flex-col gap-2 mb-6">
          <h2 class="flex items-center gap-2 text-xl font-extrabold text-teal-900">🔐 الصلاحيات</h2>
          <p class="text-sm text-on-surface-variant">تحديد ما يمكن لكل دور الوصول إليه. الدور «المالك» يحصل على كل الصلاحيات تلقائياً.</p>
        </div>
        <div id="permissions-body"
             th:insert="~{admin/permissions :: permissionsCard(${rolePermissionMap}, ${usersByRole})}"></div>
      </div>
    </section>
  </main>
  <div th:replace="~{fragments/drawer :: drawer}"></div>
  <div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
