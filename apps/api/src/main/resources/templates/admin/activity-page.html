<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('سجل النشاط')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" @keydown.escape.window="drawerOpen = false">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-5xl w-full mx-auto clinicos-section">
      <p class="text-xs font-bold text-emerald-600 mb-2 clinicos-section-kicker" th:text="${layout.clinicName}">عيادتي</p>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-teal-900 tracking-tight clinicos-section-title">سجل النشاط</h1>
      <p class="mt-1 text-sm text-on-surface-variant clinicos-section-sub">مين عمل إيه وإمتى — اختر اليوم.</p>
      <nav th:replace="~{fragments/admin-tabs :: adminTabs('activity')}"></nav>
      <div th:replace="~{admin/activity :: activity(${day}, ${category}, ${categories}, ${entries}, ${labels})}"></div>
    </section>
  </main>
  <div th:replace="~{fragments/drawer :: drawer}"></div>
</body>
</html>
