<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('لوحة التحكم')}"></head>
<body class="min-h-screen bg-surface text-on-surface antialiased relative flex" x-data="{ drawerOpen: false }" @keydown.escape.window="drawerOpen = false">
  <main class="w-full min-h-screen flex flex-col bg-surface">
    <header th:replace="~{fragments/topbar :: topbar}"></header>
    <section class="flex-1 p-8 sm:p-10 max-w-5xl w-full mx-auto clinicos-section">
      <p class="text-xs font-bold text-emerald-600 mb-2 clinicos-section-kicker">عيادتي</p>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-teal-900 tracking-tight clinicos-section-title" th:text="${section.title}">لوحة التحكم</h1>
      <p class="mt-1 text-sm text-on-surface-variant clinicos-section-sub" th:text="${section.subtitle}">التحليلات التشغيلية والإدارية</p>
      <nav th:replace="~{fragments/admin-tabs :: adminTabs('settings')}"></nav>
<div id="employees-card"
         th:replace="~{admin/employees :: employeesCard(${employees}, ${employeeRoles})}">
      </div>
      <div th:replace="~{admin/clinic-settings :: weightsCard(${weightsForm}, ${weightsSum})}"></div>
      <div th:replace="~{admin/clinic-settings :: volumeCard(${volumeForm})}"></div>
      <div th:replace="~{admin/clinic-settings :: dutyCard(${dutyForm})}"></div>
      <div th:replace="~{admin/clinic-settings :: tiersCard(${tiersForm})}"></div>
    </section>
  </main>
  <div th:replace="~{fragments/drawer :: drawer}"></div>
  <div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
