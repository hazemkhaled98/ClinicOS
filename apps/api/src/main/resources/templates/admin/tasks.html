<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
<title>المهام</title>
</head>
<body>
<div th:fragment="tasksCard(tasks)"
     id="tasks-card" class="mt-10 p-6 sm:p-8 clinicos-card"
     th:attr="data-toast=${toastMessage},data-toast-type=${toastType}">
  <div class="flex flex-col gap-2 mb-6">
    <h2 class="flex items-center gap-2 text-xl font-extrabold text-teal-900">📋 المهام</h2>
    <p class="text-sm text-on-surface-variant">تعريف المهام اليومية والأسبوعية لكل دور أو موظف في العيادة.</p>
  </div>

  <div class="flex flex-col gap-3">
    <th:block th:if="${#lists.isEmpty(tasks)}">
      <p class="py-6 text-center text-sm text-on-surface-variant">لا توجد مهام معرفة بعد.</p>
    </th:block>

    <div th:each="task : ${tasks}"
         class="rounded-xl border border-neutral-200 p-4 flex flex-wrap items-center gap-4 clinicos-employee-row">
      <form class="flex flex-wrap items-center gap-3 grow"
            th:attr="hx-post='/admin-dashboard/tasks/' + ${task.id()},x-data=|{ freq: '${task.frequency()}' }|"
            hx-target="#tasks-card" hx-swap="outerHTML">
        <div class="flex flex-col pt-5">
          <input type="text" name="name" class="clinicos-input w-48 font-bold text-teal-900"
                 th:value="${task.name()}" required>
        </div>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          البُعد
          <select name="dimension" class="clinicos-input w-28">
            <option value="fanni" th:selected="${task.dimension() == 'fanni'}">فني</option>
            <option value="solooki" th:selected="${task.dimension() == 'solooki'}">سلوكي</option>
            <option value="ibda3" th:selected="${task.dimension() == 'ibda3'}">إبداعي</option>
          </select>
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          التكرار
          <select name="frequency" x-model="freq" class="clinicos-input w-28">
            <option value="daily" th:selected="${task.frequency() == 'daily'}">يومي</option>
            <option value="weekly" th:selected="${task.frequency() == 'weekly'}">أسبوعي</option>
            <option value="monthly" th:selected="${task.frequency() == 'monthly'}">شهري</option>
            <option value="custom" th:selected="${task.frequency() == 'custom'}">مخصص</option>
          </select>
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          الدور أو الموظف
          <select name="target" class="clinicos-input w-44">
            <option value="all" th:selected="${task.roleCode() == null and task.employeeId() == null}">كل الأدوار</option>
            <optgroup label="الدور">
              <option value="role:manager" th:selected="${task.roleCode() == 'manager'}">مدير</option>
              <option value="role:assistant" th:selected="${task.roleCode() == 'assistant'}">مساعد</option>
              <option value="role:receptionist" th:selected="${task.roleCode() == 'receptionist'}">موظف استقبال</option>
            </optgroup>
            <optgroup label="الموظف">
              <option th:each="e : ${employees}" th:value="'employee:' + ${e.id()}" th:text="${e.name()}"
                      th:selected="${task.employeeId() != null and task.employeeId() == e.id()}"></option>
            </optgroup>
          </select>
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant" x-show="freq === 'custom'" x-cloak>
          كل
          <input type="number" name="everyN" min="1" class="clinicos-input w-20" th:value="${task.everyN()}" :disabled="freq !== 'custom'">
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant" x-show="freq === 'custom'" x-cloak>
          الوحدة
          <select name="intervalUnit" class="clinicos-input w-24" :disabled="freq !== 'custom'">
            <option value="">—</option>
            <option value="day" th:selected="${task.intervalUnit() == 'day'}">يوم</option>
            <option value="week" th:selected="${task.intervalUnit() == 'week'}">أسبوع</option>
            <option value="month" th:selected="${task.intervalUnit() == 'month'}">شهر</option>
          </select>
        </label>
        <label class="flex items-center gap-1 text-xs text-on-surface-variant pt-5">
          <input type="checkbox" name="requiresPhoto" class="accent-teal-600" th:checked="${task.requiresPhoto()}">
          يتطلب صورة إثبات
        </label>
        <button type="submit" class="clinicos-btn me-auto">حفظ</button>
      </form>
      <form th:attr="hx-delete='/admin-dashboard/tasks/' + ${task.id()}"
            hx-target="#tasks-card" hx-swap="outerHTML"
            hx-confirm="هل أنت متأكد من حذف هذه المهمة؟">
        <button type="submit" class="clinicos-btn clinicos-btn--danger text-xs">حذف</button>
      </form>
    </div>

    <hr class="my-4 border-dashed border-neutral-300"/>

    <div class="rounded-xl bg-teal-50 border border-teal-200 p-4">
      <h3 class="font-bold text-teal-900 mb-3">إضافة مهمة جديدة</h3>
      <form class="flex flex-wrap items-end gap-3" hx-post="/admin-dashboard/tasks"
            hx-target="#tasks-card" hx-swap="outerHTML"
            x-data="{ freq: 'daily' }">
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          اسم المهمة
          <input type="text" name="name" class="clinicos-input w-48" required>
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          البُعد
          <select name="dimension" class="clinicos-input w-28">
            <option value="fanni">فني</option>
            <option value="solooki">سلوكي</option>
            <option value="ibda3">إبداعي</option>
          </select>
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          التكرار
          <select name="frequency" x-model="freq" class="clinicos-input w-28">
            <option value="daily">يومي</option>
            <option value="weekly">أسبوعي</option>
            <option value="monthly">شهري</option>
            <option value="custom">مخصص</option>
          </select>
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant">
          الدور أو الموظف
          <select name="target" class="clinicos-input w-44">
            <option value="all" selected>كل الأدوار</option>
            <optgroup label="الدور">
              <option value="role:manager">مدير</option>
              <option value="role:assistant">مساعد</option>
              <option value="role:receptionist">موظف استقبال</option>
            </optgroup>
            <optgroup label="الموظف">
              <option th:each="e : ${employees}" th:value="'employee:' + ${e.id()}" th:text="${e.name()}"></option>
            </optgroup>
          </select>
        </label>
        <label class="flex flex-col items-center gap-1 text-xs text-on-surface-variant" x-show="freq === 'custom'" x-cloak>
          كل
          <input type="number" name="everyN" min="1" class="clinicos-input w-16" placeholder="—" :disabled="freq !== 'custom'">
        </label>
        <label class="flex flex-col gap-1 text-xs text-on-surface-variant" x-show="freq === 'custom'" x-cloak>
          الوحدة
          <select name="intervalUnit" class="clinicos-input w-24" :disabled="freq !== 'custom'">
            <option value="">—</option>
            <option value="day">يوم</option>
            <option value="week">أسبوع</option>
            <option value="month">شهر</option>
          </select>
        </label>
        <label class="flex items-center gap-1 text-xs text-on-surface-variant w-40 mb-1">
          <input type="checkbox" name="requiresPhoto" class="accent-teal-600">
          يتطلب صورة إثبات
        </label>
        <button type="submit" class="clinicos-btn">+ إضافة مهمة</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
