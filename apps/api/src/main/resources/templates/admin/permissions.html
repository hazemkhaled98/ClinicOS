<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
<title>الصلاحيات</title>
</head>
<body>
<div th:fragment="permissionsCard(rolePermissionMap, usersByRole)"
     th:attr="data-toast=${toastMessage},data-toast-type=${toastType}">
  <div class="flex flex-wrap gap-2 mb-6">
    <a th:each="roleCode : ${roleCodes}"
       th:href="'/admin-dashboard/permissions?role=' + ${roleCode}"
       class="clinicos-admin-tab"
       th:classappend="${roleCode == activeRole} ? 'clinicos-admin-tab--active' : ''"
       th:text="${roleNames.get(roleCode)}">دور</a>
  </div>

  <div th:if="${activeRole == 'owner'}">
    <div class="p-4 bg-teal-50 rounded-xl mb-4">
      <p class="text-sm text-teal-700 font-bold">المالك يحصل على كل الصلاحيات تلقائياً ولا يمكن تغيير ذلك.</p>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
      <label class="flex items-center gap-2 text-sm text-on-surface-variant"
             th:each="perm : ${permissionLabels}">
        <input type="checkbox" class="accent-teal-600" checked disabled>
        <span th:text="${perm.value}">perm</span>
      </label>
    </div>
  </div>

  <form th:unless="${activeRole == 'owner'}"
        th:id="'perm-form-' + ${activeRole}"
        hx-post="/admin-dashboard/permissions"
        hx-target="#permissions-body" hx-swap="innerHTML">
    <input type="hidden" name="roleCode" th:value="${activeRole}">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
      <label class="flex items-center gap-2 text-sm text-on-surface-variant cursor-pointer"
             th:each="perm : ${permissionLabels}">
        <input type="checkbox" name="permissionCodes" th:value="${perm.key}"
               class="accent-teal-600"
               th:checked="${rolePermissionMap.get(activeRole) != null and rolePermissionMap.get(activeRole).contains(perm.key)}">
        <span th:text="${perm.value}">perm</span>
      </label>
    </div>
    <button type="submit" class="clinicos-btn mt-4">حفظ الصلاحيات</button>
  </form>

  <div class="mt-3">
    <p th:if="${usersByRole.get(activeRole) == null or #lists.isEmpty(usersByRole.get(activeRole))}"
       class="text-xs text-on-surface-variant mb-2">مفيش حد على التوصيف ده لسه</p>
    <div th:unless="${usersByRole.get(activeRole) == null or #lists.isEmpty(usersByRole.get(activeRole))}"
         class="flex flex-wrap gap-2 mb-3">
      <span th:each="u : ${usersByRole.get(activeRole)}" class="clinicos-chip clinicos-chip--info"
            th:text="${u.fullName()}">محمود</span>
    </div>
  </div>
</div>
</body>
</html>
