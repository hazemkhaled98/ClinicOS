<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head><title>سجل النشاط</title></head>
<body>
<div th:fragment="activity(day, category, categories, entries, labels)" class="space-y-6">
  <section class="clinicos-card p-5 sm:p-6" data-purpose="activity-header-controls">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-5">
      <div><h2 class="text-lg font-bold text-teal-900">سجل النشاط</h2><p class="text-sm text-on-surface-variant mt-1">كل التغييرات التي تمت داخل العيادة.</p></div>
      <label class="flex flex-col gap-1.5 text-xs font-semibold text-on-surface-variant">اليوم
        <input type="date" name="day" class="clinicos-input w-48" th:value="${day}" th:attr="hx-get=@{/admin-dashboard/activity(category=${category})},hx-target='#activity-list',hx-select='#activity-list',hx-include='this'">
      </label>
    </div>
    <div class="mt-5 pt-4 border-t border-neutral-100 flex flex-wrap items-center gap-2 text-xs">
      <span class="font-semibold text-on-surface-variant">فلترة سريعة:</span>
      <a th:each="item : ${categories}" th:href="@{/admin-dashboard/activity(day=${day},category=${item.key})}" th:attr="hx-get=@{/admin-dashboard/activity(day=${day},category=${item.key})},hx-target='#activity-list',hx-select='#activity-list',hx-swap='outerHTML'" th:text="${item.value}" th:classappend="${category == item.key} ? ' bg-teal-900 text-white' : ' bg-neutral-50 text-on-surface-variant'" class="rounded-lg border border-neutral-200 px-3 py-1.5 font-medium">الكل</a>
      <span class="me-auto text-on-surface-variant">التوقيت: بتوقيت القاهرة (GMT+3)</span>
    </div>
  </section>
  <section id="activity-list" class="clinicos-card p-6 sm:p-10">
    <div th:if="${#lists.isEmpty(entries)}" class="py-8 text-center flex flex-col items-center">
      <div class="w-16 h-16 rounded-full bg-neutral-50 border border-neutral-100 flex items-center justify-center text-neutral-400 mb-4">◷</div>
      <h3 class="text-base sm:text-lg font-medium text-on-surface-variant">مفيش نشاط مسجل في اليوم ده.</h3>
      <button type="button" class="clinicos-btn clinicos-btn--ghost mt-5" th:attr="hx-get=@{/admin-dashboard/activity(day=${day},category=${category})},hx-target='#activity-list',hx-select='#activity-list',hx-swap='outerHTML'">تحديث السجل الآن</button>
    </div>
    <div th:unless="${#lists.isEmpty(entries)}" class="divide-y divide-neutral-100">
      <article th:each="entry : ${entries}" class="py-4 flex items-center justify-between gap-4">
        <div><p class="font-semibold text-teal-900" th:text="${labels[entry.action()] != null ? labels[entry.action()] : entry.action()}">تسجيل نشاط</p><p class="text-xs text-on-surface-variant mt-1" th:text="${entry.actorName() != null ? entry.actorName() : 'نظام'}">الفاعل</p></div>
        <time class="text-xs text-on-surface-variant clinicos-table-numeric" th:text="${#temporals.format(entry.occurredAt(), 'HH:mm')}">10:00</time>
      </article>
    </div>
  </section>
</div>
</body>
</html>
