              <div className="flex-1" style={{ minWidth: 130 }}><L>سعر {nf.uom || "العلبة"} (اختياري)</L><input type="number" value={nf.cost} onChange={(e) => setNf({ ...nf, cost: e.target.value })} placeholder="هيتحدد من أول طلبية" style={{ ...inp, width: "100%" }} /></div>
              <div className="flex-1" style={{ minWidth: 130 }}><L>الصلاحية (يوم) (اختياري)</L><input type="number" value={nf.exp} onChange={(e) => setNf({ ...nf, exp: e.target.value })} placeholder="مثال: 180" style={{ ...inp, width: "100%" }} /></div>
            </div>
            <div className="mt-3"><L>المورّد</L><select value={nf.sup} onChange={(e) => setNf({ ...nf, sup: e.target.value })} style={{ ...inp, width: "100%" }}><option value="">— اختر المورّد —</option>{sups.map((sp) => <option key={sp.id} value={sp.id}>{sp.name}</option>)}</select></div>
            <div style={{ fontSize: 11.5, color: C.faint, marginTop: 8, lineHeight: 1.6 }}>السعر اختياري — سيبه فاضي وهيتحدّد تلقائيًا من سعر أول طلبية استلام، وبعد كده بيتحدّث مع كل استلام جديد.</div>
            <Sec>التصنيف</Sec>
            <div><L>التاجات</L>
              <TagEditor tags={nf.tags} draft={nf.tagDraft} setDraft={(v) => setNf((s) => ({ ...s, tagDraft: v }))}
                onAdd={(t) => { const tag = (t || "").trim(); if (tag && !nf.tags.includes(tag)) setNf((s) => ({ ...s, tags: [...s.tags, tag], tagDraft: "" })); }}
                onRemove={(t) => setNf((s) => ({ ...s, tags: s.tags.filter((x) => x !== t) }))}
                suggestions={allTags.filter((x) => x !== "الكل" && !nf.tags.includes(x))} />
            </div>
            <div className="flex gap-2 mt-3"><Btn onClick={proposeAdd} primary>{canApprove ? <Check size={14} /> : <ShieldCheck size={14} />}{canApprove ? "إضافة الصنف" : "اقترح الإضافة للمدير"}</Btn><Btn onClick={() => setAddOpen(false)}><X size={14} />إلغاء</Btn></div>
            <div style={{ fontSize: 11.5, color: C.faint, marginTop: 8 }}>الإضافة متضافش للمخزن إلا بعد اعتماد المدير.</div>
          </div>
        )}

        <div style={{ background: canApprove ? C.okSoft : C.warnSoft, border: "0.5px solid " + (canApprove ? C.ok : C.warn), borderRadius: 10, padding: "8px 12px", fontSize: 12.5, color: canApprove ? C.ok : C.warn, marginBottom: 12, display: "flex", alignItems: "center", gap: 7 }}>
          <ShieldCheck size={15} />{canApprove ? "إنت مدير — أى تعديل أو إضافة أو حذف بيتطبّق على طول من غير اعتماد." : "أى تعديل أو إضافة أو حذف هنا بيروح للمدير يعتمده — المخزن مايتغيّرش غير بعد الموافقة."}
        </div>

        {visDup.length > 0 && (
          <div style={{ background: C.warnSoft, border: "0.5px solid " + C.warn, borderRadius: 12, marginBottom: 12, overflow: "hidden" }}>
            <button onClick={() => setDupOpen((v) => !v)} className="flex items-center gap-2" style={{ width: "100%", border: "none", background: "transparent", cursor: "pointer", fontFamily: F, padding: "9px 13px", textAlign: "start" }}>
              <Bell size={15} color={C.warn} />
              <span style={{ fontWeight: 800, fontSize: 12.5, color: C.warn, flex: 1 }}>فيه {visDup.length} {visDup.length === 1 ? "صنف ممكن يكون مكرّر" : "أصناف ممكن تكون مكرّرة"}</span>
              <span style={{ fontSize: 12, fontWeight: 700, color: C.warn }}>{dupOpen ? "إخفاء" : "راجع"}</span>
              {dupOpen ? <ChevronUp size={15} color={C.warn} /> : <ChevronDown size={15} color={C.warn} />}
            </button>
            {dupOpen && (
              <div style={{ padding: "0 13px 13px" }}>
                <div style={{ fontSize: 11.5, color: C.muted, marginBottom: 10 }}>الأسماء دي متشابهة جدًا (مع تجاهل فروق المقاسات) — يمكن نفس الصنف اتسجّل مرتين. افتح الصنف وتعامل معاه، أو دوس «مش مكرّر» لو مختلفين.</div>
                <div className="flex flex-col gap-2">
                  {visDup.map((p) => (
                    <div key={p.key} className="flex items-center gap-2" style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 10, padding: "9px 11px", flexWrap: "wrap" }}>
                      <div className="flex-1" style={{ minWidth: 150 }}>
                        <div style={{ fontSize: 13, fontWeight: 600 }}>«{p.a.name}» ↔ «{p.b.name}»</div>
                        <div style={{ fontSize: 11, color: C.muted, marginTop: 1 }}>تشابه {Math.round(p.sim * 100)}%</div>
                      </div>
                      <button onClick={() => goToItem(p.a.id)} style={{ border: "0.5px solid " + C.line, background: C.bg, cursor: "pointer", color: C.primaryDark, borderRadius: 8, padding: "5px 10px", fontFamily: F, fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 4 }}><ArrowLeft size={12} style={{ transform: "scaleX(-1)" }} />{p.a.name}</button>
                      <button onClick={() => goToItem(p.b.id)} style={{ border: "0.5px solid " + C.line, background: C.bg, cursor: "pointer", color: C.primaryDark, borderRadius: 8, padding: "5px 10px", fontFamily: F, fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 4 }}><ArrowLeft size={12} style={{ transform: "scaleX(-1)" }} />{p.b.name}</button>
                      <button onClick={() => { setDupOk((a) => Array.from(new Set([...a, p.key]))); pushLog("count", "تأكيد إن «" + p.a.name + "» و«" + p.b.name + "» مش مكرّرين"); }} style={{ border: "0.5px solid " + C.ok, background: C.okSoft, cursor: "pointer", color: C.ok, borderRadius: 8, padding: "5px 10px", fontFamily: F, fontSize: 12, fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}><Check size={12} />مش مكرّر</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        <div className="flex flex-col gap-2">
          {list.map((it) => {
            const pend = invPendFor(it.id);
            const lowState = isDirect(it) ? trayLow(it) : storeLow(it);
            return (
            <div key={it.id} id={"mitem-" + it.id} style={{ background: flashItem === it.id ? C.primarySoft : C.surface, border: "0.5px solid " + (flashItem === it.id ? C.primary : pend ? C.warn : C.line), boxShadow: flashItem === it.id ? "0 0 0 3px " + C.primary + "33" : "none", borderInlineStart: "3px solid " + (lowState ? C.low : C.primary + "55"), borderRadius: 12, padding: "12px 14px", transition: "box-shadow .25s, background .25s" }}>
              <div className="flex items-center gap-2" style={{ flexWrap: "wrap" }}>
                <div className="flex items-center gap-2 flex-1" style={{ flexWrap: "wrap", minWidth: 140 }}>
                  <span style={{ fontWeight: 700, fontSize: 14.5 }}>{it.name}</span>
                  {isDirect(it) && <span style={{ background: C.tierB + "22", color: C.tierB, fontSize: 10.5, fontWeight: 700, padding: "2px 8px", borderRadius: 7 }}>تراى مباشر</span>}
                  {lowState && <span style={{ background: C.lowSoft, color: C.low, fontSize: 10.5, fontWeight: 700, padding: "2px 8px", borderRadius: 7 }}>{(!isDirect(it) && it.store <= 0) ? "نافد" : "تحت التنبيه"}</span>}
                  {it.disabled && <span style={{ background: C.lowSoft, color: C.low, fontSize: 10.5, fontWeight: 700, padding: "2px 8px", borderRadius: 7 }}>معطّل · موقوف الطلب</span>}
                  {pend && <span style={{ background: C.warnSoft, color: C.warn, fontSize: 10.5, fontWeight: 700, padding: "2px 8px", borderRadius: 7 }}>{pend.kind === "delete" ? "اقتراح حذف" : "تعديل بانتظار الاعتماد"}</span>}
                </div>
                <button onClick={() => toggleDisabled(it)} title={it.disabled ? "إعادة تفعيل" : "تعطيل (وقف الطلب)"} style={{ border: "0.5px solid " + (it.disabled ? C.ok : C.line), background: it.disabled ? C.okSoft : C.bg, cursor: "pointer", color: it.disabled ? C.ok : C.muted, borderRadius: 8, padding: "6px 11px", fontFamily: F, fontSize: 12.5, fontWeight: 600, display: "flex", alignItems: "center", gap: 5 }}>{it.disabled ? <><Check size={13} />تفعيل</> : <><Ban size={13} />تعطيل</>}</button>
                <button onClick={() => openIe(it)} style={{ border: "0.5px solid " + C.line, background: C.bg, cursor: "pointer", color: C.primaryDark, borderRadius: 8, padding: "6px 11px", fontFamily: F, fontSize: 12.5, fontWeight: 600, display: "flex", alignItems: "center", gap: 5 }}><Pencil size={13} />تعديل</button>
                <button onClick={() => proposeDelItem(it)} style={{ border: "none", background: "transparent", cursor: "pointer", color: C.low, display: "flex" }}><Trash2 size={16} /></button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(84px,1fr))", gap: 7, marginTop: 11 }}>
                {!isDirect(it) && (
                  <div style={{ background: C.bg, borderRadius: 9, padding: "7px 10px", minWidth: 0 }}>
                    <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 2 }}>المخزن</div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: storeLow(it) ? C.low : C.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{it.store} {it.uom}</div>
                  </div>
                )}
                <div style={{ background: C.bg, borderRadius: 9, padding: "7px 10px", minWidth: 0 }}>
                  <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 2 }}>التراى</div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: trayLow(it) ? C.low : C.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{trayTxt(it)}</div>
                </div>
                <div style={{ background: C.bg, borderRadius: 9, padding: "7px 10px", minWidth: 0 }}>
                  <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{it.uom} بتدّي</div>
                  <div style={{ fontSize: 13, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{it.perUnit} {it.subUom}</div>
                </div>
                <div style={{ background: C.bg, borderRadius: 9, padding: "7px 10px", minWidth: 0 }}>
                  <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 2 }}>سعر {it.uom}</div>
                  <div style={{ fontSize: 13, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{it.cost ? egp(it.cost) : "—"}</div>
                </div>
                <div style={{ background: C.bg, borderRadius: 9, padding: "7px 10px", minWidth: 0 }}>
                  <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 2 }}>المورّد</div>
                  <div style={{ fontSize: 13, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{supName(it.sup) || "—"}</div>
                </div>
              </div>
              <div style={{ fontSize: 11, color: C.faint, marginTop: 8 }}>{isDirect(it) ? ("تنبيه عند " + it.trayAlert + " " + it.subUom + " تراى · بدون مخزن") : ("تنبيه عند " + it.storeAlert + " " + it.uom + " مخزن · " + it.trayAlert + " " + it.subUom + " تراى")}</div>
              {it.tags.length > 0 && <div className="flex gap-1 mt-2" style={{ flexWrap: "wrap" }}>{it.tags.map((t) => <span key={t} style={{ fontSize: 10.5, color: C.muted, background: C.bg, border: "0.5px solid " + C.lineSoft, borderRadius: 12, padding: "1px 9px" }}>{t}</span>)}</div>}
            </div>
          ); })}
        </div>
      </div>
    );
  }

  function viewShort() {
    const sorted = [...lows].sort((a, b) => a.store / (a.storeAlert || 1) - b.store / (b.storeAlert || 1));
    if (!sorted.length) return <Empty icon={<Bell size={26} />} text="مفيش نواقص — المخزن كله فوق حد التنبيه." />;
    return (
      <div>
        <div className="flex items-center justify-between mb-3" style={{ flexWrap: "wrap", gap: 8 }}>
          <span style={{ color: C.muted, fontSize: 13 }}>{sorted.length} صنف وصل لحد التنبيه في المخزن</span>
          <Btn onClick={() => setTab("orders")} primary>جهّز الطلبيات<ArrowLeft size={14} /></Btn>
        </div>
        <div className="flex flex-col gap-2">
          {sorted.map((it) => (
            <div key={it.id} className="flex items-center gap-3" style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 12, padding: "11px 14px", borderRight: "3px solid " + C.low, flexWrap: "wrap" }}>
              <div className="flex-1" style={{ minWidth: 150 }}>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{it.name}</div>
                <div className="flex gap-1.5 mt-0.5" style={{ flexWrap: "wrap" }}>
                  {it.store <= 0 && <span style={{ background: C.lowSoft, color: C.low, fontSize: 11, padding: "2px 8px", borderRadius: 7 }}>نافد</span>}
                  {expSoon(it) && <span style={{ background: C.warnSoft, color: C.warn, fontSize: 11, padding: "2px 8px", borderRadius: 7 }}>ينتهى خلال {it.exp} يوم</span>}
                </div>
              </div>
              <span style={{ fontSize: 13, color: C.low, fontWeight: 700 }}>{it.store} {it.uom}</span>
              <span style={{ fontSize: 12, color: C.muted }}>تنبيه عند {it.storeAlert} · اقترح +{suggest(it)}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function viewOrders() {
    const inPool = (it) => (needsOrder(it) || orderExtra.includes(it.id)) && !onOrder(it.id);
    const pool = items.filter(inPool);
    const selPool = pool.filter((it) => oSelOn(it.id));
    const allSel = pool.length > 0 && selPool.length === pool.length;
    const toggleAll = () => { const v = !allSel; setOSel((s) => { const c = { ...s }; pool.forEach((it) => { c[it.id] = v; }); return c; }); };
    const freq = {}; selPool.forEach((it) => { freq[it.sup] = (freq[it.sup] || 0) + 1; });
    const defSup = Object.keys(freq).sort((a, b) => freq[b] - freq[a])[0] || (sups[0] && sups[0].id) || "";
    const supId = orderSup || defSup;
    const addable = items.filter((it) => isActive(it) && !inPool(it) && !onOrder(it.id) && inc(it.name, oSearch));
    // أرخص مورّد لكل صنف من تاريخ الأسعار الحقيقي (آخر سعر لكل مورّد مسجّل وموجود)
    const bestSupplierFor = (it) => {
      const m = {}; (it.priceHist || []).forEach((h) => { if (h.price > 0 && h.sup && sups.some((s) => s.id === h.sup)) m[h.sup] = h.price; });
      const ids = Object.keys(m); if (!ids.length) return null;
      let best = ids[0]; ids.forEach((sid) => { if (m[sid] < m[best]) best = sid; });
      return { sup: best, price: m[best], count: ids.length };
    };
    return (
      <div className="flex flex-col gap-4">
        <div style={{ fontSize: 12.5, color: C.muted }}>اختار الأصناف اللى عايز تطلبها (شيل العلامة عن اللى مش هتطلبه دلوقتي — هيفضل في النواقص)، ظبّط الكميات، واختار المورّد. تأكيد الطلب بيجهّز رسالة واتساب بالأصناف المختارة بس.</div>

        <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 12, padding: 12 }}>
          <button onClick={() => setOAdd(!oAdd)} className="flex items-center gap-2" style={{ border: "none", background: "transparent", cursor: "pointer", color: C.primaryDark, fontFamily: F, fontWeight: 700, fontSize: 13.5 }}><Plus size={16} />ضيف صنف للطلب</button>
          {oAdd && (
            <div className="mt-3">
              <div className="flex items-center gap-2 px-2.5 mb-2" style={{ background: C.bg, border: "0.5px solid " + C.line, borderRadius: 9, height: 38 }}>
                <Search size={15} color={C.faint} />
                <input value={oSearch} onChange={(e) => setOSearch(e.target.value)} placeholder="دوّر على صنف بالاسم…" style={{ flex: 1, border: "none", background: "transparent", outline: "none", fontFamily: F, fontSize: 13 }} />
                {oSearch && <button onClick={() => setOSearch("")} style={{ border: "none", background: "transparent", cursor: "pointer", color: C.faint, display: "flex" }}><X size={15} /></button>}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 4, maxHeight: 200, overflowY: "auto" }}>
                {addable.map((it) => (
                  <button key={it.id} onClick={() => { setOrderExtra((a) => [...a, it.id]); setOSearch(""); }} className="flex items-center justify-between" style={{ border: "0.5px solid " + C.line, background: C.surface, borderRadius: 9, padding: "8px 11px", cursor: "pointer", fontFamily: F, textAlign: "start" }}>
                    <span style={{ fontSize: 13, fontWeight: 600 }}>{it.name}</span>
                    <span className="flex items-center gap-2">
                      <span style={{ fontSize: 11.5, color: it.store > 0 ? C.muted : C.low }}>{it.store > 0 ? "بالمخزن " + it.store + " " + it.uom : "نافد"}</span>
                      <Plus size={14} color={C.primaryDark} />
                    </span>
                  </button>
                ))}
                {!addable.length && <div style={{ color: C.faint, fontSize: 12.5, textAlign: "center", padding: "8px 0" }}>مفيش صنف تانى يتضاف</div>}
              </div>
            </div>
          )}
        </div>

        {pool.length === 0 ? <Empty icon={<Bell size={26} />} text="مفيش أصناف للطلب — ضيف أى صنف من فوق." /> : (
          <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 14, padding: 16 }}>
            <div className="flex items-center justify-between mb-3" style={{ flexWrap: "wrap", gap: 8 }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 3 }}>الطلبية</div>
                <div style={{ fontSize: 12, color: C.muted }}>{selPool.length} من {pool.length} صنف مختار للطلب</div>
              </div>
              <button onClick={toggleAll} className="flex items-center gap-1.5" style={{ border: "0.5px solid " + C.line, background: C.surface, borderRadius: 9, padding: "6px 11px", cursor: "pointer", fontFamily: F, fontSize: 12.5, fontWeight: 600, color: C.primaryDark }}>{allSel ? <X size={14} /> : <Check size={14} />}{allSel ? "شيل التحديد عن الكل" : "اختار الكل"}</button>
            </div>
            <div className="flex flex-col gap-2.5">
              {pool.map((it) => {
                const v = oq[it.id] ?? suggest(it); const extra = orderExtra.includes(it.id); const sel = oSelOn(it.id);
                return (
                  <div key={it.id} style={{ borderBottom: "0.5px solid " + C.lineSoft, paddingBottom: 11, opacity: sel ? 1 : 0.5 }}>
                    <div className="flex items-center gap-2" style={{ flexWrap: "wrap" }}>
                      <span onClick={() => setOSel((s) => ({ ...s, [it.id]: !sel }))} title={sel ? "مش هطلبه" : "اطلبه"} style={{ width: 20, height: 20, borderRadius: 6, border: "1.5px solid " + (sel ? C.primary : C.line), background: sel ? C.primary : C.surface, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, color: "#fff" }}>{sel ? <Check size={13} /> : null}</span>
                      <div style={{ flex: 1, minWidth: 120, fontSize: 14.5, fontWeight: 700 }} className="flex items-center gap-1.5">{it.name}{isDirect(it) && <span style={{ background: C.tierB + "22", color: C.tierB, fontSize: 10, fontWeight: 700, padding: "1px 7px", borderRadius: 6 }}>تراى مباشر</span>}{extra && <span style={{ background: C.primarySoft, color: C.primaryDark, fontSize: 10, fontWeight: 700, padding: "1px 7px", borderRadius: 6 }}>مضاف</span>}</div>
                      {extra && <button onClick={() => setOrderExtra((a) => a.filter((x) => x !== it.id))} title="شيل من القائمة" style={{ border: "none", background: "transparent", cursor: "pointer", color: C.faint, flexShrink: 0 }}><X size={16} /></button>}
                    </div>

                    <div className="flex items-center gap-2" style={{ marginInlineStart: 28, marginTop: 6, flexWrap: "wrap" }}>
                      {(() => { const out = !isDirect(it) && it.store <= 0; const low = isDirect(it) ? it.tray <= it.trayAlert : it.store <= it.storeAlert; const num = isDirect(it) ? it.tray : it.store; const u = isDirect(it) ? it.subUom : it.uom; const alert = isDirect(it) ? it.trayAlert : it.storeAlert; return <>
                        {out ? <span style={{ background: C.lowSoft, color: C.low, fontSize: 10.5, fontWeight: 800, padding: "2px 9px", borderRadius: 999 }}>نافد</span> : low ? <span style={{ background: C.warnSoft, color: C.warn, fontSize: 10.5, fontWeight: 800, padding: "2px 9px", borderRadius: 999 }}>تحت التنبيه</span> : null}
                        <span style={{ fontSize: 11.5, color: C.muted }}>{(isDirect(it) ? "على التراى " : "بالمخزن ") + num + " " + u}</span>
                        <span style={{ fontSize: 11, color: C.faint }}>· تنبيه عند {alert}</span>
                      </>; })()}
                    </div>

                    <div style={{ marginInlineStart: 28, marginTop: 6 }}>
                      {(() => { const best = bestSupplierFor(it); if (!best) return <span style={{ fontSize: 10.5, color: C.faint }}>مفيش سعر مسجّل بعد للترشيح</span>; const multi = best.count > 1; const on = orderSup === best.sup; return <button onClick={() => setOrderSup(best.sup)} title={multi ? "أرخص مورّد من " + best.count + " موردين — رشّح الطلبية له" : "رشّح الطلبية لهذا المورّد"} style={{ display: "inline-flex", alignItems: "center", gap: 5, border: "0.5px solid " + (on ? C.primary : (multi ? C.ok : C.line)), background: on ? C.primarySoft : (multi ? C.okSoft : C.bg), color: on ? C.primaryDark : (multi ? C.ok : C.muted), borderRadius: 999, padding: "3px 11px", fontFamily: F, fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}><TrendingDown size={13} /><span>{multi ? "أرخص مورّد" : "المورّد"}: {supName(best.sup)}</span><span style={{ fontWeight: 800 }}>{egp(best.price)}</span></button>; })()}
                    </div>

  function viewSuppliersSimple() {
    const setSup = (id, p) => setSups((arr) => arr.map((s) => s.id === id ? { ...s, ...p } : s));

      const recs = deliveries.filter((d) => d.sup === sp.id);
      const last = recs.map((d) => d.date).sort().slice(-1)[0] || its.map((x) => x.lastOrder).filter(Boolean).sort().slice(-1)[0] || "—";
      const avgDays = recs.length ? Math.round(recs.reduce((s, d) => s + d.days, 0) / recs.length) : sp.leadDays;
      const fill = recs.length ? Math.round(recs.reduce((s, d) => s + d.fill, 0) / recs.length) : 100;
      const ratios = its.map((it) => { const others = Object.entries(priceMap[it.id] || {}).filter(([s, p]) => s !== sp.id && p > 0); let best = null; others.forEach(([s, p]) => { if (best == null || p < best) best = p; }); return (best != null && it.cost > 0) ? it.cost / best : null; }).filter((x) => x != null);
      const avgRatio = ratios.length ? ratios.reduce((a, b) => a + b, 0) / ratios.length : null;
      const speed = clamp(5 - Math.max(0, avgDays - sp.leadDays) - Math.max(0, avgDays - 7) * 0.3);
      const avail = clamp(fill / 20);
      const price = avgRatio == null ? 3 : clamp(5 - (avgRatio - 1) * 12);
      const overall = Math.round(((speed + avail + price) / 3) * 10) / 10;
      const pref = overall >= 4.2 ? { t: "مفضّل", c: C.ok, s: C.okSoft } : overall >= 3.2 ? { t: "جيد", c: C.warn, s: C.warnSoft } : { t: "ضعيف", c: C.low, s: C.lowSoft };
      return { sp, last, overall, speed, avail, price, pref };
    }).sort((a, b) => b.overall - a.overall);

    const Bar = ({ label, v }) => (

    return (
      <div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>تقييم وتفضيل الموردين حسب السعر والتوفّر والسرعة، وآخر توريد — مرتّبين بالأفضل. كلّم المورّد على واتساب على طول.</div>
        {(function(){ const canApproveSup = ((props && props.allowedAreas) || []).indexOf("approvals") >= 0; return (

  // ===== قاعدة الهدر الموحّدة: الصنف اللي مش في وصفة الإجراء = إضافي خارج الوصفة (مش هدر) =====

  const recWasteCost = (r) => (r.lines || []).reduce((s, l) => { const it = items.find((x) => x.id === l.id); const ov = lineOver(r.procId, l.id, l.q); return s + (it && ov > 0 ? ov * costU(it) : 0); }, 0);

  function viewDash() {

  function viewAnalytics() {
    const useVal = {}; consumed.forEach((r) => (r.lines || []).forEach((l) => { const it = items.find((x) => x.id === l.id); if (it) useVal[l.id] = (useVal[l.id] || 0) + l.q * costU(it); }));
    const data = [...items].map((it) => ({ name: it.name.split(" ")[0], days: coverDays(it), low: storeLow(it) })).sort((a, b) => a.days - b.days);
    const spendItem = [...items].map((it) => ({ it, v: Math.round(useVal[it.id] || 0) })).sort((a, b) => b.v - a.v);
    const topSpend = spendItem.filter((x) => x.v > 0).slice(0, 8).map((x) => ({ name: x.it.name.split(" ")[0], v: x.v }));
    const usedTotal = Math.round(spendItem.reduce((s, x) => s + x.v, 0));
    const coverList = [...items].map((it) => ({ it, days: coverDays(it), low: storeLow(it) || trayLow(it) })).sort((a, b) => a.days - b.days).slice(0, 8);
    const coverMax = Math.max(1, ...coverList.map((x) => x.days));
    const lowCount = items.filter((it) => needsOrder(it)).length;
    const topSpendMax = Math.max(1, ...topSpend.map((x) => x.v));
    // قيمة المخزون حسب التصنيف (التاج الأساسى)
    const catVal = {}; items.forEach((it) => { const t = it.tags[0] || "أخرى"; catVal[t] = (catVal[t] || 0) + (it.store + it.tray / it.perUnit) * it.cost; });
    const cats = Object.entries(catVal).map(([t, v]) => ({ t, v: Math.round(v) })).sort((a, b) => b.v - a.v);
    const catMax = cats[0] ? cats[0].v : 1;
    const procCostRows = procs.filter((p) => !p.isNew).map((p) => ({ p, c: Math.round(procCost(p)) })).sort((a, b) => b.c - a.c).slice(0, 8);
    const procCostMax = procCostRows[0] ? procCostRows[0].c : 1;
    // ترشيحات إنتاجية
    const overstock = items.filter((it) => coverDays(it) > 120).sort((a, b) => (b.store + b.tray / b.perUnit) * b.cost - (a.store + a.tray / a.perUnit) * a.cost);
    const fastLow = items.filter((it) => coverDays(it) <= 14 && it.avgDaily >= 3).sort((a, b) => coverDays(a) - coverDays(b));
    const pricier = items.filter((it) => { const h = it.priceHist || []; return h.length >= 2 && h[h.length - 1].price > h[h.length - 2].price; });
    const ins = [];
    if (spendItem[0] && spendItem[0].v > 0) ins.push("أكبر بند خامات بالقيمة: «" + spendItem[0].it.name + "» بـ " + egp(spendItem[0].v) + " (من الإجراءات المسجّلة) — أهم صنف تفاوض عليه.");
    if (fastLow.length) ins.push(fastLow.length + " صنف سريع الاستهلاك وتغطيته قصيرة (" + fastLow.slice(0, 3).map((i) => i.name).join("، ") + ") — ارفع حد التنبيه أو زوّد الطلب.");
    if (overstock.length) ins.push(overstock.length + " صنف راكد (تغطية > 120 يوم) — فلوس متجمّدة في «" + overstock.slice(0, 3).map((i) => i.name).join("، ") + "»، قلّل طلبه.");
    if (pricier.length) ins.push(pricier.length + " صنف سعره طلع فى آخر شراء (" + pricier.slice(0, 3).map((i) => i.name).join("، ") + ") — راجع بدائل أو موردين تانيين.");
    return (
      <div className="flex flex-col gap-4">
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(132px,1fr))", gap: 10 }}>
          <Metric label="قيمة المخزون" value={egp(invValue)} color={C.primary} icon={<Boxes size={15} />} small />
          <Metric label="قيمة الاستهلاك الفعلي" value={egp(usedTotal)} color={C.tierA} icon={<TrendingDown size={15} />} small />
          <Metric label="أصناف محتاجة طلب" value={lowCount} color={lowCount ? C.low : C.ok} icon={<Bell size={15} />} small />
          <Metric label="عدد الأصناف" value={items.length} color={C.primary} icon={<ClipboardList size={15} />} small />
        </div>

        <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 14, padding: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }} className="mb-1">أقرب أصناف للنفاد</div>
          <div style={{ color: C.muted, fontSize: 12 }} className="mb-3">أقل تغطية بالأيام — الأحمر تحت حد التنبيه، اطلبها الأول</div>

            {coverList.map(({ it, days, low }) => (
              <div key={it.id} className="flex items-center gap-2" style={{ fontSize: 13 }}>
                <span style={{ minWidth: 96, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{it.name}</span>
                <div style={{ flex: 1, height: 12, background: C.bg, borderRadius: 6, overflow: "hidden" }}><div style={{ width: Math.max(6, days / coverMax * 100) + "%", height: "100%", background: low ? C.low : C.primary, borderRadius: 6 }} /></div>
                <span style={{ minWidth: 60, textAlign: "end", fontWeight: 700, color: low ? C.low : C.text }}>{days} يوم</span>
              </div>
            ))}
            {!coverList.length && <div style={{ color: C.faint, fontSize: 13 }}>مفيش أصناف.</div>}
          </div>
        </div>

        <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 14, padding: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }} className="mb-1">أعلى الخامات استهلاكًا (بالقيمة)</div>
          <div style={{ color: C.muted, fontSize: 12 }} className="mb-3">قيمة الخامات اللي اتصرفت فعلًا في الإجراءات المسجّلة — الأعلى أولاً</div>
          <div className="flex flex-col gap-2.5">
            {topSpend.map((x, i) => (
              <div key={i} className="flex items-center gap-2" style={{ fontSize: 13 }}>
                <span style={{ minWidth: 96, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{x.name}</span>
                <div style={{ flex: 1, height: 12, background: C.bg, borderRadius: 6, overflow: "hidden" }}><div style={{ width: Math.max(6, x.v / topSpendMax * 100) + "%", height: "100%", background: C.tierA, borderRadius: 6 }} /></div>
                <span style={{ minWidth: 78, textAlign: "end", fontWeight: 700 }}>{egp(x.v)}</span>
              </div>
            ))}
            {!topSpend.length && <div style={{ color: C.faint, fontSize: 13 }}>مفيش بيانات إنفاق.</div>}
          </div>
        </div>

        <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 14, padding: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }} className="mb-3">قيمة المخزون حسب التصنيف</div>
          <div className="flex flex-col gap-2.5">
            {cats.map(({ t, v }) => (
              <div key={t} className="flex items-center gap-2" style={{ fontSize: 13 }}>
                <span style={{ minWidth: 78, color: C.muted }}>{t}</span>
                <div style={{ flex: 1, height: 10, background: C.bg, borderRadius: 5, overflow: "hidden" }}><div style={{ width: (v / catMax * 100) + "%", height: "100%", background: C.primary }} /></div>
                <span style={{ minWidth: 78, textAlign: "left", fontWeight: 700 }}>{egp(v)}</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 14, padding: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }} className="mb-1">تكلفة الخامات لكل إجراء</div>
          <div style={{ color: C.muted, fontSize: 12 }} className="mb-3">إجمالي الخامات المستخدمة بالوصفة المعيارية — الأغلى أولاً</div>
          <div className="flex flex-col gap-2.5">
            {procCostRows.map(({ p, c }) => (
              <div key={p.id} className="flex items-center gap-2" style={{ fontSize: 13 }}>
                <span style={{ minWidth: 110, fontWeight: 600 }}>{p.name}</span>
                <div style={{ flex: 1, height: 10, background: C.bg, borderRadius: 5, overflow: "hidden" }}><div style={{ width: (c / procCostMax * 100) + "%", height: "100%", background: C.tierB }} /></div>
                <span style={{ minWidth: 64, textAlign: "left", fontWeight: 700 }}>{egp(c)}</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 14, padding: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }} className="mb-3 flex items-center gap-2"><Activity size={16} />ترشيحات لرفع الكفاءة</div>
          <div className="flex flex-col gap-2">
            {ins.map((t, i) => (
              <div key={i} className="flex items-start gap-2" style={{ background: C.bg, borderRadius: 9, padding: "9px 11px", fontSize: 12.5 }}><span style={{ color: C.primary, marginTop: 1 }}>•</span><span>{t}</span></div>
            ))}
            {!ins.length && <div style={{ color: C.faint, fontSize: 13 }}>مفيش ملاحظات — الإدارة متوازنة.</div>}
          </div>
        </div>
      </div>
    );

<span style={{ fontSize: 11.5, color: C.faint }}>من (قيمة التعاقد − الحسابات الخارجية)</span>

    // ═══ 2) تكلفة وتسعير الإجراءات ═══
    const renderPricing = () => {
      const scen = profitDocSel ? docShareFor(P, profitDocSel) : { pct: P.doctorPct };
      const scenName = profitDocSel ? ((doctors || []).find((d) => d.id === profitDocSel) || {}).name : "الافتراضي العام";
      const q = profSearch.trim();
      // ⚠️ ترتيب ثابت (بترتيب تعريف الإجراءات) — الفرز الحي بالهامش كان بيحرّك الكارت مع كل رقم بتكتبه ويطلّعك منه
      // 🆕 نموذج قيمة التعاقد (v4): نصيب الطبيب = رقم ثابت محسوب من (قيمة التعاقد − المعمل) × النسبة
      // → التسعير خطي بسيط: تكلفة كاملة = خامات + تشغيل + معمل + نصيب طبيب، والسعر المقترح = تكلفة × (1 + هامش)
      const rows = procs.filter((p) => !p.isNew).filter((p) => !q || inc(p.name, q)).map((p) => {
        const mat = procCost(p); const dur = durOf(p.id); const lab = labOf(p.id); const cv = contractOf(p);
        // نصيب الطبيب: ثابت، لا يعتمد على سعر البيع
        const docFeeWithDoc = doctorFee(cv, lab, scen.pct);
        // تكلفتين: واحدة مع طبيب، واحدة بدون (نفس السيناريو موجود من قبل — للعرض المقارن)
        const costWithDoc = procFullCost(mat, dur, rate, lab, docFeeWithDoc);
        const costNoDoc = procFullCost(mat, dur, rate, lab, 0);
        const price = p.price || 0;
        const withDoc = caseOwnerNet(price, costWithDoc);
        const noDoc = caseOwnerNet(price, costNoDoc);
        // السعر المقترح: على أساس التكلفة الكاملة مع الطبيب (السيناريو الأساسي)
        const sug = suggestedPrice(costWithDoc, P.targetPct);
        // 🆕 اشتقاقات موحّدة تُحسب مرة واحدة هنا وتُستهلك في الشارة والفلترة والعدادات والكارت (مصدر واحد = استحالة تعارض)
        const caseTotal = costWithDoc.total;
        const hasDoc = scen.pct > 0;
        const netShown = hasDoc ? withDoc.net : noDoc.net;
        const statusKey = __procStatusKey(price, netShown, sug);
        return { p, mat, dur, lab, cv, cost: costWithDoc, costNoDoc, price, withDoc, noDoc, sug, docFeeWithDoc, caseTotal, hasDoc, netShown, statusKey };
      });
      // 🆕 شريط القرارات: العدادات تُحسب من نطاق البحث الحالي (لو كاتب «كراون» الأرقام بتوصّف نتايج الكراون)
      const stCounts = { all: rows.length, met: 0, below: 0, loss: 0, unpriced: 0, nocv: 0 };
      rows.forEach((r) => { stCounts[r.statusKey]++; if (!(r.cv > 0)) stCounts.nocv++; });
      const filtered = procFilter === "all" ? rows : rows.filter((r) => procFilter === "nocv" ? !(r.cv > 0) : r.statusKey === procFilter);
      // الترتيب بيتحسب فقط عند تغيّر (المعيار/الفلتر/البحث/زر ↻) — مش مع كل حرف سعر بيتكتب:
      // من غير التجميد ده، ترتيب «الأقل هامشًا» هيخلّي الكارت ينطّ من تحت صوابعك أثناء الإدخال → خطأ إدخال مالي محتمل
      const sortSig = procSortKey + "|" + procFilter + "|" + q + "|" + procSortBump;
      if (__procOrderRef.current.sig !== sortSig) __procOrderRef.current = { sig: sortSig, ids: __procOrderCompute(filtered, procSortKey) };
      const __ord = __procOrderRef.current.ids;
      const shown = procSortKey === "default" ? filtered

          {shown.map(({ p, mat, dur, lab, cv, cost, costNoDoc, price, withDoc, noDoc, sug, docFeeWithDoc, caseTotal, hasDoc, netShown, statusKey }) => {

            // الشارة من نفس مصدر الفلترة والعدادات (statusKey الموحّد) — استحالة تعارض بين شارة الكارت والفلتر

                     : statusKey === "met" ? ["محقّق الهدف ✓", C.ok, C.okSoft]

            return (
              <div key={p.id} style={{ ...card, padding: 14 }}>
                {/* ① الاسم + الحكم */}

                  <span style={{ background: st[2], color: st[1], fontSize: 11.5, fontWeight: 800, padding: "3px 10px", borderRadius: 8 }}>{st[0]}</span>

                {/* ② مدخلات الحساب: مدة + حسابات خارجية (كل واحد في سطر مستقل عشان القراءة تبقى مريحة على الموبايل).
                    ملاحظة: تكلفة ساعة الكرسي مش بتتعرض كسطر مستقل — بتظهر مضروبة في المدة داخل سطر «تشغيل» تحت (تفادي ازدواج بصري). */}

                    <input type="number" min="0" step="50" {...wheelGuard} value={lab || ""} placeholder="0" disabled={!isOwner} onChange={(e) => upd({ labCosts: Object.assign({}, P.labCosts, { [p.id]: Math.max(0, +e.target.value || 0) }) })} style={{ ...inp, width: 92 }} />

                    <input type="number" min="0" step="50" {...wheelGuard} value={cv || ""} placeholder="0" disabled={!isOwner} onChange={(e) => setProcs((arr) => arr.map((x) => x.id === p.id ? { ...x, contractValue: Math.max(0, +e.target.value || 0), mt: Date.now() } : x))} style={{ ...inp, width: 92 }} />

                    {cv > 0 && scen.pct > 0 && <span style={{ fontSize: 10.5, color: C.primary, fontWeight: 700, marginInlineStart: "auto" }} title={"نصيب الطبيب = " + scen.pct + "% × (" + egp(cv) + " − " + egp(lab) + ") = " + egp(docFeeWithDoc)}>← نصيب الطبيب: {egp(docFeeWithDoc)}</span>}

                <div style={{ border: "0.5px solid " + C.lineSoft, borderRadius: 10, padding: "6px 12px 8px", marginBottom: 10 }}>
                  <div style={{ fontSize: 10.5, fontWeight: 800, color: C.faint, margin: "4px 0 2px", letterSpacing: 0.3 }}>تفاصيل التكلفة</div>
                  {row("خامات", egp(mat))}
                  {row("تشغيل", rate != null ? egp(cost.overhead) : "—", { hint: rate != null ? (dur + " دقيقة × " + egp2(rate) + "/س") : "كمّل «تكاليف التشغيل» الأول" })}
                  {lab > 0 && row("🧾 حسابات خارجية", egp(lab))}
                  {hasDoc
                    ? row("نصيب الطبيب («" + scenName + "»)", egp(withDoc.fee), cv > 0 ? { hint: scen.pct + "% × (" + egp(cv) + " − " + egp(lab) + ") = " + egp(withDoc.fee) } : { hint: "⚠️ حدّد قيمة التعاقد فوق", color: C.warn })
                    : row("نصيب الطبيب", egp(0))}
                  {row("إجمالي تكلفة الحالة", egp(caseTotal), { total: true })}
                </div>
                {/* ⑤ القرار: المقترح كمرجع أول، بعدين سعر البيع النهائي (آخر رقم قبل الصافي) */}
                <div style={{ background: C.bg, border: "0.5px dashed " + C.line, borderRadius: 10, padding: "10px 12px", marginBottom: 10, display: "flex", flexDirection: "column", gap: 8 }}>
                  {sug != null && (
                    <div className="flex items-center gap-2" style={{ fontSize: 12, flexWrap: "wrap" }}>
                      <span style={{ color: C.muted, minWidth: 90 }} title="هامش الربح المستهدف فوق التكلفة الإجمالية للحالة">💰 السعر المقترح ({P.targetPct}% فوق التكلفة):</span>

                    </div>
                  )}
                  <div className="flex items-center gap-2" style={{ fontSize: 13, flexWrap: "wrap", borderTop: sug != null ? "0.5px solid " + C.lineSoft : "none", paddingTop: sug != null ? 8 : 0 }}>

                    {price > 0 && caseTotal > 0 && (() => {
                      const mPct = (netShown / caseTotal) * 100;
                      const loss = netShown < 0;
                      const met = !loss && mPct >= (+P.targetPct || 0) - 0.05; // سماحية كسر فاصلة عائمة عند اعتماد سعر مقرّب
                      const fg = loss ? C.low : met ? C.ok : C.warn;
                      const bg = loss ? C.lowSoft : met ? C.okSoft : C.warnSoft;
                      return (

                      <div style={{ fontSize: 14.5, fontWeight: 800, color: !priced ? C.faint : noDoc.net >= 0 ? C.ok : C.low }}>{priced ? egp(noDoc.net) : "—"}</div>

          {!rows.length && <div style={{ fontSize: 13, color: C.faint }}>{q ? "مفيش إجراء بالاسم ده." : "مفيش إجراءات معرّفة لسه — ضيفها من «قوائم الإجراءات»."}</div>}

    };

    // ═══ 3) صافي الربح الشهري الحقيقي — من السجلات الفعلية، بلا حساب مزدوج ═══
    const renderNet = () => {
      const mo = profitMonth || isoMonthNow();
      const monthCases = consumed.filter((r) => caseMonthKey(r.date) === mo); // بيفهم صيغة التواريخ dd/mm/yyyy المتخزّنة فعلًا
      // 🆕 كل حالة تحسب بنموذجها الأصلي:
      //  - modelVersion >= 4 → نموذج قيمة التعاقد (snapshot ثابت من وقت التسجيل)
      //  - بدون modelVersion → النموذج القديم (نسبة من سعر البيع بالأساس المخزّن)
      // ده يحمي التقارير التاريخية من التغيير بأثر رجعي
      const rows = monthCases.map((r) => {
        const p = procs.find((x) => x.id === r.procId);
        const price = p ? (p.price || 0) : 0;
        const mat = lineCost(r.lines);
        const lab = p ? labOf(p.id) : 0;
        const dur = p ? durOf(p.id) : 60;
        const oh = (rate != null && dur > 0) ? rate * (dur / 60) : 0;
        const docName = String(r.doctor || "").trim();
        let fee = 0;
        if (r.modelVersion >= 4) {
          // النموذج الجديد: نصيب الطبيب من snapshot (لو موجود)، وإلا نحسبه من الإعدادات الحالية
          fee = (r.docFeeAtTime != null) ? Math.max(0, +r.docFeeAtTime) 
              : (docName && p) ? doctorFee(contractOf(p), lab, shareForName(docName).pct) : 0;
        } else if (docName) {
          // النموذج القديم: نسبة من سعر البيع بالأساس المخزّن (fallback إلى "all" لو مش موجود)
          const legacyBase = r.docBaseAtTime || "all";
          const legacyPct = (r.docPctAtTime != null) ? +r.docPctAtTime : shareForName(docName).pct;
          fee = doctorFeeLegacy(price, mat, oh, lab, legacyPct, legacyBase);
        }
        return { price, mat, lab, fee, doctor: docName, procName: r.procName || (p ? p.name : "إجراء") };
      });
      const pnl = monthlyPnL(rows, monthlyTotal);
      const contrib = pnl.rev - pnl.mat - pnl.lab - pnl.fees; // مساهمة الحالات (بعد الخامات والمعمل والأطباء) قبل التكاليف الثابتة
      const netPct = pnl.rev > 0 ? Math.round((pnl.net / pnl.rev) * 100) : null;
      const avgContrib = rows.length ? contrib / rows.length : 0;
      const covered = pnl.fixed > 0 ? Math.max(0, Math.min(100, Math.round((contrib / pnl.fixed) * 100))) : null;
      const casesToBE = (pnl.fixed > contrib && avgContrib > 0) ? Math.ceil((pnl.fixed - contrib) / avgContrib) : 0;
      const byDoc = {}; rows.forEach((r) => { const k = r.doctor || "أنت (بدون طبيب)"; const d = byDoc[k] = byDoc[k] || { cases: 0, rev: 0, mat: 0, lab: 0, fees: 0 }; d.cases++; d.rev += r.price; d.mat += r.mat; d.lab += r.lab; d.fees += r.fee; });
      const docRows = Object.entries(byDoc).map(([k, v]) => ({ d: k, ...v, net: v.rev - v.mat - v.lab - v.fees })).sort((a, b) => b.net - a.net);
      const byProc = {}; rows.forEach((r) => { const d = byProc[r.procName] = byProc[r.procName] || { cases: 0, c: 0 }; d.cases++; d.c += (r.price - r.mat - r.lab - r.fee); });
      const topProcs = Object.entries(byProc).map(([k, v]) => ({ n: k, ...v })).sort((a, b) => b.c - a.c).slice(0, 5);
      const pctOf = (v) => pnl.rev > 0 ? " (" + Math.round((v / pnl.rev) * 100) + "% من الإيراد)" : "";
      const L = (label, val, neg, note) => (
        <div className="flex items-center gap-2" style={{ borderBottom: "0.5px solid " + C.lineSoft, padding: "8px 2px", fontSize: 13 }}>
          <span style={{ flex: 1 }}>{label}{note && <span style={{ color: C.faint, fontSize: 11 }}> · {note}</span>}</span>
          <b style={{ color: neg ? C.low : C.text }}>{neg ? "− " : ""}{egp(val)}</b>
        </div>
      );
      return (
        <div className="flex flex-col gap-4">
          <div className="flex items-center gap-2" style={{ flexWrap: "wrap" }}>
            <button onClick={() => setProfitMonth(monthShift(mo, -1))} style={{ ...inp, cursor: "pointer", width: 40 }} title="الشهر السابق">‹</button>
            <input type="month" value={mo} onChange={(e) => { if (e.target.value) setProfitMonth(e.target.value); }} style={{ ...inp, textAlign: "start" }} />
            <button onClick={() => setProfitMonth(monthShift(mo, 1))} style={{ ...inp, cursor: "pointer", width: 40 }} title="الشهر التالي">›</button>

  function docTitle(t) {

    else if (s.indexOf("د/") === 0) s = s.slice(2);

    s = s.trim();
    return s ? "د. " + s : "";
  }
  function addDoctorInline() {

    setDocSearch("");
  }

      if (old && old !== name) {
        setConsumed((arr) => arr.map((c) => (c.doctor === old ? { ...c, doctor: name } : c)));
        setPending((arr) => arr.map((c) => (c.doctor === old ? { ...c, doctor: name } : c)));
        pushLog("count", "تعديل طبيب: " + old + " ← " + name + " (واتحدّثت كل سجلاته)");
      } else { pushLog("count", "تعديل طبيب: " + name); }
    }
    else { setDoctors((a) => [...a, { id: uid("d"), name, ...rec }]); pushLog("count", "إضافة طبيب: " + name); }
    setDocForm(null);
  }
  function delDoctor(dc) { tomb("doc:" + dc.id); setDoctors((a) => a.filter((d) => d.id !== dc.id)); pushLog("count", "حذف طبيب: " + dc.name); }

    const netMax = rows[0] ? Math.max(rows[0].net, 1) : 1;
    const stdQ = (pid, iid) => { const p = procs.find((x) => x.id === pid); const b = p && (p.bom || []).find((l) => l.id === iid); return b ? b.q : 0; };

        {rows.length === 0 && <Empty icon={<Stethoscope size={26} />} text="مفيش إجراءات مسجّلة بعد." />}
{(() => { const qq = docAnSearch.trim(); return rows.filter((r) => !qq || inc(r.d, qq)); })().map((r) => {

  function viewWaste() {
    const itm = (id) => items.find((x) => x.id === id);
    const costU = (it) => it.cost / Math.max(it.perUnit, 1);
    const stdQ = (pid, iid) => { const p = procs.find((x) => x.id === pid); const b = p && p.bom.find((l) => l.id === iid); return b ? b.q : 0; };
    const recWaste = (r) => { let val = 0, units = 0; r.lines.forEach((l) => { const over = lineOver(r.procId, l.id, l.q); if (over > 0) { const it = itm(l.id); if (it) { val += over * costU(it); units += over; } } }); return { val, units }; };
    const recStd = (r) => { const p = procs.find((x) => x.id === r.procId); return p ? p.bom.reduce((s, b) => { const it = itm(b.id); return s + (it ? b.q * costU(it) : 0); }, 0) : 0; };
    const totWaste = consumed.reduce((s, r) => s + recWaste(r).val, 0);
    const totStd = consumed.reduce((s, r) => s + recStd(r), 0);
    const wastePct = totStd ? Math.round((totWaste / totStd) * 100) : 0;
    // حسب الطبيب
    const byDoc = {}; consumed.forEach((r) => { const w = recWaste(r).val; (byDoc[r.doctor] = byDoc[r.doctor] || { val: 0, cases: 0 }); byDoc[r.doctor].val += w; byDoc[r.doctor].cases++; });
    const docRows = Object.entries(byDoc).map(([d, v]) => ({ d, val: v.val, cases: v.cases, per: v.val / v.cases })).sort((a, b) => b.val - a.val);
    const docMax = docRows[0] ? docRows[0].val : 1;
    // حسب الخامة
    const byMat = {}; consumed.forEach((r) => r.lines.forEach((l) => { const over = lineOver(r.procId, l.id, l.q); if (over > 0) { const it = itm(l.id); if (it) { (byMat[l.id] = byMat[l.id] || { units: 0, val: 0 }); byMat[l.id].units += over; byMat[l.id].val += over * costU(it); } } }));
    const matRows = Object.entries(byMat).map(([id, v]) => ({ it: itm(id), units: v.units, val: v.val })).filter((x) => x.it).sort((a, b) => b.val - a.val);
    const matMax = matRows[0] ? matRows[0].val : 1;
    // مقارنة الأطباء لنفس الإجراء
    const byProc = {}; consumed.forEach((r) => { (byProc[r.procId] = byProc[r.procId] || { name: r.procName, docs: {} }); const dd = byProc[r.procId].docs; (dd[r.doctor] = dd[r.doctor] || { val: 0, cases: 0 }); dd[r.doctor].val += recWaste(r).val; dd[r.doctor].cases++; });
    const procComp = Object.values(byProc).filter((p) => Object.keys(p.docs).length >= 2);
    // نصائح
    const ins = [];
    if (docRows[0] && docRows[0].val > 0) ins.push("أعلى طبيب هدراً: «" + docRows[0].d + "» بـ " + egp(docRows[0].per) + "/حالة (" + docRows[0].cases + " حالة) — راجع أسلوبه.");
    if (matRows[0]) ins.push("أكتر خامة بتتهدر: «" + matRows[0].it.name + "» بـ " + egp(matRows[0].val) + " — راجع الوصفة أو المناولة.");
    procComp.forEach((p) => { const ds = Object.entries(p.docs).map(([d, v]) => ({ d, per: v.val / v.cases })).sort((a, b) => b.per - a.per); if (ds[0].per - ds[ds.length - 1].per > 5) ins.push("في «" + p.name + "» فرق واضح: «" + ds[0].d + "» " + egp(ds[0].per) + "/حالة مقابل «" + ds[ds.length - 1].d + "» " + egp(ds[ds.length - 1].per) + "/حالة."); });
    return (
      <div className="flex flex-col gap-4">
        <div style={{ fontSize: 12.5, color: C.muted }}>الهدر = الاستهلاك الفعلى من التراى فوق الوصفة المعيارية لكل إجراء. بيتقاس لكل طبيب وكل خامة عشان قرار صادق.</div>
        <SearchBar value={wasteSearch} onChange={setWasteSearch} placeholder="دوّر باسم الصنف أو الإجراء…" />
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(132px,1fr))", gap: 10 }}>
          <Metric label="قيمة الهدر" value={egp(totWaste)} color={C.low} icon={<TrendingDown size={15} />} small />
          <Metric label="نسبة الهدر" value={wastePct + "%"} color={wastePct > 10 ? C.low : C.warn} icon={<Activity size={15} />} small />
          <Metric label="إجراءات مسجّلة" value={consumed.length} color={C.primary} icon={<FileText size={15} />} small />
          <Metric label="أعلى طبيب هدراً" value={docRows[0] ? docRows[0].d.replace("د. ", "") : "—"} color={C.tierA} icon={<Users size={15} />} small />
        </div>

        <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 14, padding: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }} className="mb-3">الهدر حسب الطبيب</div>
          <div className="flex flex-col gap-2.5">
            {docRows.map((r) => (
              <div key={r.d} className="flex items-center gap-2" style={{ fontSize: 13 }}>
                <span style={{ minWidth: 70, fontWeight: 600 }}>{r.d}</span>
                <div style={{ flex: 1, height: 10, background: C.bg, borderRadius: 5, overflow: "hidden" }}><div style={{ width: (r.val / docMax * 100) + "%", height: "100%", background: r.val === docMax && r.val > 0 ? C.low : C.warn }} /></div>
                <span style={{ minWidth: 116, textAlign: "left", fontSize: 11.5, color: C.muted }}>{egp(r.val)} · {egp(r.per)}/حالة</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 14, padding: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }} className="mb-3">أكتر الخامات هدراً</div>
          <div className="flex flex-col gap-2.5">
            {matRows.length === 0 && <div style={{ fontSize: 13, color: C.faint }}>مفيش هدر مسجّل.</div>}
            {matRows.filter((r) => { const q = wasteSearch.trim(); return !q || (r.it && inc(r.it.name, q)); }).slice(0, 7).map((r) => (
              <div key={r.it.id} className="flex items-center gap-2" style={{ fontSize: 13 }}>
                <span style={{ minWidth: 96, fontWeight: 600 }}>{r.it.name}</span>
                <div style={{ flex: 1, height: 10, background: C.bg, borderRadius: 5, overflow: "hidden" }}><div style={{ width: (r.val / matMax * 100) + "%", height: "100%", background: C.low }} /></div>
                <span style={{ minWidth: 108, textAlign: "left", fontSize: 11.5, color: C.muted }}>{egp(r.val)} · {r.units} {r.it.subUom} زيادة</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 14, padding: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }} className="mb-1">مقارنة الأطباء فى نفس الإجراء</div>
          <div style={{ color: C.muted, fontSize: 12 }} className="mb-3">متوسط الهدر لكل حالة — مين بيستهلك أكتر في نفس العلاج</div>
          <div className="flex flex-col gap-3">
            {procComp.length === 0 && <div style={{ fontSize: 13, color: C.faint }}>محتاج إجراءات من أكتر من طبيب للمقارنة.</div>}
            {procComp.filter((p) => { const q = wasteSearch.trim(); return !q || inc(p.name, q); }).map((p) => {
              const ds = Object.entries(p.docs).map(([d, v]) => ({ d, per: v.val / v.cases, cases: v.cases })).sort((a, b) => b.per - a.per);
              const mx = ds[0].per || 1;
              return (
                <div key={p.name} style={{ background: C.bg, borderRadius: 10, padding: "10px 12px" }}>
                  <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 7 }}>{p.name}</div>
                  <div className="flex flex-col gap-1.5">
                    {ds.map((x) => (
                      <div key={x.d} className="flex items-center gap-2" style={{ fontSize: 12.5 }}>
                        <span style={{ minWidth: 64 }}>{x.d}</span>
                        <div style={{ flex: 1, height: 8, background: C.surface, borderRadius: 4, overflow: "hidden" }}><div style={{ width: (mx ? x.per / mx * 100 : 0) + "%", height: "100%", background: x.per === mx && mx > 0 ? C.low : C.ok }} /></div>
                        <span style={{ minWidth: 92, textAlign: "left", color: C.muted }}>{egp(x.per)}/حالة · {x.cases}</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 14, padding: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }} className="mb-3 flex items-center gap-2"><Activity size={16} />قرارات مقترحة</div>
          <div className="flex flex-col gap-2">
            {ins.map((t, i) => <div key={i} className="flex items-start gap-2" style={{ background: C.bg, borderRadius: 9, padding: "9px 11px", fontSize: 12.5 }}><span style={{ color: C.low, marginTop: 1 }}>•</span><span>{t}</span></div>)}
            {!ins.length && <div style={{ fontSize: 13, color: C.faint }}>مفيش هدر ملحوظ — الأطباء ملتزمين بالوصفات.</div>}
          </div>
        </div>
      </div>
    );
  }

  function viewItemAnalysis() {
    const r1 = (n) => Math.round(n * 10) / 10;

    const supLead = (id) => { const s = sups.find((x) => x.id === id); return s ? s.leadDays : null; };
    const iaDays = iaPeriod === "all" ? null : parseInt(iaPeriod, 10);
    const inPeriod = (r) => iaDays == null || daysBetween(r.date, today()) <= iaDays;
    const use = {}; consumed.forEach((r) => { if (!inPeriod(r)) return; r.lines.forEach((l) => { (use[l.id] = use[l.id] || { units: 0, cases: 0, procs: {} }); use[l.id].units += l.q; use[l.id].cases++; if (r.procName) use[l.id].procs[r.procName] = 1; }); });
    const useVal = (it) => (use[it.id] ? use[it.id].units * costU(it) : 0);
    const useProcs = (id) => (use[id] ? Object.keys(use[id].procs).length : 0);
    const meta = (it) => {
      const hist = (it.priceHist || []).slice();
      const entries = Object.entries(priceMap[it.id] || {}).map(([sid, pr]) => ({ sid, p: pr, name: supName(sid), lead: supLead(sid) })).sort((a, b) => a.p - b.p);

      const multi = entries.length >= 2 && cheapest.p !== dearest.p;
      const last = hist.length ? hist[hist.length - 1] : null;
      const prev = hist.length >= 2 ? hist[hist.length - 2] : null;
      const change = (last && prev) ? (last.price - prev.price) : 0;
      const changePct = (last && prev && prev.price) ? Math.round((change / prev.price) * 100) : 0;
      const altSave = (multi && cheapest.sid !== it.sup) ? (it.cost - cheapest.p) : 0;
      const altPct = (altSave > 0 && it.cost) ? Math.round((altSave / it.cost) * 100) : 0;
      return { hist, entries, cheapest, dearest, multi, last, prev, change, changePct, altSave, altPct };
    };
    const ups = [], alts = [], downs = [];
    items.forEach((it) => { const m = meta(it); if (m.change > 0) ups.push({ it, m }); else if (m.change < 0) downs.push({ it, m }); if (m.altSave > 0) alts.push({ it, m }); });
    ups.sort((a, b) => b.m.change - a.m.change); alts.sort((a, b) => b.m.altSave - a.m.altSave); downs.sort((a, b) => a.m.change - b.m.change);
    const invValue = items.reduce((s, it) => s + it.store * it.cost, 0);
    const withPrice = items.filter((it) => (it.priceHist || []).length > 0).length;

    const _mc = {}; const mcache = (it) => (_mc[it.id] || (_mc[it.id] = meta(it)));
    // === مقاييس قرارية ===
    const lastUseAll = {}; consumed.forEach((r) => { (r.lines || []).forEach((l) => { if (!lastUseAll[l.id] || daysBetween(r.date, today()) < lastUseAll[l.id]) lastUseAll[l.id] = daysBetween(r.date, today()); }); });
    const daysSinceUse = (it) => (lastUseAll[it.id] != null ? lastUseAll[it.id] : null); // null = مستخدمش خالص
    const stockSub = (it) => (it.store || 0) * Math.max(it.perUnit || 1, 1) + (it.tray || 0); // المخزون بالوحدة الصغيرة

    const dailyRate = (it) => ((use[it.id] && use[it.id].units) || 0) / Math.max(spanDays, 1);

// SearchBar لازم يكون top-level (زي Btn/Metric): تعريفه جوّه InventoryApp كان بيخلق مكوّن جديد الهوية كل render → React بيعيد تركيب حقل البحث بعد كل حرف → فقدان التركيز في كل شاشات البحث
  function SearchBar({ value, onChange, placeholder }) {
    return (
      <div className="flex items-center gap-2 px-3 mb-3" style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 11, height: 40 }}>
        <Search size={16} color={C.faint} />
        <input value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} style={{ flex: 1, border: "none", background: "transparent", outline: "none", fontFamily: F, fontSize: 13.5 }} />
        {value && <button onClick={() => onChange("")} style={{ border: "none", background: "transparent", cursor: "pointer", color: C.faint, display: "flex" }}><X size={15} /></button>}
      </div>
    );
  }
function Btn({ children, onClick, primary, disabled }) {
  return <button onClick={disabled ? undefined : onClick} disabled={!!disabled} className="flex items-center gap-1.5 px-3 py-2" style={{ fontFamily: F, fontSize: 13, fontWeight: 500, borderRadius: 9, cursor: disabled ? "not-allowed" : "pointer", border: "0.5px solid " + (primary ? C.primary : C.line), background: primary ? C.primarySoft : "transparent", color: primary ? C.primaryDark : C.muted, opacity: disabled ? 0.45 : 1 }}>{children}</button>;
}
function Step({ children, onClick, disabled }) {
  return <button onClick={disabled ? undefined : onClick} disabled={!!disabled} style={{ width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", border: "0.5px solid " + C.line, borderRadius: 7, background: C.surface, cursor: disabled ? "not-allowed" : "pointer", color: disabled ? C.faint : C.text, opacity: disabled ? 0.5 : 1 }}>{children}</button>;
}
function Metric({ label, value, color, icon, small }) {
  return <div style={{ background: C.surface, border: "0.5px solid " + C.line, borderRadius: 12, padding: 13 }}><div className="flex items-center gap-1.5" style={{ color: C.muted, fontSize: 12 }}>{icon}{label}</div><div style={{ color, fontWeight: 700, fontSize: small ? 18 : 24 }} className="mt-1">{value}</div></div>;
}
function L({ children }) { return <div style={{ fontSize: 12, color: C.text, fontWeight: 600, marginBottom: 5 }}>{children}</div>; }
function Sec({ children, first }) { return <div style={{ fontWeight: 800, fontSize: 12, color: C.primaryDark, margin: (first ? "0" : "18px") + " 0 11px", paddingInlineStart: 9, borderInlineStart: "3px solid " + C.primary, lineHeight: 1.35 }}>{children}</div>; }
function Empty({ icon, text }) { return <div className="flex flex-col items-center justify-center gap-2 py-12" style={{ color: C.faint }}>{icon}<span style={{ fontSize: 14 }}>{text}</span></div>; }
function TagEditor({ tags, draft, setDraft, onAdd, onRemove, suggestions }) {
  return (
    <div className="flex items-center gap-1.5" style={{ flexWrap: "wrap", flex: 1 }}>
      {tags.map((t) => (
        <span key={t} className="flex items-center gap-1" style={{ background: C.primarySoft, color: C.primaryDark, fontSize: 12, fontWeight: 500, borderRadius: 20, padding: "3px 6px 3px 11px" }}>
          {t}
          <button onClick={() => onRemove(t)} style={{ border: "none", background: "transparent", cursor: "pointer", color: C.primaryDark, display: "flex", padding: 0 }}><X size={12} /></button>
        </span>
      ))}
      <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); onAdd(draft); setDraft(""); } }} placeholder="+ تاج" style={{ border: "0.5px dashed " + C.line, borderRadius: 20, padding: "4px 12px", fontFamily: F, fontSize: 12, width: 84, outline: "none", background: "transparent", color: C.text }} />
      {suggestions.slice(0, 4).map((t) => (
        <button key={t} onClick={() => onAdd(t)} style={{ border: "0.5px dashed " + C.line, background: "transparent", color: C.faint, fontSize: 12, borderRadius: 20, padding: "3px 10px", cursor: "pointer", fontFamily: F }}>+ {t}</button>
      ))}
    </div>
  );
}

/* ===== mount hook for the host shell ===== */
let __invRootRef = null;
function _ensureInvPortal(){
  var ph=document.getElementById("invPortal");
  if(!ph){ ph=document.createElement("div"); ph.id="invPortal"; ph.setAttribute("dir","rtl"); document.body.appendChild(ph); }
  return ph;
}
window.__mountInventory = function(el, forcedRole, userName, allowedAreas){
  if(!el) return;
  try{ if(__invRootRef){ __invRootRef.unmount(); } }catch(e){}
  _ensureInvPortal();
  window.__invLive = true;
  __invRootRef = createRoot(el);
  __invRootRef.render(<InventoryApp forcedRole={forcedRole} userName={userName} allowedAreas={allowedAreas} />);
};
window.__unmountInventory = function(){
  try{ if(__invRootRef){ __invRootRef.unmount(); __invRootRef=null; } }catch(e){}
  window.__invLive = false;
  var ph=document.getElementById("invPortal"); if(ph)ph.innerHTML="";
};
/* headless alert count (computed from the seed) so the sidebar badge shows
   BEFORE the user ever opens the inventory tab; the live module overrides it
   while mounted */
window.__invSeedNotif = function(allowedAreas){
  try{
    var areas = allowedAreas || []; var has = function(a){ return areas.indexOf(a) >= 0; };
    var its = (typeof __invStore!=="undefined" && __invStore && __invStore.items && __invStore.items.length) ? __invStore.items : freshItems();
    var n = 0;
    if(has("tray")) n += its.filter(function(it){ return trayLow(it); }).length;
    if(has("orders")) n += its.filter(function(it){ return needsOrder(it); }).length;
    return n;
  }catch(e){ return 0; }
};
window.__invReady = true;
try{ if(window.__computeHostNotif) window.__computeHostNotif(); }catch(e){}
})();

</script>
