<style>
:root{--teal:#1f5a52;--teal2:#2e7d6f;--tealdk:#163f39;--mint:#eaf5f1;--accent:#2e9e84;--blue:#2e7d6f;--blue2:#3fa890;--lblue:#eef6f3;--green:#1f7a4d;--amber:#b87900;--red:#b23b30;--purple:#7a5bd0;--bg:#f4f7f8;--card:#fff;--line:#e1e8e6;--ink:#16201d;--muted:#48564f;--navy:#1f5a52;}
*{box-sizing:border-box;font-family:"Almarai","Tajawal","Segoe UI",Tahoma,sans-serif;}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-size:15px;line-height:1.65;}
.ic{display:inline-block;vertical-align:-4px;}

.content>*{animation:fadeUp .35s ease both;}
#app{display:flex;min-height:100vh;}
.side{width:250px;background:linear-gradient(180deg,var(--teal),var(--tealdk));color:#fff;display:flex;flex-direction:column;padding:18px 0;position:fixed;top:0;right:0;height:100vh;z-index:40;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:-6px 0 24px rgba(0,0,0,.18);}
.side.open{transform:translateX(0);}
.overlay{position:fixed;inset:0;background:rgba(10,26,38,.45);z-index:35;opacity:0;visibility:hidden;transition:.25s;}
.overlay.show{opacity:1;visibility:visible;}
.side .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:6px 20px 18px;}
.side .brand .lg{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;}
.nav{display:flex;flex-direction:column;gap:4px;padding:0 12px;flex:1;}
.nav a{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;color:#e6eefb;font-size:15px;font-weight:600;cursor:pointer;transition:.12s;}
.nav a:hover{background:rgba(255,255,255,.10);color:#fff;}
.nav a.active{background:rgba(255,255,255,.18);color:#fff;}
.nav a .i{width:20px;text-align:center;}
.side .who{margin-top:auto;padding:14px 18px 4px;border-top:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:10px;font-size:13px;}
.side .who .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:700;}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:13px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;}
.menu-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--teal);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:.12s;}
.menu-btn:hover{background:var(--mint);border-color:var(--accent);}
.topbar .t1{font-size:12px;color:var(--muted);}
.topbar .t2{font-size:16px;font-weight:700;color:var(--teal);}
.content{padding:22px 26px 50px;max-width:1060px;width:100%;margin:0 auto;}
.phead h1{font-size:24px;margin:0 0 3px;color:var(--ink);font-weight:700;}
.phead p{margin:0 0 18px;color:var(--muted);font-size:14px;}
.subtabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
.subtab{padding:9px 16px;border-radius:11px;background:#fff;border:1px solid var(--line);color:var(--teal);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.subtab:hover{border-color:var(--accent);}
.subtab.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(16,26,38,.05);transition:.18s;}
.card:hover{box-shadow:0 6px 18px rgba(16,26,38,.08);}
.card h3{margin:0 0 12px;color:var(--teal);font-size:16px;display:flex;align-items:center;gap:8px;font-weight:700;}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
select,input,textarea{font-size:14px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);}
.btn{background:linear-gradient(135deg,var(--accent),var(--teal2));color:#fff;border:none;padding:10px 18px;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;box-shadow:0 4px 12px rgba(46,158,132,.25);transition:.15s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(46,158,132,.32);}
.btn:active{transform:translateY(0);}
.btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--accent);box-shadow:none;}
.btn.ghost:hover{background:var(--mint);}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px;box-shadow:none;}
.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
.gemp{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
#app,.main,.content,.card{max-width:100%;}
.content{overflow-x:hidden;}
svg{max-width:100%;}
.metric{background:var(--lblue);border-radius:16px;padding:15px 12px;text-align:center;border:1px solid var(--line);transition:.18s;}
.metric:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(31,90,82,.08);}
.metric .ic{color:var(--accent);margin-bottom:4px;}
.metric .v{font-size:25px;font-weight:800;color:var(--teal);}
.metric .l{font-size:12px;color:var(--muted);margin-top:3px;}
.pill{display:inline-block;padding:4px 14px;border-radius:20px;font-weight:700;font-size:12.5px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.bar{height:13px;background:#eef3f1;border-radius:8px;overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:8px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.brk{margin-bottom:11px;}.brk .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.empcard{cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;box-shadow:0 1px 4px rgba(20,52,90,.05);transition:.15s;}
.empcard:hover{border-color:var(--blue);box-shadow:0 8px 18px rgba(20,52,90,.12);transform:translateY(-2px);}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;flex:none;}
.task{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);}
.task:last-child{border:none;}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);}
.task span{font-size:14px;flex:1;}
.dimrow{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap;}
.dimrow .dl{font-size:13px;min-width:215px;font-weight:bold;color:var(--navy);display:flex;align-items:center;gap:7px;}
.dimrow .dl small{display:block;font-weight:normal;color:var(--muted);font-size:11px;}
.rate{display:flex;gap:5px;}
.rate button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-weight:bold;color:var(--navy);transition:.1s;}
.rate button:hover{border-color:var(--blue);}
.rate button.on{color:#fff;border-color:transparent;transform:scale(1.05);}
.note{width:100%;min-height:46px;margin-top:8px;}
.ok{color:var(--green);font-weight:bold;font-size:13px;}
.muted{color:var(--muted);font-size:12.5px;line-height:1.6;}
.insight{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;}
.insight:last-child{border:none;}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;}
.sugg{background:#f3f9f4;border-right:4px solid var(--green);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:13px;display:flex;gap:8px;}
.delta{font-size:13px;font-weight:bold;}
.up{color:var(--green);}.down{color:var(--red);}.flat{color:var(--muted);}
.qrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.qrow .nm{font-weight:bold;min-width:120px;}
.lock{max-width:360px;margin:30px auto;text-align:center;}
.lock .big{font-size:46px;}
table{width:100%;border-collapse:collapse;font-size:13px;}th,td{border:1px solid var(--line);padding:8px;text-align:right;}th{background:var(--navy);color:#fff;}

.navparent .caret{margin-right:auto;font-size:11px;opacity:.85;}

<script>
/* ============================================================
   ⚙️  إعدادات Neon Data API — البديل لـ Supabase
   - NEON_DATA_API_URL = من Neon Console → Data API → API URL (لحد /rest/v1)
   - NEON_AUTH_URL     = من Neon Console → Auth → Configuration (Auth URL)
   الاتصال بيسجّل دخول بمستخدم ثابت تلقائيًا (sign-in/email) ويقرأ التوكن من
   ترويسة Set-Auth-Jwt، كله fetch مباشر من غير أي مكتبة. لو المستخدم مش موجود
   بينشئه أول مرة تلقائيًا. شروط التشغيل: الجدول RLS متعطّل، وصلاحيات CRUD
   ممنوحة لـ authenticated (وكمان anonymous). الباسورد ظاهر بالكود زي anon key
   القديم — مفيش فرق أمني لأن القاعدة مفتوحة بالـ grants.
   ============================================================ */
const NEON_DATA_API_URL  = "https://ep-holy-paper-aips0j4v.apirest.c-4.us-east-1.aws.neon.tech/neondb/rest/v1";
const NEON_AUTH_URL      = "https://ep-holy-paper-aips0j4v.neonauth.c-4.us-east-1.aws.neon.tech/neondb/auth";
const NEON_AUTH_EMAIL    = "appbot@alsamy.app";
const NEON_AUTH_PASSWORD = "Alsamy-Neon-2026-Bot-9F3kQ";
/* ============================================================ */

// عميل صغير متوافق مع PostgREST يحاكي واجهة Supabase: .from().select().eq().like().limit().range().upsert().delete()
function createNeonClient(baseUrl,authUrl,authEmail,authPass){
  baseUrl=(baseUrl||"").replace(/\/+$/,"");
  authUrl=(authUrl||"").replace(/\/+$/,"");
  var _tok=null,_tokExp=0,_tokP=null;
  // يجيب التوكن من ترويسة Set-Auth-Jwt بعد تسجيل الدخول (مع بدائل get-session و /token)
  function _readJwt(res){ return res.headers.get("set-auth-jwt")||res.headers.get("Set-Auth-Jwt")||null; }
  async function _signin(){
    try{
      var res=await fetch(authUrl+"/sign-in/email",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({email:authEmail,password:authPass})});
      var jwt=_readJwt(res);
      if(jwt)return jwt;
      if(res.ok){
        try{var r2=await fetch(authUrl+"/get-session",{credentials:"include"});jwt=_readJwt(r2);if(jwt)return jwt;}catch(e){}
        try{var r3=await fetch(authUrl+"/token",{credentials:"include"});if(r3.ok){var j=await r3.json();if(j&&(j.token||j.jwt))return (j.token||j.jwt);}}catch(e){}
      }
    }catch(e){}
    return null;
  }
  async function _fetchToken(){
    if(!authUrl||!authEmail)return null;
    try{
      var jwt=await _signin();
      if(jwt)return jwt;
      // أول تشغيل: المستخدم الثابت مش موجود → ننشئه ثم نسجّل دخول
      try{await fetch(authUrl+"/sign-up/email",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({email:authEmail,password:authPass,name:"App Bot"})});}catch(e){}
      jwt=await _signin();
      return jwt;
    }catch(e){console.error("neon token fetch failed",e);return null;}
  }
  async function _token(force){
    if(force){_tok=null;_tokExp=0;}
    var now=Date.now();
    if(_tok&&now<_tokExp)return _tok;
    if(_tokP)return _tokP;
    _tokP=(async function(){var t=await _fetchToken();_tok=t;_tokExp=t?(Date.now()+11*60*1000):0;_tokP=null;return t;})();
    return _tokP;
  }
  function build(method,table,cfg){
    cfg=cfg||{};
    const s={method:method,table:table,select:null,filters:[],limit:null,offset:null,body:cfg.body,upsert:!!cfg.upsert,onConflict:cfg.onConflict||null};
    const api={
      select:function(c){s.select=c;return api;},
      eq:function(col,val){s.filters.push(encodeURIComponent(col)+"=eq."+encodeURIComponent(val));return api;},
      like:function(col,pat){s.filters.push(encodeURIComponent(col)+"=like."+encodeURIComponent(String(pat).replace(/%/g,"*")));return api;},
      notLike:function(col,pat){s.filters.push(encodeURIComponent(col)+"=not.like."+encodeURIComponent(String(pat).replace(/%/g,"*")));return api;},
      limit:function(n){s.limit=n;return api;},
      range:function(a,b){s.offset=a;s.limit=(b-a+1);return api;},
      then:function(res,rej){return exec(s).then(res,rej);}
    };
    return api;
  }
  async function exec(s,_retried){
    try{
      const qs=[];
      if(s.select)qs.push("select="+encodeURIComponent(s.select));
      s.filters.forEach(function(f){qs.push(f);});
      if(s.limit!=null)qs.push("limit="+s.limit);
      if(s.offset!=null)qs.push("offset="+s.offset);
      if(s.upsert&&s.onConflict)qs.push("on_conflict="+encodeURIComponent(s.onConflict));
      const url=baseUrl+"/"+s.table+(qs.length?("?"+qs.join("&")):"");
      const headers={"Accept":"application/json"};
      const prefer=[];
      if(s.method!=="GET"){headers["Content-Type"]="application/json";prefer.push("return=minimal");}
      if(s.upsert)prefer.push("resolution=merge-duplicates");
      if(prefer.length)headers["Prefer"]=prefer.join(",");
      const tok=await _token(false);
      if(tok)headers["Authorization"]="Bearer "+tok;
      const init={method:s.method,headers:headers};
      if(s.body!=null)init.body=JSON.stringify(s.body);
      const r=await fetch(url,init);
      if((r.status===401||r.status===403||r.status===400)&&!_retried&&authUrl){ await _token(true); return exec(s,true); } // token missing/expired — refetch once
      if(!r.ok){let t="";try{t=await r.text();}catch(e){}return {data:null,error:{message:"HTTP "+r.status+(t?(": "+t):""),code:r.status}};}
      let data=null;
      if(s.method==="GET"){const txt=await r.text();try{data=txt?JSON.parse(txt):[];}catch(e){data=[];}}
      return {data:data,error:null};
    }catch(e){return {data:null,error:{message:(e&&e.message)||String(e)}};}
  }
  return {from:function(table){return {
    select:function(c){return build("GET",table,{}).select(c);},
    upsert:function(row,opt){const x=Object.assign({},row);if(("value" in x)&&typeof x.value!=="string"&&x.value!=null)x.value=JSON.stringify(x.value);return build("POST",table,{body:x,upsert:true,onConflict:(opt&&opt.onConflict)||"key"});},
    insert:function(row){return build("POST",table,{body:row});},
    update:function(row){return build("PATCH",table,{body:row});},
    delete:function(){return build("DELETE",table,{});}
  };}};
}

(function(){
// يحوّل النص الراجع من عمود value (text) إلى كائن لو كان JSON، وإلا يرجّعه كما هو (للصور data:image…)
function _pv(v){ if(typeof v!=="string")return v; const t=v.trim(); if(!t)return v; const c=t[0]; if(c!=="{"&&c!=="["&&c!=="\""&&t!=="true"&&t!=="false"&&t!=="null"&&!/^-?\d/.test(t))return v; try{return JSON.parse(t);}catch(e){return v;} }
window.__pv=_pv;
let _sb=createNeonClient(NEON_DATA_API_URL,NEON_AUTH_URL,NEON_AUTH_EMAIL,NEON_AUTH_PASSWORD);
window.__sb=_sb;
window.__ensureSb=async function(){return _sb;};
try{window.sset=sset;window.sget=sget;window.showImg=showImg;window.__appCfg=function(){return cfg;};}catch(e){} // عرض دوال التخزين وفتح الصورة لسكوب React + قراءة إعدادات HR (مرتبات) للربحية

// In-memory cache of the whole dataset (key -> parsed value).
// Loaded once from Supabase on startup, then kept in sync on every write.
const cache={};
window.__cacheReady=false;

// Load all rows from the app_data table into the cache.
async function loadAll(){
  window.__diag={sbLib:true,client:false,rows:0,err:null};
  if(!_sb&&window.__ensureSb){await window.__ensureSb();}
  window.__diag.client=!!_sb;
  if(!_sb){window.__cacheReady=true;window.__loadOK=false;window.__online=false;window.__diag.err="لم يتم إنشاء اتصال Supabase (المكتبة لم تُحمّل)";return false;}
  try{
    let from=0,page=1000,done=false,n=0,loadErr=false;
    while(!done){
      // lazy-load: don't pull image blobs on startup (huge bandwidth). They load on demand via sget.
      const {data,error}=await _sb.from("app_data").select("key,value").notLike("key","simg:*").notLike("key","aimg:*").notLike("key","aqimg:*").notLike("key","acadimg:*").notLike("key","rimg:*").notLike("key","inv:state").notLike("key","config_bak:*").notLike("key","log:*").notLike("key","notify:*").notLike("key","daily:*").notLike("key","selfcheck:*").notLike("key","evalSnap:*").range(from,from+page-1);
      if(error){console.error("Supabase load error",error);window.__diag.err=(error.message||JSON.stringify(error));loadErr=true;break;}
      (data||[]).forEach(r=>{cache[r.key]=_pv(r.value);});n+=(data||[]).length;
      if(!data||data.length<page)done=true;else from+=page;
    }
    if(!loadErr){ try{ await _loadRecentHist(); }catch(e){} }
    window.__diag.rows=n;window.__cacheReady=true;
    // A read error means we are NOT in sync with the cloud. Report failure so the app
    // refuses to boot on empty data (and refuses to write over the real cloud data).
    try{ const __p=_loadPending(); Object.keys(__p).forEach(function(k){ const e=__p[k]; if(e&&e.del)delete cache[k]; else if(e)cache[k]=e.v; }); }catch(e){}
    const ok=!loadErr;window.__loadOK=ok;window.__online=(ok&&_pendingCount()===0);
    try{ setTimeout(_flushPending,400); }catch(e){}
    return ok;
  }catch(e){console.error(e);window.__diag.err=(e&&e.message)||String(e);window.__cacheReady=true;window.__loadOK=false;window.__online=false;return false;}
}
window.__loadAll=loadAll;

// ── تحميل السجلّات التشغيلية (daily/selfcheck) عند الطلب بدل تحميل كل التاريخ وقت الإقلاع ──
// الإقلاع بيحمّل نافذة حديثة بس (آخر 4 شهور)؛ أي شهر أقدم بيتحمّل أوتوماتيك أول ما يُفتح تقريره/تقييمه.
// كده حجم الإقلاع ثابت مهما كبر عمر النظام (كان بيكبر خطيًا كل يوم).
const _histDone={};   // memo لكل (موظف+شهر): بيخزّن الـ Promise نفسه — آمن ضد السباق لو اتنادى بالتوازي
const _histWin={};    // شهور نافذة الإقلاع (محمّلة لكل الموظفين)
function _loadHist(empId,month){
  if(_histWin[month])return Promise.resolve();       // ضمن نافذة الإقلاع → محمّل أصلًا
  const mk=empId+":"+month;
  if(_histDone[mk])return _histDone[mk];              // نفس الطلب طائر بالفعل → استنّى نفس الوعد (مايتحمّلش مرتين ولا يقرأ ناقص)
  _histDone[mk]=(async function(){
    if(!_sb)return;
    try{ await Promise.all(["daily","selfcheck"].map(async function(pref){ const r=await _sb.from("app_data").select("key,value").like("key",pref+":"+empId+":"+month+"-%"); if(r&&!r.error&&Array.isArray(r.data))r.data.forEach(function(row){cache[row.key]=_pv(row.value);}); })); }catch(e){}
  })();
  return _histDone[mk];
}
// يضمن تحميل الشهر المطلوب + شهرين خلفهم (عشان بحث «آخر تنفيذ» للمهام الدورية عبر الشهور يفضل دقيق)
async function ensureHistLoaded(empId,month){
  if(!empId||!/^\d{4}-\d{2}$/.test(month||""))return;
  let m=month; const list=[m]; for(let i=0;i<2;i++){ m=prevMonth(m); list.push(m); }
  for(const mm of list){ await _loadHist(empId,mm); }
}
window.__ensureHistLoaded=ensureHistLoaded;
// نافذة الإقلاع: آخر 4 شهور من daily/selfcheck لكل الموظفين — حجم ثابت
async function _loadRecentHist(){
  if(!_sb)return;
  try{
    let m=thisMonth(); const months=[m]; for(let i=0;i<3;i++){ m=prevMonth(m); months.push(m); }
    // كل الاستعلامات بالتوازي (قراءات مستقلة) بدل واحد ورا التاني — إقلاع أسرع
    await Promise.all(months.map(async function(mm){
      await Promise.all(["daily","selfcheck"].map(async function(pref){
        try{ const r=await _sb.from("app_data").select("key,value").like("key",pref+":%:"+mm+"-%"); if(r&&!r.error&&Array.isArray(r.data))r.data.forEach(function(row){cache[row.key]=_pv(row.value);}); }catch(e){}
      }));
      _histWin[mm]=true;
    }));
  }catch(e){console.error("recent-hist load failed",e);}
}
window.__loadRecentHist=_loadRecentHist;

// ── Bulletproof protection against resetting real data to the default seed ──
// The disaster: the cloud `config` (real employees) gets overwritten by the 2-employee
// default seed (موظف الاستقبال + مساعدة الطبيب, ids e1/e2). These checks consult the LIVE
// cloud — never the in-memory cache — so the reset is impossible even if the cache is wrong.
function _isPristineSeedEmployees(v){
  if(!v||!Array.isArray(v.employees)||v.employees.length!==2)return false;
  const byId={};v.employees.forEach(e=>{byId[e.id]=e;});
  const a=byId["e1"],b=byId["e2"];
  return !!a&&!!b
    &&a.role==="receptionist"&&a.name==="موظف الاستقبال"
    &&b.role==="assistant"&&b.name==="مساعدة الطبيب";
}
// Read the config row straight from Supabase. Returns the object, or null if the cloud
// genuinely has no config, or undefined if the read failed (status unknown).
async function _cloudConfig(){
  if(!_sb)return undefined;
  try{
    const {data,error}=await _sb.from("app_data").select("value").eq("key","config").limit(1);
    if(error){console.error("cloud config check failed",error);return undefined;}
    return (data&&data.length)?_pv(data[0].value):null;
  }catch(e){console.error("cloud config check failed",e);return undefined;}
}

// sget: read from cache (already loaded from Supabase). 'session' stays device-local.
async function sget(k){if(k==="session"){try{return JSON.parse(localStorage.getItem("cd:session"));}catch(e){return null;}}let v=cache[k];
  // lazy-load image blobs: not preloaded at startup, fetched from the cloud only when actually viewed
  if((v===undefined||v===null)&&!window.__demo&&_sb&&(k.indexOf("simg:")===0||k.indexOf("aimg:")===0||k.indexOf("aqimg:")===0||k.indexOf("acadimg:")===0||k.indexOf("rimg:")===0||k.indexOf("log:")===0||k.indexOf("notify:")===0||k.indexOf("config_bak:")===0||k.indexOf("evalSnap:")===0)){
    try{const {data,error}=await _sb.from("app_data").select("value").eq("key",k).limit(1);if(!error&&data&&data.length){v=_pv(data[0].value);cache[k]=v;}}catch(e){}
  }
  return (v===undefined||v===null)?null:(typeof v==="string"?v:JSON.parse(JSON.stringify(v)));}

// sset: update cache + upsert to Supabase. null value => delete row. 'session' stays device-local.
async function sset(k,v){
  if(window.__demo){ // preview mode: in-memory only, never persist anywhere
    if(k==="session"){try{if(v==null)localStorage.removeItem("cd:session");else localStorage.setItem("cd:session",JSON.stringify(v));}catch(e){}return;}
    if(v===null||v===undefined)delete cache[k];else cache[k]=JSON.parse(JSON.stringify(v));return;
  }
  if(k==="session"){try{if(v===null||v===undefined)localStorage.removeItem("cd:session");else localStorage.setItem("cd:session",JSON.stringify(v));}catch(e){}return;}
  // HARD GUARD: never write if we did not confirm a successful load from the cloud.
  // Otherwise an empty/partial in-memory state could overwrite the real data in Supabase.
  if(!window.__loadOK){
    if(k==="config"&&_isPristineSeedEmployees(v)){netWarn("اتمنع حفظ الإعدادات الافتراضية — مفيش اتصال مؤكّد بالسحابة.");return;}
    if(k!=="session"){ if(v===null||v===undefined)delete cache[k]; else cache[k]=JSON.parse(JSON.stringify(v)); _enqueue(k,v); }
    netWarn("💾 اتسجّل على جهازك — مفيش اتصال مؤكّد بالسحابة. هيتزامن تلقائيًا أول ما النت يرجع.");
    return;
  }
  // SAFETY GUARD: never delete the whole config row.
  if(k==="config"&&(v===null||v===undefined)){console.error("BLOCKED: refused to delete the config row");return;}
  // SAFETY GUARD: never let the bare default seed overwrite real data.
  if(k==="config"&&_isPristineSeedEmployees(v)){
    // This write is the untouched default seed (2 employees e1/e2). It is only ever
    // legitimate on a brand-new, empty database. Verify against the LIVE cloud before writing.
    const live=await _cloudConfig();
    if(live===undefined){
      // Could not confirm the cloud state → refuse rather than risk wiping real data.
      console.error("BLOCKED: cannot verify cloud config; refusing to write default seed");
      netWarn("اتمنع الحفظ — مش قادرين نتأكد من بيانات السحابة. حدّث الصفحة لما النت يستقر.");
      return;
    }
    if(live&&!_isPristineSeedEmployees(live)){
      // The cloud already holds REAL employee data → never reset it to the seed.
      console.error("BLOCKED: refused to reset real config to default seed (live cloud check)");
      cache["config"]=live;
      netWarn("🛡️ اتمنع إعادة الضبط للصفر — بياناتك في السحابة سليمة، جاري إعادة التحميل.");
      setTimeout(()=>{try{location.reload();}catch(e){}},1400);
      return;
    }
    // else: cloud is empty or itself only the seed → safe to seed.
  }
  if(v===null||v===undefined){
    delete cache[k];
    if(_sb){try{const {error}=await _sb.from("app_data").delete().eq("key",k);if(error){console.error("Supabase delete error",error);_enqueue(k,null);netFail();}else{_dequeue(k);setOnline(true);if(_pendingCount()>0)_flushPending();}}catch(e){console.error("Supabase delete error",e);_enqueue(k,null);netFail();}}else{_enqueue(k,null);}
    return;
  }
  if(k==="config"&&!window.__demo&&window.__cfgBase){
    // 3-way merge: re-read the live cloud config and apply ONLY the keys THIS device
    // actually changed since load — so a stale tab/phone can't wipe another device's edits (e.g. tasks).
    try{
      const __live=await _cloudConfig();
      if(__live&&typeof __live==="object"){
        const __base=window.__cfgBase;const __merged=JSON.parse(JSON.stringify(__live));
        Object.keys(v).forEach(function(kk){ if(JSON.stringify(v[kk])!==JSON.stringify(__base[kk])) __merged[kk]=v[kk]; });
        v=__merged;try{cfg=v;}catch(e){}
      }
    }catch(e){}
  }
  cache[k]=JSON.parse(JSON.stringify(v));
  if(_sb){try{const {error}=await _sb.from("app_data").upsert({key:k,value:v,updated_at:new Date().toISOString()},{onConflict:"key"});if(error){console.error("Supabase save error",error);_enqueue(k,v);netFail();}else{_dequeue(k);setOnline(true);if(_pendingCount()>0)_flushPending();}}catch(e){console.error("Supabase save error",e);_enqueue(k,v);netFail();}}else{_enqueue(k,v);}
  try{_autolog(k);}catch(e){}
  try{if(k==="config")_snapshotConfig(v);}catch(e){}
  try{if(k==="config"&&!window.__demo)window.__cfgBase=JSON.parse(JSON.stringify(v));}catch(e){}
}
// Keep a rolling daily snapshot of config so it can always be recovered
let _snapDone={};
async function _snapshotConfig(v){
  if(!v||!Array.isArray(v.employees)||!v.employees.length)return;
  if(v.employees.length===2&&v.employees.every(e=>e.id==="e1"||e.id==="e2"))return; // don't snapshot the default seed
  const day=today();const bk=`config_bak:${day}`;
  if(_snapDone[day])return; // one snapshot per day is enough
  _snapDone[day]=true;
  cache[bk]=JSON.parse(JSON.stringify(v));
  if(_sb){try{await _sb.from("app_data").upsert({key:bk,value:v,updated_at:new Date().toISOString()},{onConflict:"key"});}catch(e){}}
  // تقليم: نحتفظ بآخر 14 نسخة احتياطية بس (النسخ القديمة كانت بتتراكم للأبد وتتحمّل كل إقلاع)
  try{
    const keepFrom=addDays(day,-14); // أي نسخة أقدم من 14 يوم تتشال
    let baks=[];
    if(_sb){ const r=await _sb.from("app_data").select("key").like("key","config_bak:%"); if(r&&!r.error&&Array.isArray(r.data))baks=r.data.map(function(x){return x.key;}); }
    else { baks=Object.keys(cache).filter(function(k){return k.indexOf("config_bak:")===0;}); }
    for(const k of baks){ const d=k.split(":")[1]; if(/^\d{4}-\d{2}-\d{2}$/.test(d||"")&&d<keepFrom){ try{await sset(k,null);}catch(e){} } }
  }catch(e){}
}
// Build a human-readable label for an automatic log entry from the storage key.
function _logLabel(k){
  if(k.indexOf("log:")===0||k.indexOf("gam:")===0||k.indexOf("notify:")===0||k.indexOf("simg:")===0||k.indexOf("aimg:")===0||k.indexOf("aqimg:")===0||k.indexOf("rimg:")===0||k==="session")return null;
  if(k==="config")return {a:"عدّل الإعدادات أو الحسابات"};
  if(k.indexOf("selfcheck:")===0)return {a:"سجّل حضوره ومهامه اليومية"};
  if(k.indexOf("daily:")===0){const id=k.split(":")[1];const e=(cfg&&cfg.employees||[]).find(x=>x.id===id);return {a:"راجع وقيّم أداء موظف",d:e?e.name:""};}
  if(k.indexOf("assign:")===0){const id=k.split(":")[1];const e=(cfg&&cfg.employees||[]).find(x=>x.id===id);return {a:"حدّث المهام المكلّفة",d:e?e.name:""};}
  if(k.indexOf("invoice:")===0)return {a:"حدّث حجم التشغيل",d:k.split(":")[1]};
  return null;
}
// Automatic logging: records who (current user) changed what and when. Dedupes rapid repeats.
async function _autolog(k){
  if(!curUser)return;
  const lab=_logLabel(k);if(!lab)return;
  const actor=curUser.name||"؟";const day=today();const lk=`log:${day}`;
  let arr=cache[lk];arr=arr?JSON.parse(JSON.stringify(arr)):[];
  const now=Date.now();const last=arr[arr.length-1];
  if(last&&last.actor===actor&&last.action===lab.a&&(last.detail||"")===(lab.d||"")&&(now-last.t)<90000){last.t=now;}
  else{arr.push({t:now,actor,action:lab.a,detail:lab.d||""});if(arr.length>800)arr.shift();}
  cache[lk]=arr;
  if(_sb){try{await _sb.from("app_data").upsert({key:lk,value:arr,updated_at:new Date().toISOString()},{onConflict:"key"});}catch(e){}}
}

// slist: prefix match over cached keys.
async function slist(p){return Object.keys(cache).filter(x=>x.indexOf(p)===0);}

// ── Local-first write queue: edits are saved on the device and retried until the cloud confirms ──
const PKEY="cd:pending";
function _loadPending(){try{return JSON.parse(localStorage.getItem(PKEY))||{};}catch(e){return {};}}
function _savePending(p){try{localStorage.setItem(PKEY,JSON.stringify(p));}catch(e){}}
function _enqueue(k,v){ if(k==="session")return; try{const p=_loadPending(); p[k]={v:(v===undefined?null:v),del:(v===null||v===undefined),t:Date.now()}; _savePending(p);}catch(e){} try{_renderNetBanner();}catch(e){} }
function _dequeue(k){ try{const p=_loadPending(); if(k in p){ delete p[k]; _savePending(p); }}catch(e){} try{_renderNetBanner();}catch(e){} }
function _pendingCount(){ try{return Object.keys(_loadPending()).length;}catch(e){return 0;} }
window.__pendingCount=_pendingCount;
let _flushing=false;
async function _flushPending(){
  if(_flushing||!_sb)return; const p=_loadPending(); const keys=Object.keys(p); if(!keys.length){window.__online=true;try{_renderNetBanner();}catch(e){}return;}
  _flushing=true; let allOk=true;
  for(const k of keys){
    const ent=p[k]; if(!ent){continue;}
    try{
      // CONCURRENCY GUARD: if the cloud changed AFTER this edit was queued, the local edit is stale.
      // Keep the cloud value (refresh the cache) and drop our queued write — never clobber newer data.
      try{ const __r=await _sb.from("app_data").select("value,updated_at").eq("key",k).limit(1); const __c=__r&&__r.data; if(__c&&__c.length&&__c[0].updated_at){ const __ct=new Date(__c[0].updated_at).getTime(); if(__ct > (ent.t||0)+1500){ if(!ent.del)cache[k]=_pv(__c[0].value); else delete cache[k]; if(k==="config"&&__c[0].value)cache["config"]=_pv(__c[0].value); _dequeue(k); continue; } } }catch(e){}
      if(k==="config"&&!ent.del&&_isPristineSeedEmployees(ent.v)){ const live=await _cloudConfig(); if(live&&!_isPristineSeedEmployees(live)){ _dequeue(k); continue; } }
      if(ent.del){ const {error}=await _sb.from("app_data").delete().eq("key",k); if(error){allOk=false;continue;} }
      else { const {error}=await _sb.from("app_data").upsert({key:k,value:ent.v,updated_at:new Date(ent.t||Date.now()).toISOString()},{onConflict:"key"}); if(error){allOk=false;continue;} }
      _dequeue(k);
    }catch(e){ allOk=false; }
  }
  _flushing=false;
  window.__online = allOk && _pendingCount()===0;
  try{_renderNetBanner();}catch(e){}
}
window.__flushPending=_flushPending;
function _renderNetBanner(){
  try{
    let b=document.getElementById("netBanner");
    const pend=_pendingCount(); const offline=(window.__online===false);
    if(pend===0 && !offline){ if(b)b.style.display="none"; return; }
    if(!b){ b=document.createElement("div"); b.id="netBanner"; b.style.cssText="position:fixed;top:0;left:0;right:0;padding:9px 14px;font-family:Tajawal,Almarai,sans-serif;font-size:13.5px;font-weight:700;text-align:center;z-index:99998;direction:rtl;box-shadow:0 2px 10px rgba(0,0,0,.18)"; document.body.appendChild(b); }
    if(pend>0){
      b.style.background="#b87900"; b.style.color="#fff";
      b.innerHTML="⏳ في "+pend+" تعديل محفوظ على جهازك بيستنى المزامنة. <button onclick=\"window.__flushPending&&window.__flushPending()\" style=\"background:#fff;color:#b87900;border:none;border-radius:8px;padding:3px 12px;font-weight:700;cursor:pointer;margin-right:8px\">🔄 زامن الآن</button>";
    } else {
      b.style.background="#b23b30"; b.style.color="#fff";
      b.innerHTML="⚠️ مفيش اتصال بقاعدة البيانات — تعديلاتك بتتحفظ على الجهاز وهتتزامن أول ما النت يرجع. <button onclick=\"location.reload()\" style=\"background:#fff;color:#b23b30;border:none;border-radius:8px;padding:3px 12px;font-weight:700;cursor:pointer;margin-right:8px\">🔄 إعادة المحاولة</button>";
    }
    b.style.display="block";
  }catch(e){}
}

// ── إدارة صور الإثبات في القاعدة (لوحة المالك) + مسح تلقائي اختياري ──
// الصور blobs بمفاتيح ببادئات: simg (مهام يومية) / aimg (إثبات مكلّفة) / aqimg (توضيحية مدير) / acadimg (أكاديمية) / rimg (فواتير).
// قاعدة أمان ثابتة: صور الفواتير (rimg) مستندات مالية — ممنوع مسحها تلقائيًا نهائيًا؛ يدوي فقط بتأكيد نصّي صريح.
// المسح بيشيل الـ blob بس؛ السجل والميتاداتا بيفضلوا، والواجهة بتتعامل مع غياب الصورة بسلاسة.
const IMG_CATS=[
  {k:"simg",   label:"صور المهام اليومية",           auto:true,  dDays:60},
  {k:"aimg",   label:"إثبات المهام المكلّفة",        auto:true,  dDays:60},
  {k:"aqimg",  label:"صور توضيحية من المدير",        auto:true,  dDays:60},
  {k:"acadimg",label:"صور الأكاديمية",               auto:true,  dDays:90},
  {k:"rimg",   label:"صور الفواتير (مستندات مالية)", auto:false, prot:true}
];
// مفاتيح صور قسم (المفاتيح فقط — رخيص، من غير تحميل الصور)
async function _imgKeys(prefix){ if(!_sb)return []; try{const r=await _sb.from("app_data").select("key").like("key",prefix+":*"); if(r&&!r.error&&Array.isArray(r.data))return r.data.map(function(x){return x.key;}); }catch(e){} return []; }
// تاريخ الصورة (YYYY-MM-DD) لحساب عمرها من تنفيذها؛ null لو غير متاح.
function _imgDateOf(key){
  const p=String(key).split(":");
  if(p[0]==="simg") return /^\d{4}-\d{2}-\d{2}$/.test(p[2]||"")?p[2]:null;                 // simg:{emp}:{date}:{i}
  if(p[0]==="aimg"||p[0]==="aqimg"){ const list=cache["assign:"+p[1]]; if(Array.isArray(list)){ const a=list.find(function(x){return x&&x.id===p[2];}); if(a){ const ts=(p[0]==="aimg")?a.imgAt:a.qimgAt; if(ts)return new Date(ts).toISOString().slice(0,10); } } return null; }
  if(p[0]==="acadimg"){ const emp=(cfg&&cfg.employees||[]).find(function(x){return x.id===p[1];}); const ob=emp&&emp.onboard; const meta=ob&&ob.shots&&ob.shots[p[2]]&&ob.shots[p[2]][p[3]]; if(meta&&meta.at)return new Date(meta.at).toISOString().slice(0,10); return null; }
  return null;
}
// تسجيل عملية مسح في سجل النشاط (auditability)
async function logImgPurge(mode,count,catLabel){
  try{ if(!curUser)return; const day=today(),lk="log:"+day; let arr=cache[lk];arr=arr?JSON.parse(JSON.stringify(arr)):[]; arr.push({t:Date.now(),actor:(curUser.name||"؟"),action:"مسح صور ("+mode+")",detail:(catLabel||"")+" — "+count+" صورة"}); if(arr.length>800)arr.shift(); cache[lk]=arr; if(_sb){try{await _sb.from("app_data").upsert({key:lk,value:arr,updated_at:new Date().toISOString()},{onConflict:"key"});}catch(e){}} }catch(e){}
}
// ── مسح تلقائي (اختياري، معطّل افتراضيًا) — للمالك، مرة واحدة يوميًا، حسب إعدادات كل قسم ──
async function _purgeOldPhotos(){
  if(window.__demo||!window.__loadOK||!_sb)return;
  if(!curUser||!curUser.owner)return;              // للمالك فقط
  const P=cfg&&cfg.imgPurge; if(!P)return;
  try{
    const day=today();
    if(localStorage.getItem("cd:lastPhotoPurge")===day)return; // مرة واحدة يوميًا
    const toDel=[];
    for(const cat of IMG_CATS){
      if(cat.prot)continue;                        // الفواتير: مستثناة من التلقائي نهائيًا
      const c=P[cat.k]; if(!c||!c.enabled||!(Number(c.days)>=1))continue;
      const keys=await _imgKeys(cat.k);
      keys.forEach(function(k){ const d=_imgDateOf(k); if(d){ const age=daysBetween(d,day); if(age>=Number(c.days))toDel.push(k); } });
    }
    for(const k of toDel){ try{await sset(k,null);}catch(e){} }
    localStorage.setItem("cd:lastPhotoPurge",day);
    if(toDel.length){ console.log("[photo-purge] removed "+toDel.length+" old photo(s)"); logImgPurge("تلقائي",toDel.length,"حسب إعدادات الأقسام"); }
  }catch(e){console.error("photo purge failed",e);}
}
window.__purgeOldPhotos=_purgeOldPhotos;

// تصدير مجموعة صور كملف JSON قبل الحذف (اختياري)
async function _imgExport(keys,label){
  try{ const out={}; for(const k of keys){ const v=await sget(k); if(v)out[k]=v; }
    const blob=new Blob([JSON.stringify({_type:"clinic-images-export",_at:new Date().toISOString(),label:label,count:Object.keys(out).length,data:out})],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="clinic-images-"+String(label).replace(/\s+/g,"-")+"-"+today()+".json";a.click();
    return true;
  }catch(e){ return false; }
}
// مسح يدوي لقسم — بمعاينة عدد + عرض التصدير + تأكيد (نصّي للفواتير)
async function _imgManualDelete(catKey,olderThanDays){
  const cat=IMG_CATS.find(function(c){return c.k===catKey;}); if(!cat)return;
  const keys=await _imgKeys(catKey);
  const targets=keys.filter(function(k){
    if(!olderThanDays||olderThanDays<=0)return true;              // 0 = الكل
    const d=_imgDateOf(k); if(!d)return false;                    // من غير تاريخ → ما نمسحش (أأمن)
    return daysBetween(d,today())>=olderThanDays;
  });
  if(!targets.length){alert("مفيش صور مطابقة للمسح في «"+cat.label+"».");return;}
  // عرض التصدير كخيار قبل التأكيد
  const wantExport=confirm("هيتمسح "+targets.length+" صورة من «"+cat.label+"».\n\nتحب تنزّل نسخة (تصدير) الأول؟\n\n«موافق» = نزّل نسخة الأول · «إلغاء» = من غير تصدير");
  if(wantExport){ const ok=await _imgExport(targets,cat.label); if(!ok&&!confirm("تعذّر التصدير. تكمّل الحذف من غير نسخة؟"))return; }
  // تأكيد نهائي — الفواتير بتأكيد نصّي صريح
  if(cat.prot){ const word=prompt("⚠️ دي صور فواتير (مستندات مالية).\nللتأكيد اكتب كلمة: مسح"); if(String(word||"").trim()!=="مسح"){alert("اتلغى — لازم تكتب «مسح» بالظبط.");return;} }
  else { if(!confirm("تأكيد نهائي: مسح "+targets.length+" صورة من «"+cat.label+"»؟\n(السجلات بتفضل — الصور بس اللي بتتشال)"))return; }
  let done=0; for(const k of targets){ try{await sset(k,null);done++;}catch(e){} }
  await logImgPurge("يدوي",done,cat.label);
  alert("✔ اتمسح "+done+" صورة من «"+cat.label+"».");
  renderImgMgr();
}

  }).join("");
  box.querySelectorAll(".imgAutoTog").forEach(function(t){t.onchange=async function(){const k=t.dataset.k;cfg.imgPurge=cfg.imgPurge||{};cfg.imgPurge[k]=cfg.imgPurge[k]||{enabled:false,days:60};cfg.imgPurge[k].enabled=t.checked;await sset("config",cfg);};});

function lineChart(data){
 if(!data.length)return '<div class="muted">📭 لا توجد تسجيلات يومية الشهر ده.</div>';
 const w=Math.max(300,data.length*30+40),h=156,x0=30,base=h-22,top=14,maxY=100;
 const X=i=>x0+i*((w-x0-10)/Math.max(1,data.length-1)),Y=v=>base-(v/maxY)*(base-top);
 let grid="";[0,25,50,75,100].forEach(g=>{const y=Y(g);grid+=`<line x1="${x0}" y1="${y}" x2="${w-8}" y2="${y}" stroke="#eef3f8"/><text x="4" y="${y+4}" font-size="9" fill="#9aa7b4">${g}</text>`;});
 const pts=data.map((d,i)=>`${X(i)},${Y(d.y||0)}`).join(" ");
 const area=`${x0},${base} ${pts} ${X(data.length-1)},${base}`;
 const dots=data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.y||0)}" r="3.3" fill="#2E75B6"/><text x="${X(i)}" y="${base+13}" font-size="8" fill="#71808f" text-anchor="middle">${d.x}</text>`).join("");
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">${grid}<polygon points="${area}" fill="#2E75B6" opacity="0.08"/><polyline points="${pts}" fill="none" stroke="#2E75B6" stroke-width="2.5"/>${dots}</svg>`;}

  {id:"procedures",icon:"🦷",title:"تسلسل الإجراءات + دور الأسيستنت (Procedures)",goal:"تطلع حافظ تسلسل كل إجراء أساسي، وعارف بالظبط دورك في كل خطوة والأداة/المادة اللي تجهّزها.",
   sections:[
    {h:"أوبريتيف / حشو (Operative)",points:["1) تخدير → دورك: تجهّز السرنجة والكبسولة والجل السطحي.","2) عزل (Rubber dam/قطن) + سكشن → دورك: تحافظ على جفاف ورؤية المنطقة.","3) تحضير الكافيتي بالبَر → دورك: سكشن مستمر وتوجيه الإضاءة.","4) إيتش → شطف → تجفيف → بوندينج → تصليب → دورك: تناول كل مادة في وقتها وتشغّل الـ Light cure.","5) كمبوزيت طبقات + تصليب → ضبط العضّة بورق الـ Articulating → تلميع."]},
    {h:"إندو / علاج جذور (Endodontics)",points:["1) تخدير + عزل (Rubber dam ضروري).","2) فتح الحجرة (Access) بالبَر.","3) تنظيف وتوسيع القنوات بالفايلز + غسيل بالـ NaOCl → دورك: تجهّز الفايلز بالترتيب وتدير الغسيل والشفط.","4) تجفيف بالـ Paper points.","5) حشو القنوات (جوتا بركا + سيلر) → دورك: تجهّز الأقماع والسيلر.","6) حشو مؤقت أو دائم + أشعة للتأكد."]},
    {h:"إكستراكشن / خلع (Extraction)",points:["1) تخدير والتأكد من تنميله.","2) فك الرباط حوالين السن بالإليفيتور.","3) الخلع بالفورسبس المناسب للسن.","4) دورك: سكشن، تجهيز الشاش، ومتابعة المريض.","5) شاش للعض + تعليمات ما بعد الخلع (ثلج، تجنّب المضمضة القوية، الأدوية)."]},
    {h:"كراون / تركيبات (Crown & Bridge)",points:["1) تخدير وتحضير السن بالبَر.","2) إزاحة اللثة (Retraction cord) → أخذ الطبعة (سيليكون).","3) تحديد اللون (Shade).","4) تركيب تاج مؤقت بأسمنت مؤقت لحين النهائي.","5) جلسة تانية: تجربة وتثبيت النهائي بالأسمنت الدائم."]},
    {h:"سكيلينج / تنظيف (Scaling)",points:["إزالة الجير بالسكيلر فوق صوتي (Ultrasonic) + سكشن قوي.","تلميع بالـ Prophy paste والكوب المطاطي.","نصائح العناية المنزلية للمريض."]},
    {h:"قاعدة الأسيستنت الذكي",points:["لو فاهم التسلسل، بتجهّز الخطوة الجاية قبل ما الطبيب يطلبها.","ربط كل خطوة بأداتها ومادتها = تحضير سريع وإجراء سلس."]}

};

function acadDailyQ(e){const ob=e.onboard||{};const doneIds=Object.keys(ob.done||{});if(!doneIds.length)return null;const pool=[];acadUnits(e.role).forEach(u=>{if(doneIds.indexOf(u.id)>=0)(u.questions||[]).forEach(q=>pool.push(q));});if(!pool.length)return null;const seed=today().split("-").join("");const idx=parseInt(seed,10)%pool.length;return pool[idx];}

async function endOnboarding(e){
 if(!e)return;
 const prefix="acadimg:"+e.id+":";

 for(const k of keys){await sset(k,null);} // deletes from cache + Supabase

function isTrainee(emp){return emp&&emp.onboard&&emp.onboard.active;}
// Compute a realistic onboarding report from academy data + (optionally) work performance
function acadReport(emp){
 const ob=emp.onboard||{};const units=acadUnits(emp.role);
 const done=ob.done||{},ans=ob.ans||{},attempts=ob.attempts||{};
 const totalU=units.length;let doneU=0,totalQ=0,correctQ=0,wrongAttempts=0,answeredQ=0;
 const perUnit=units.map(u=>{const isD=!!done[u.id];if(isD)doneU++;
   let q=u.questions.length,c=0,wa=0;
   u.questions.forEach((qq,j)=>{totalQ++;const a=ans[u.id]&&ans[u.id][j];if(a){answeredQ++;}if(a&&a.ok){c++;correctQ++;}const at=(attempts[u.id]&&attempts[u.id][j])||0;wa+=at;wrongAttempts+=at;});
   return {id:u.id,title:u.title,icon:u.icon,done:isD,correct:c,total:q,wrong:wa,mastery:q?Math.round(c/q*100):0};});
 const curriculumPct=totalU?Math.round(doneU/totalU*100):0;
 const firstTryRate=answeredQ?Math.round((correctQ/(correctQ+wrongAttempts||1))*100):null; // null = لسه مفيش إجابات
 let dayN=1;if(ob.start){dayN=Math.max(1,Math.round((Date.now()-new Date(ob.start+"T00:00:00").getTime())/86400000)+1);}
 const expectedPct=Math.min(Math.round(dayN/14*100),100);
 const pace=curriculumPct-expectedPct;
 const weak=perUnit.filter(u=>!u.done).slice(0,3);
 // trainer rating average (across days, across dims) → 0..100
 let trAvg=null;const rdays=Object.keys(ob.ratings||{});if(rdays.length){let sum=0,cnt=0;rdays.forEach(d=>{const r=ob.ratings[d];["initiative","clean","manner","speed"].forEach(k=>{if(r[k]){sum+=r[k];cnt++;}});});if(cnt)trAvg=Math.round(sum/cnt/5*100);}
 const base={dayN,curriculumPct,expectedPct,firstTryRate,perUnit,weak,doneU,totalU,answeredQ,totalQ,trAvg,exam:ob.exam||null,phase:dayN<=7?"النصف الأول":"النصف الثاني"};
 // ---- DATA-DRIVEN VERDICT: don't judge without real input ----
 // "engagement" = how much of the curriculum questions he actually attempted
 const engagement=totalQ?Math.round(answeredQ/totalQ*100):0;
 if(answeredQ===0){
   return Object.assign(base,{pace:null,verdict:"لسه ما بدأش",vcolor:"#5b6b80",vemoji:"⏳",vnote:"الموظف لسه مدخلش أي بيانات في المنهج — مفيش أساس للحكم. متابعة فقط لحد ما يبدأ."});
 }
 if(engagement<25){
   return Object.assign(base,{pace:null,verdict:"بدري على الحكم",vcolor:"#5b6b80",vemoji:"🌱",vnote:`لسه في بداية التعلّم (${answeredQ} من ${totalQ} سؤال). البيانات قليلة — استنى يتقدّم أكتر قبل أي تقييم.`});
 }
 // enough engagement → real verdict
 let verdict,vcolor,vemoji,vnote;
 if(curriculumPct>=100&&firstTryRate>=75){verdict="متقدّم بقوة";vcolor="#2E8B57";vemoji="🌟";vnote="أتقن المنهج بفهم سريع — جاهز ويُعتمد عليه.";}
 else if(pace>=-10&&firstTryRate>=55){verdict="ماشي كويس";vcolor="#2e7d6f";vemoji="🟢";vnote="تقدّمه في المسار الطبيعي — كمّل متابعة بسيطة.";}
 else if(pace>=-30||firstTryRate>=40){verdict="يحتاج متابعة";vcolor="#b87900";vemoji="⚠️";vnote="أبطأ من المتوقّع أو فهمه محتاج دعم — ركّز على نقاط ضعفه.";}
 else {verdict="ضعيف — راجع القرار";vcolor="#b23b30";vemoji="❌";vnote="تقدّم ضعيف وفهم متعثّر رغم محاولات كافية — قيّم جدوى الاستمرار.";}
 return Object.assign(base,{pace,verdict,vcolor,vemoji,vnote});
}

        <label class="btn sm ghost" style="cursor:pointer;font-size:12px">${it.img?"📷 تغيير":"📷 صورة"}<input type="file" accept="image/*" class="itImg" data-si="${si}" data-ii="${ii}" style="display:none"></label>

 const sync=()=>{ // pull DOM values into p before structural changes

async function renderPrepRun(id){
 const arr=await getPrep();const p=arr.find(x=>x.id===id);if(!p)return renderPrepList();
 const stKey=`prepRun:${curUser.empId||curUser.id}:${id}:${today()}`;
 let state=(await sget(stKey))||{checked:{}};
 const draw=()=>{
   let totalEss=0,doneEss=0,total=0,done=0;
   p.sections.forEach(s=>(s.items||[]).forEach(it=>{total++;if(it.essential)totalEss++;if(state.checked[it.id]){done++;if(it.essential)doneEss++;}}));
   const allEss=totalEss===0||doneEss===totalEss;
   $("prepBody").innerHTML=`<div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button class="btn sm ghost" id="prepBack">→ رجوع</button><b style="flex:1;font-size:17px">${esc(p.name)}</b></div>
     <div class="brk" style="margin-top:10px"><div class="t"><span>التقدّم</span><b>${done}/${total}</b></div><div class="bar"><i style="width:${total?Math.round(done/total*100):0}%;background:${done===total&&total?'#2E8B57':'var(--accent)'}"></i></div></div>
     ${allEss?(done===total?'<div class="warnrow warn-info" style="background:#eef6f2;border-color:#2E8B57;margin-top:8px">✅ التحضير كامل — كل العناصر اتجهّزت.</div>':'<div class="warnrow warn-info" style="background:#eef6f2;border-color:#2E8B57;margin-top:8px">✅ كل العناصر الأساسية جاهزة.</div>'):`<div class="warnrow warn-urgent" style="margin-top:8px">⚠️ لسه ${totalEss-doneEss} عنصر أساسي ناقص — حضّرهم قبل ما تبدأ.</div>`}</div>
     ${p.sections.map((s,si)=>`<div class="card"><h3 style="font-size:15px">${si+1}. ${esc(s.title||"قسم")}</h3>${(s.items||[]).map(it=>`<label class="task" style="align-items:center"><input type="checkbox" class="runChk" data-id="${it.id}" ${state.checked[it.id]?"checked":""}><span style="flex:1">${esc(it.name)} ${it.essential?'<span class="pill" style="background:#c0504d;font-size:9px;padding:0 6px">أساسي</span>':""}</span>${it.img?`<img src="${it.img}" class="runImg" data-id="${it.id}" style="width:36px;height:36px;border-radius:6px;object-fit:cover;cursor:pointer">`:""}</label>`).join("")}</div>`).join("")}
     <div class="card" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="prepReset">↺ إعادة التعيين</button><span class="muted" style="align-self:center" id="runMsg"></span></div>`;
   $("prepBack").onclick=()=>renderPrepList();
   $("prepReset").onclick=async()=>{state={checked:{}};await sset(stKey,state);draw();};
   $("prepBody").querySelectorAll(".runChk").forEach(c=>c.onchange=async()=>{state.checked[c.dataset.id]=c.checked;if(!c.checked)delete state.checked[c.dataset.id];await sset(stKey,state);draw();});
   $("prepBody").querySelectorAll(".runImg").forEach(im=>im.onclick=()=>{let it=null;p.sections.forEach(s=>(s.items||[]).forEach(x=>{if(x.id===im.dataset.id)it=x;}));if(it&&it.img)showImg(it.img,it.name);});
 };
 draw();
}

 {let ct=0,rt=0;for(const e of emps){const sKeys=await slist(`selfcheck:${e.id}:`);for(const sk of sKeys){const dt=sk.split(":")[2]||"";if(dt.slice(0,7)!==month)continue;const sc=await sget(sk);if(!sc||!sc.tasks)continue;const dd=await sget(`daily:${e.id}:${dt}`);const rev=(dd&&dd.reviewed)||{};Object.keys(sc.tasks).forEach(i=>{if(sc.tasks[i]&&sc.tasks[i].done){ct++;if(rev[i])rt++;}});}}out.coverage=ct?Math.round(rt/ct*100):0;}

}

// Most recent completion of a periodic task across all employees in the same role.
// Looks at both manager-approved (daily) and employee-confirmed (selfcheck) records.
function lastPeriodicDone(role,i){
  let best=null;const emps=(cfg.employees||[]).filter(x=>x.role===role);
  emps.forEach(emp=>{Object.keys(cache).forEach(k=>{
    let date=null;
    if(k.indexOf("daily:"+emp.id+":")===0){const v=cache[k];if(v&&v.tasks&&v.tasks[i])date=k.split(":")[2];}
    else if(k.indexOf("selfcheck:"+emp.id+":")===0){const v=cache[k];if(v&&v.tasks&&v.tasks[i]&&v.tasks[i].done)date=k.split(":")[2];}
    if(date&&(!best||date>best.date))best={date,name:emp.name};
  });});
  return best;
}
// Most recent MANAGER-APPROVED completion only (daily records) — ignores employee self-claims.
// Used to decide due/done state so a task moves to «المنجزة» only after the manager approves.
function lastApprovedPeriodic(role,i){
  let best=null;const emps=(cfg.employees||[]).filter(x=>x.role===role);
  emps.forEach(emp=>{Object.keys(cache).forEach(k=>{
    if(k.indexOf("daily:"+emp.id+":")===0){const v=cache[k];if(v&&v.tasks&&v.tasks[i]){const date=k.split(":")[2];if(!best||date>best.date)best={date,name:emp.name};}}
  });});
  return best;
}
// Latest period completion where BOTH the employee confirmed (selfcheck) AND the manager approved (daily) on the same day.
// Used in the EMPLOYEE view so a task moves to «المنجزة» only after both sides confirm.
function lastConfirmedPeriodic(role,i){
  let best=null;const emps=(cfg.employees||[]).filter(x=>x.role===role);
  emps.forEach(emp=>{Object.keys(cache).forEach(k=>{
    if(k.indexOf("daily:"+emp.id+":")===0){const v=cache[k];if(v&&v.tasks&&v.tasks[i]){const date=k.split(":")[2];const sc=cache["selfcheck:"+emp.id+":"+date];if(sc&&sc.tasks&&sc.tasks[i]&&sc.tasks[i].done){if(!best||date>best.date)best={date,name:emp.name};}}}
  });});
  return best;
}
// Due-window status for a periodic task. Window = 3 days before next due → 3 days after.
const DUE_PAD=3;
function daysBetween(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);}
function addDays(d,n){const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function periodicStatus(t,lastDate){
  const P=freqDays(t),tdy=today();
  if(!lastDate){return {state:"due",label:"🔔 موعدها دلوقتي",c:"#b06a16",bg:"#fff3e6"};}
  const nextDue=addDays(lastDate,P);const diff=daysBetween(tdy,nextDue); // +ve = days remaining
  if(diff>DUE_PAD)return {state:"upcoming",label:`🗓️ جايّة بعد ${diff} يوم`,c:"#7a8794",bg:"#f1f4f6",nextDue};
  if(diff>=-DUE_PAD)return {state:"due",label:"🔔 موعدها دلوقتي",c:"#b06a16",bg:"#fff3e6",nextDue};
  return {state:"overdue",label:`⚠️ فات موعدها بـ ${-diff-DUE_PAD} يوم`,c:"#c0504d",bg:"#fdeceb",nextDue};
}

// Owner-only ("godlike") evaluation override: type a score (0-100) for any component to replace
// the auto-computed value. Empty fields stay automatic. Stored per employee per month.
async function editScores(empId,month){
 if(!curUser||!curUser.owner)return;
 const ovr=(await sget(`override:${empId}:${month}`))||{};
 const m=await computeMonth(empId,month);
 const fields=[["completion","إنجاز المهام"],["fanni","التقييم الفني (فني)"],["solooki","التقييم السلوكي (سلوكي)"],["ibda3","الإبداع والمبادرة (مبادرة)"],["attend","الالتزام بالمواعيد"],["tashghil","حجم التشغيل"]];
 let ov=document.getElementById("scoreEditOv");if(ov)ov.remove();
 ov=document.createElement("div");ov.id="scoreEditOv";
 ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto";
 ov.innerHTML=`<div style="background:#fff;border-radius:14px;max-width:380px;width:100%;padding:18px;direction:rtl;font-family:inherit;box-shadow:0 12px 40px rgba(0,0,0,.3)">
   <div style="font-weight:800;font-size:16px;margin-bottom:2px">⬇ حد أدنى لتقييم ${esc(m.e.name)} — ${month}</div>
   <div style="font-size:12px;color:#888;margin-bottom:14px">اكتب حد أدنى (٠–١٠٠) لأي مكوّن. المكوّن مش هينزل تحته، ولو الأداء التلقائي أعلى بياخد الأعلى. سيب الحقل فاضي يفضل تلقائي.</div>
   ${fields.map(([k,lbl])=>`<div style="margin-bottom:10px"><label style="font-size:13px;font-weight:600;display:block;margin-bottom:3px">${lbl}</label>
     <input type="number" min="0" max="100" id="ov_${k}" value="${ovr[k]!=null?ovr[k]:""}" placeholder="تلقائي: ${m[k]==null?'—':Math.round(m[k])}" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:8px"></div>`).join("")}
   <div style="display:flex;gap:8px;margin-top:8px">
     <button class="btn" id="oeSave" style="flex:1">💾 حفظ</button>
     <button class="btn ghost" id="oeCancel" style="flex:1">إلغاء</button>
   </div></div>`;
 document.body.appendChild(ov);
 ov.onclick=e=>{if(e.target===ov)ov.remove();};
 ov.querySelector("#oeCancel").onclick=()=>ov.remove();
 ov.querySelector("#oeSave").onclick=async()=>{
   const obj={};
   fields.forEach(([k])=>{const raw=ov.querySelector("#ov_"+k).value.trim();if(raw!==""){let n=Math.round(+raw);if(isNaN(n))return;if(n<0)n=0;if(n>100)n=100;obj[k]=n;}});
   obj.editedBy=curUser.id;obj.editedAt=Date.now();
   const hasAny=Object.keys(obj).some(k=>k!=="editedBy"&&k!=="editedAt"&&obj[k]!=null);
   await sset("override:"+empId+":"+month,hasAny?obj:null);
   if(_monthClosed(month)){ await evalUnlock(empId,month); } // تعديل مقصود من المالك على شهر مقفول → يفكّ القفل فيتطبّق ويتجمّد تاني
   ov.remove();subProfile();
 };
}

// Owner-only ("godlike") attendance override: rewrite a day's check-in/out or mark it absent.
async function editAttDay(empId,date){
 if(!curUser||!curUser.owner)return;
 const sc=(await sget(`selfcheck:${empId}:${date}`))||{};
 const inHM=sc.inAt?new Date(sc.inAt).toTimeString().slice(0,5):"";
 const outHM=sc.outAt?new Date(sc.outAt).toTimeString().slice(0,5):"";
 const absent=!sc.inAt;
 let ov=document.getElementById("attEditOv");if(ov)ov.remove();
 ov=document.createElement("div");ov.id="attEditOv";
 ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px";
 ov.innerHTML=`<div style="background:#fff;border-radius:14px;max-width:340px;width:100%;padding:18px;direction:rtl;font-family:inherit;box-shadow:0 12px 40px rgba(0,0,0,.3)">
   <div style="font-weight:800;font-size:16px;margin-bottom:2px">✏️ تعديل حضور ${date}</div>
   <div style="font-size:12px;color:#888;margin-bottom:14px">تعديل المدير العام — بيكتب فوق تسجيل الموظف.</div>
   <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;cursor:pointer"><input type="checkbox" id="aeAbsent" ${absent?"checked":""}> اعتبار اليوم غياب</label>
   <div id="aeTimes" style="${absent?'opacity:.4;pointer-events:none':''}">
     <label style="font-size:13px;font-weight:600">وقت الحضور</label>
     <input type="time" id="aeIn" value="${inHM||'09:00'}" style="width:100%;margin:4px 0 10px;padding:7px;border:1px solid var(--line);border-radius:8px">
     <label style="font-size:13px;font-weight:600">وقت الانصراف</label>
     <input type="time" id="aeOut" value="${outHM}" style="width:100%;margin:4px 0 4px;padding:7px;border:1px solid var(--line);border-radius:8px">
     <div style="font-size:11px;color:#999">سيب الانصراف فاضي لو لسه ما انصرفش.</div>
   </div>
   <div style="display:flex;gap:8px;margin-top:18px">
     <button class="btn" id="aeSave" style="flex:1">💾 حفظ</button>
     <button class="btn ghost" id="aeCancel" style="flex:1">إلغاء</button>
   </div></div>`;
 document.body.appendChild(ov);
 const absChk=ov.querySelector("#aeAbsent"),times=ov.querySelector("#aeTimes");
 absChk.onchange=()=>{times.style.opacity=absChk.checked?".4":"";times.style.pointerEvents=absChk.checked?"none":"";};
 ov.onclick=e=>{if(e.target===ov)ov.remove();};
 ov.querySelector("#aeCancel").onclick=()=>ov.remove();
 ov.querySelector("#aeSave").onclick=async()=>{
   const rec=Object.assign({},sc);
   if(absChk.checked){rec.inAt=null;rec.outAt=null;}
   else{
     const inv=ov.querySelector("#aeIn").value||"09:00";rec.inAt=new Date(date+"T"+inv+":00").toISOString();
     const outv=ov.querySelector("#aeOut").value;rec.outAt=outv?new Date(date+"T"+outv+":00").toISOString():null;
   }
   rec.editedBy=curUser.id;rec.editedAt=Date.now();
   await sset("selfcheck:"+empId+":"+date,rec);
   ov.remove();subProfile();
 };
}

/* TASKS management */
let taskRole="receptionist";
let taskDraft=null;      // مسودّة التعديلات — بتفضل في الذاكرة لحد ما تحفظ أو تتجاهل (متضيعش لو غيّرت الصفحة/التاب)

let _taskGuardSet=false; // تحذير قبل إغلاق/تحديث الصفحة اتسجّل مرة واحدة؟
function _taskDraftInit(){ if(!taskDraft) taskDraft=JSON.parse(JSON.stringify(cfg.tasks||{receptionist:[],assistant:[]})); ["receptionist","assistant"].forEach(k=>{if(!Array.isArray(taskDraft[k]))taskDraft[k]=[];}); }
function _taskMarkDirty(){ taskDirty=true; _taskRenderBar(); }
function _taskRenderBar(){
 const bar=$("tSaveBar"); if(!bar)return;
 bar.style.display="flex";
 if(taskDirty){
   bar.style.background="#fff5e6"; bar.style.borderColor="#e0a83e";
   bar.innerHTML=`<span style="flex:1;color:#8a5a00;font-weight:700;font-size:13px">⚠️ فيه تعديلات في المهام لسه مش محفوظة</span>
     <button class="btn sm" id="tSaveAll">💾 احفظ التغييرات</button>
     <button class="btn sm ghost" id="tDiscard">↩ تجاهل</button>`;
   const sv=$("tSaveAll"); if(sv)sv.onclick=async()=>{ sv.disabled=true; sv.textContent="⏳ بيحفظ…"; await _taskSaveAll(); };
   const ds=$("tDiscard"); if(ds){let arm=false;ds.onclick=()=>{ if(!arm){arm=true;ds.textContent="تأكيد التجاهل؟";setTimeout(()=>{arm=false;ds.textContent="↩ تجاهل";},3000);return;} taskDraft=JSON.parse(JSON.stringify(cfg.tasks)); taskDirty=false; subTasks(); };}
 } else {
   bar.style.background="#eef7f2"; bar.style.borderColor="#bfe0cf";
   bar.innerHTML=`<span style="color:#1f6b4a;font-weight:700;font-size:13px">✅ كل تعديلات المهام محفوظة</span>`;
 }
}
async function _taskSaveAll(){
 // حفظ المسودّة كلها (الدورين) مرة واحدة. normTasks بتظبّط أي id/ord ناقص وتحافظ على الأرشفة.
 // ملاحظة: بنكتب على مفتاح config الواحد زي أي إعداد تاني — آخر كتابة بتغلب (نفس سلوك باقي الإعدادات).
 cfg.tasks=normTasks(taskDraft);
 TASKS=cfg.tasks;
 await sset("config",cfg);
 taskDraft=JSON.parse(JSON.stringify(cfg.tasks));
 taskDirty=false;
 subTasks();
}
function subTasks(){
 _taskDraftInit();
 if(!_taskGuardSet){ _taskGuardSet=true; window.addEventListener("beforeunload",function(e){ if(taskDirty){ e.preventDefault(); e.returnValue=""; return ""; } }); }
 const sv=$("sub");
 sv.innerHTML=`<div class="card"><h3>${ic("tasks")} إدارة المهام اليومية</h3>
   <div id="tSaveBar" style="display:flex;align-items:center;gap:8px;border:1px solid #bfe0cf;border-radius:10px;padding:8px 12px;margin-bottom:10px"></div>
   <div class="row" style="margin-bottom:8px"><div><label>الدور</label><select id="tRole">
     <option value="receptionist" ${taskRole==="receptionist"?"selected":""}>استقبال</option>
     <option value="assistant" ${taskRole==="assistant"?"selected":""}>مساعدة طبيب</option></select></div>
     <div class="muted" style="align-self:center;max-width:520px">عدّل، أضِف، أو أعِد ترتيب المهام براحتك — التعديلات <b>مش بتتحفظ إلا لما تدوس «احفظ التغييرات»</b>. الحذف بيأرشِف المهمة (بيشيلها من العرض والحساب) من غير ما يمسّ أي سجل إنجاز قديم. إعادة الترتيب بتغيّر شكل العرض بس ومابتلمسش البيانات.</div></div>
   <div id="tList"></div>
   <div id="tArchived"></div>
   <div class="row" style="margin-top:10px"><input id="tNew" placeholder="مهمة جديدة" style="flex:1;min-width:200px"><select id="tNewFreq"><option value="daily">📆 يومي</option><option value="weekly">🗓️ أسبوعي</option><option value="monthly">📅 شهري</option><option value="custom">🔁 مخصّص…</option></select><span id="tNewCustom" style="display:none;align-items:center;gap:4px">كل <input id="tNewEvery" type="number" min="1" value="3" style="width:60px"><select id="tNewUnit"><option value="day">يوم</option><option value="week" selected>أسبوع</option><option value="month">شهر</option></select></span><select id="tNewDim" title="البُعد"><option value="fanni">⚙️ فني</option><option value="solooki">🤝 سلوكي</option><option value="ibda3">💡 مبادرة</option></select><button class="btn sm" id="tAdd">➕ إضافة مهمة</button><span class="ok" id="tMsg"></span></div>

   <div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:10px"><button class="btn sm ghost" id="tRestore">↺ استرجاع المهام الافتراضية المطوّرة</button><div class="muted" style="font-size:11.5px;margin-top:5px">بيستبدل مهام «${roleName(taskRole)}» في المسودّة بالقائمة الافتراضية المصنّفة بالمحاور — ومش هيتطبّق غير لما تحفظ.</div></div></div>`;
 $("tRole").onchange=()=>{taskRole=$("tRole").value;subTasks();}; // المسودّة بتحتفظ بتعديلات الدورين، فمفيش ضياع عند التبديل
 const tnf=$("tNewFreq"),tnc=$("tNewCustom");if(tnf)tnf.onchange=()=>{tnc.style.display=tnf.value==="custom"?"inline-flex":"none";};
 renderTaskList();
 _taskRenderBar();
 $("tAdd").onclick=()=>{const t=$("tNew").value.trim();if(!t)return;const fr=$("tNewFreq").value;const arr=taskDraft[taskRole];const maxOrd=arr.reduce((m,x)=>Math.max(m,(typeof x.ord==="number"?x.ord:0)),-1);const obj={id:_mkTaskId(arr.length),name:t,freq:fr,dim:$("tNewDim").value,ord:maxOrd+1,archived:false,createdAt:Date.now()};if(fr==="custom"){obj.every=+$("tNewEvery").value||1;obj.unit=$("tNewUnit").value;}arr.push(obj);$("tNew").value="";const tm=$("tMsg");if(tm){tm.textContent="✔ اتضافت للمسودّة — دوس «احفظ التغييرات»";setTimeout(()=>{tm.textContent="";},2600);}_taskMarkDirty();renderTaskList();};

function renderTaskList(){
 const arr=taskDraft[taskRole]||[];
 const grip='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';

 // data-i = الـ index التخزيني الثابت (هوية المهمة للتاريخ). العرض بيتفرز بالـ ord بس.
 const active=arr.map((t,i)=>({t,i})).filter(x=>!x.t.archived).sort((a,b)=>ordOf(a.t)-ordOf(b.t)||a.i-b.i);

   <input class="tEdit" value="${esc(t.name)}" style="flex:1;min-width:150px"><select class="tFreq"><option value="daily" ${t.freq==="daily"?"selected":""}>📆 يومي</option><option value="weekly" ${t.freq==="weekly"?"selected":""}>🗓️ أسبوعي</option><option value="monthly" ${t.freq==="monthly"?"selected":""}>📅 شهري</option><option value="custom" ${t.freq==="custom"?"selected":""}>🔁 مخصّص…</option></select><span class="tCustom" style="display:${t.freq==="custom"?"inline-flex":"none"};align-items:center;gap:4px">كل <input class="tEvery" type="number" min="1" value="${t.every||3}" style="width:54px"><select class="tUnit"><option value="day" ${t.unit==="day"?"selected":""}>يوم</option><option value="week" ${(t.unit||"week")==="week"?"selected":""}>أسبوع</option><option value="month" ${t.unit==="month"?"selected":""}>شهر</option></select></span><select class="tDim" title="البُعد اللي بتقيسه المهمة">${[["fanni","⚙️ فني"],["solooki","🤝 سلوكي"],["ibda3","💡 مبادرة"]].map(([v,l])=>`<option value="${v}" ${dimOfTask(t)===v?"selected":""}>${l}</option>`).join("")}</select><button class="btn sm ghost tDel" title="أرشفة المهمة">🗑️</button></div>`;}).join("")||'<div class="muted">مفيش مهام نشِطة — ضيف مهمة من تحت.</div>';
 $("tArchived").innerHTML = archived.length ? `<div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:8px"><div class="muted" style="font-size:12px;margin-bottom:6px">🗄️ مهام مؤرشفة (${archived.length}) — مش بتظهر للموظف ولا بتتحسب، بس محفوظة عشان سجلّاتها القديمة تفضل سليمة:</div>${archived.map(({t,i})=>`<div class="qrow" data-i="${i}" style="border:1px dashed var(--line);border-radius:9px;padding:7px 9px;margin-bottom:5px;background:#fafafa;display:flex;align-items:center;gap:8px"><span style="flex:1;font-size:13px;color:#6a6a6a">${esc(t.name)} <span class="muted" style="font-size:11px">· ${freqLabel(t)}</span></span><button class="btn sm ghost tRestoreOne" data-i="${i}">↩ استرجاع</button></div>`).join("")}</div>` : "";
 $("tArchived").querySelectorAll(".tRestoreOne").forEach(b=>{b.onclick=()=>{const i=+b.dataset.i;const t=taskDraft[taskRole][i];if(t){t.archived=false;t.archivedAt=null;t.archivedBy=null;}_taskMarkDirty();renderTaskList();};});
 const listEl=$("tList");
 const rows=()=>Array.from(listEl.querySelectorAll(".trow"));
 // مزامنة صف DOM → المسودّة (بالـ index الثابت)
 const syncRow=r=>{const i=+r.dataset.i;const t=taskDraft[taskRole][i];if(!t)return;t.name=r.querySelector(".tEdit").value.trim()||"مهمة";t.freq=r.querySelector(".tFreq").value;if(r.querySelector(".tDim"))t.dim=r.querySelector(".tDim").value;if(t.freq==="custom"){t.every=+r.querySelector(".tEvery").value||1;t.unit=r.querySelector(".tUnit").value;}else{delete t.every;delete t.unit;}};
 // إعادة الترتيب = تحديث ord (ترتيب العرض) فقط. مصفوفة التخزين ما تتحركش → الـ index ثابت → التاريخ سليم.
 const applyOrder=()=>{rows().forEach((r,pos)=>{const i=+r.dataset.i;if(taskDraft[taskRole][i])taskDraft[taskRole][i].ord=pos;});};
 // drag-and-drop (pointer events: touch + mouse)
 let dragEl=null;
 const afterEl=y=>{let best={off:-Infinity,el:null};rows().filter(r=>r!==dragEl).forEach(el=>{const b=el.getBoundingClientRect();const off=y-(b.top+b.height/2);if(off<0&&off>best.off)best={off,el};});return best.el;};
 const onMove=e=>{if(!dragEl)return;const y=e.clientY;const after=afterEl(y);if(after==null)listEl.appendChild(dragEl);else listEl.insertBefore(dragEl,after);};
 const onUp=()=>{document.removeEventListener("pointermove",onMove);document.removeEventListener("pointerup",onUp);if(dragEl){dragEl.classList.remove("dragging");dragEl=null;applyOrder();_taskMarkDirty();renderTaskList();}};
 listEl.querySelectorAll(".thandle").forEach(h=>{h.onpointerdown=e=>{e.preventDefault();dragEl=h.closest(".trow");dragEl.classList.add("dragging");document.addEventListener("pointermove",onMove);document.addEventListener("pointerup",onUp);};});
 listEl.querySelectorAll(".trow").forEach(row=>{
   const freqI=row.querySelector(".tFreq");
   const onEdit=()=>{syncRow(row);_taskMarkDirty();};
   const nameI=row.querySelector(".tEdit"); if(nameI)nameI.oninput=onEdit;
   if(freqI)freqI.onchange=()=>{const c=row.querySelector(".tCustom");c.style.display=freqI.value==="custom"?"inline-flex":"none";onEdit();};
   const dimI=row.querySelector(".tDim"); if(dimI)dimI.onchange=onEdit;
   const evI=row.querySelector(".tEvery"); if(evI)evI.oninput=onEdit;
   const unI=row.querySelector(".tUnit"); if(unI)unI.onchange=onEdit;
   let armed=false;const del=row.querySelector(".tDel");
   del.onclick=()=>{if(!armed){armed=true;del.textContent="تأكيد الأرشفة؟";del.style.background="#c0504d";del.style.color="#fff";del.style.borderColor="#c0504d";setTimeout(()=>{armed=false;del.textContent="🗑️";del.style.background="";del.style.color="";del.style.borderColor="";},3000);return;}const i=+row.dataset.i;const t=taskDraft[taskRole][i];if(t){t.archived=true;t.archivedAt=Date.now();t.archivedBy=(curUser&&curUser.id)||null;}_taskMarkDirty();renderTaskList();};
 });
}
