services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinicos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicos"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: >
      postgres
      -c shared_preload_libraries=
      -c max_connections=100

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    image: clinicos-app:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicos
      SPRING_DATASOURCE_USERNAME: app_rw
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      CLINICOS_STORAGE_ENDPOINT: http://minio:9000
      CLINICOS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      CLINICOS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CLINICOS_STORAGE_BUCKET: clinicos-attachments
      TZ: ${TZ:-Africa/Cairo}

volumes:
  postgres_data:
  minio_data:
