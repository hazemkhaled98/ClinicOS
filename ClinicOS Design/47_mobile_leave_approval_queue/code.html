<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبات الإجازة</title>
  <link rel="stylesheet" href="../../apps/api/target/classes/static/css/app.css">
</head>
<body class="min-h-screen bg-surface text-on-surface antialiased">
  <main class="px-4 py-5 max-w-md mx-auto space-y-5">
    <header class="space-y-1.5"><h1 class="text-2xl font-extrabold text-teal-900">طلبات الإجازة</h1><p class="text-xs text-on-surface-variant">اعتمد أو ارفض طلبات فريقك</p></header>
    <a class="clinicos-btn clinicos-btn--secondary w-full" href="/leaves/me">إجازاتي</a>
    <section class="space-y-3">
      <h2 class="text-sm font-bold">بانتظار الاعتماد</h2>
      <article class="clinicos-card p-4 space-y-3">
        <span class="clinicos-chip clinicos-chip--warning">بانتظار قرارك</span>
        <h3 class="text-base font-bold text-teal-900">سارة</h3>
        <p class="text-xs text-on-surface-variant">12 أكتوبر 2026 — 14 أكتوبر 2026</p>
        <p class="text-sm text-on-surface-variant">ظرف عائلي</p>
        <input class="clinicos-input" placeholder="سبب الرفض">
        <div class="grid grid-cols-2 gap-2"><button class="clinicos-btn">اعتماد</button><button class="clinicos-btn clinicos-btn--danger">رفض</button></div>
      </article>
    </section>
  </main>
</body>
</html>
