<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="osBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2e29"/>
      <stop offset="100%" stop-color="#051a17"/>
    </linearGradient>
    <linearGradient id="osTrace" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="toothFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf9"/>
    </linearGradient>
    <filter id="osGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#34d399" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="160" height="160" rx="36" fill="url(#osBg)"/>
  <rect x="1.5" y="1.5" width="157" height="157" rx="34.5" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Subtle OS Motherboard / Grid Lines Watermark -->
  <path d="M28,80 L44,80 M116,80 L132,80 M80,28 L80,42 M80,120 L80,132" stroke="#10b981" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="28" cy="80" r="2" fill="#10b981" opacity="0.25"/>
  <circle cx="132" cy="80" r="2" fill="#10b981" opacity="0.25"/>
  <circle cx="80" cy="28" r="2" fill="#10b981" opacity="0.25"/>
  <circle cx="80" cy="132" r="2" fill="#10b981" opacity="0.25"/>

  <!-- Core Mark -->
  <g transform="translate(80, 80)">
    <!-- Clear Crisp Architectural Tooth Silhouette -->
    <path d="M-32,-26 C-22,-38 -2,-32 0,-24 C2,-32 22,-38 32,-26 C42,-16 44,6 36,22 C30,36 21,46 15,46 C10,46 10,32 7,18 C4,6 -4,6 -7,18 C-10,32 -10,46 -15,46 C-21,46 -30,36 -36,22 C-44,6 -42,-16 -32,-26 Z" 
          fill="url(#toothFill)"/>

    <!-- OS Architecture Elements: Core Kernel Ring (The "O" in ClinicOS) nestled inside the tooth crown -->
    <circle cx="0" cy="-6" r="14" fill="none" stroke="#0a2e29" stroke-width="2.5" stroke-dasharray="3 2" opacity="0.4"/>
    <circle cx="0" cy="-6" r="7" fill="#0a2e29" opacity="0.08"/>
    <circle cx="0" cy="-6" r="3" fill="#0a2e29" opacity="0.6"/>

    <!-- OS Tracking Bus / System Pipeline Ascending to Success -->
    <!-- Starts from left root node, routes through the central OS core, and rockets upward through the right cusp -->
    <path d="M-20,24 L-20,10 L-6, -6 L0,-6 L14,-6 L24,-20 L38,-38" 
          fill="none" stroke="url(#osTrace)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- System Bus Nodes / Terminal Logic Gates -->
    <circle cx="-20" cy="24" r="3.5" fill="#0a2e29"/>
    <circle cx="-20" cy="24" r="1.5" fill="#34d399"/>

    <circle cx="-6" cy="-6" r="3" fill="#0a2e29"/>
    <circle cx="-6" cy="-6" r="1.2" fill="#10b981"/>

    <circle cx="14" cy="-6" r="3" fill="#0a2e29"/>
    <circle cx="14" cy="-6" r="1.2" fill="#10b981"/>

    <circle cx="24" cy="-20" r="3.5" fill="#0a2e29"/>
    <circle cx="24" cy="-20" r="1.5" fill="#34d399"/>

    <!-- Apex Success Target: Sparkling OS System Beacon -->
    <circle cx="38" cy="-38" r="6.5" fill="#10b981" filter="url(#osGlow)"/>
    <circle cx="38" cy="-38" r="3" fill="#ffffff"/>
    
    <!-- Success Beacon Crosshair / Sparkle -->
    <path d="M38,-48 L38,-44 M38,-32 L38,-28 M28,-38 L32,-38 M44,-38 L48,-38" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
